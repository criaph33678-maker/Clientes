<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <title>Gestor Business - Dark Edition</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root { 
            --bg: #090d16; 
            --card: #131b2e; 
            --card-brd: #1e293b; 
            --text: #f8fafc; 
            --text-sub: #94a3b8;
            
            --primary: #2563eb;
            --danger: #ef4444;
            --warning: #eab308;
            --success: #10b981;
            
            --shadow-md: 0 4px 14px rgba(0,0,0,0.5);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.7);
        }
        
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; overflow: hidden; }

        /* LOGIN DARK */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100vw; background: #05070a; padding: 20px; position: relative; z-index: 5000; }
        .login-card { background: var(--card); padding: 36px 28px; border-radius: 28px; width: 100%; max-width: 320px; text-align: center; border: 1px solid var(--card-brd); box-shadow: var(--shadow-lg); }
        .login-card h2 { color: var(--text); font-size: 22px; font-weight: 800; margin-top: 0; margin-bottom: 24px; }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--card-brd); background: #0b0f19; color: var(--text); margin-bottom: 14px; outline: none; font-size: 14px; font-weight: 600; }
        .login-card input:focus { border-color: var(--primary); }
        .remember-box { display: flex; align-items: center; gap: 10px; color: var(--text-sub); font-size: 13px; margin-bottom: 24px; cursor: pointer; font-weight: 600; }
        .remember-box input { accent-color: var(--primary); width: 18px; height: 18px; }
        
        .btn-login-3d { background: var(--primary); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }

        /* APP MAIN DARK */
        #app { display: none; height: 100vh; width: 100vw; flex-direction: column; background: var(--bg); }

        .header-fixo { background: rgba(19, 27, 46, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px; padding-top: calc(env(safe-area-inset-top) + 12px); z-index: 4000; border-bottom: 1px solid var(--card-brd); display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .busca-container { background: #0b0f19; display: flex; align-items: center; padding: 10px 16px; border-radius: 16px; border: 1px solid var(--card-brd); gap: 10px; }
        .busca-container input { background: none; border: none; color: var(--text); flex: 1; outline: none; font-size: 14px; font-weight: 600; }
        .busca-container input::placeholder { color: #64748b; }
        
        .botoes-header-direita { display: flex; align-items: center; gap: 10px; }
        .btn-robo-config { background: #1e293b; border: 1px solid #334155; color: #fff; font-size: 16px; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .btn-sair-input { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger); font-size: 11px; font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 10px; text-transform: uppercase; }

        .stats-topo { font-size: 13px; color: var(--text-sub); font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
        .stats-topo b { color: #60a5fa; font-size: 15px; }

        .btn-novo-cliente-topo { background: var(--primary); border: none; color: white; width: 100%; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .botoes-topo-flex { display: flex; gap: 8px; }
        .btn-topo-acao { flex: 1; background: #0b0f19; border: 1px solid var(--card-brd); color: var(--text); padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-topo-pagos { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #34d399; }

        /* MURAL DARK */
        .secao-mural { background: transparent; padding: 0; width: 100%; }
        .mural-header-toggle { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn-add-mural { background: #0b0f19; border: 1px solid var(--card-brd); color: var(--text); font-size: 11px; text-transform: uppercase; font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 10px; flex: 1; }
        .btn-toggle-mural { background: transparent; border: none; color: var(--text-sub); font-size: 11px; font-weight: 700; padding: 8px; cursor: pointer; }
        
        #wrapper-mural-retratil { max-height: 100px; overflow-y: auto; margin-top: 8px; }
        .card-aviso { background: #0b0f19; padding: 10px 14px; border-radius: 12px; margin-bottom: 6px; font-size: 12px; font-weight: 600; border: 1px solid var(--card-brd); border-left: 4px solid var(--primary); color: var(--text); display: flex; justify-content: space-between; align-items: center; }

        /* LISTA ROLÁVEL */
        .conteudo-rolavel { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: var(--bg); }
        
        /* CARDS DOS CLIENTES */
        .card-cliente { background: var(--card); border: 1px solid var(--card-brd); border-radius: 20px; padding: 18px; margin-bottom: 14px; position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-md); }
        .card-cliente.vencido-border { border: 1.5px solid rgba(239, 68, 68, 0.8) !important; background: linear-gradient(180deg, rgba(239,68,68,0.05) 0%, var(--card) 100%); }
        .card-cliente.vence-hoje-border { border: 1.5px solid rgba(234, 179, 8, 0.8) !important; background: linear-gradient(180deg, rgba(234,179,8,0.05) 0%, var(--card) 100%); }
        .card-cliente.pago-border { border: 1.5px solid rgba(16, 185, 129, 0.8) !important; background: linear-gradient(180deg, rgba(16,185,129,0.05) 0%, var(--card) 100%); }
        
        .card-cliente h3 { margin: 0 0 6px 0; font-size: 17px; font-weight: 800; color: #fff; width: 60%; }
        .info-p { font-size: 13px; color: var(--text-sub); margin: 3px 0; font-weight: 500; }
        .info-p b { color: #f1f5f9; font-weight: 700; }
        .obs-box { background: #0b0f19; border: 1px dashed #334155; padding: 10px; border-radius: 10px; font-size: 12px; color: #cbd5e1; margin-top: 8px; font-weight: 500; }
        
        .obs-pago-verde { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; margin-top: 10px; display: flex; align-items: center; gap: 6px; }

        .card-linha { height: 1px; background: #1e293b; margin: 14px 0; border: none; width: 100%; }

        .container-badges { position: absolute; top: 18px; right: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .selo-prolongado { background: rgba(249, 115, 22, 0.15); color: #fb923c; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; border: 1px solid rgba(249, 115, 22, 0.3); }
        
        .status-vencimento { font-size: 10px; font-weight: 800; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px; }
        .status-vencimento.em-dia { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .status-vencimento.vence-logo { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
        .status-vencimento.vencido { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .status-vencimento.pago-status { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid #10b981; }

        /* BOTÕES */
        .flex-botoes-icones { display: flex; gap: 8px; justify-content: flex-end; align-items: center; width: 100%; flex-wrap: wrap; }
        .btn-icone { width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: #0b0f19; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; padding: 0; }
        .btn-i-renovar { background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.3); }
        .btn-i-editar { background: rgba(234, 179, 8, 0.15); border-color: rgba(234, 179, 8, 0.3); }
        .btn-i-pago { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); }
        .btn-i-prolongar { background: rgba(249, 115, 22, 0.15); border-color: rgba(249, 115, 22, 0.3); }
        .btn-i-arquivar { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.3); }
        .btn-i-excluir { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); }
        .btn-icone svg { width: 18px; height: 18px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .btn-i-renovar svg { stroke: #c084fc; }
        .btn-i-editar svg { stroke: #fde047; }
        .btn-i-pago svg { stroke: #34d399; }
        .btn-i-prolongar svg { stroke: #fb923c; }
        .btn-i-arquivar svg { stroke: #60a5fa; }
        .btn-i-excluir svg { stroke: #f87171; }
        .btn-icone:active { transform: scale(0.92); }

        /* MODAIS DARK */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 6000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); width: 100%; max-width: 360px; padding: 28px; border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center; border: 1px solid var(--card-brd); max-height: 90vh; overflow-y: auto; color: var(--text); }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--card-brd); background: #0b0f19; color: var(--text); font-size: 14px; outline: none; font-weight: 500; }
        .modal-content input:focus, .modal-content textarea:focus { border-color: var(--primary); }
        .modal-content label { display: block; text-align: left; font-size: 11px; font-weight: 800; color: var(--text-sub); margin-top: 12px; text-transform: uppercase; }
        .btn-acao-modal { background: var(--primary); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; margin-top: 16px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="login-container">
        <div class="login-card">
            <h2>GESTOR BUSINESS</h2>
            <input type="text" id="u" placeholder="Usuário" autocomplete="username">
            <input type="password" id="p" placeholder="Senha" autocomplete="current-password">
            <label class="remember-box"><input type="checkbox" id="remember"> Lembrar meu acesso</label>
            <button type="button" id="btn-login-submit" class="btn-login-3d">ENTRAR</button>
        </div>
    </div>

    <!-- MODAL CLIENTE -->
    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <h2 id="modal-titulo" style="margin-top:0; font-size:18px; font-weight:800;">Novo Cliente</h2>
            <input type="hidden" id="edit-id">
            <input type="hidden" id="edit-path">
            <input type="text" id="cli-nome" placeholder="Nome do Cliente">
            <input type="text" id="cli-painel" placeholder="Nome do Painel (Ex: unitv, uniplay)">
            <input type="text" id="cli-whats" placeholder="WhatsApp (Ex: 5548999998888)">
            <input type="date" id="cli-vencimento">
            <textarea id="cli-obs" rows="2" placeholder="Observações (Ex: Usa 2 aparelhos, paga via Pix)"></textarea>
            <button id="btn-salvar-cli" class="btn-acao-modal">SALVAR DADOS</button>
            <button id="btn-fechar-cli" style="background:none; border:none; color:var(--text-sub); margin-top:14px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;">CANCELAR</button>
        </div>
    </div>

    <!-- MODAL DEFINIR DATA DE PAGO -->
    <div id="modal-pago-data" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800; color:var(--success);">Confirmar Pagamento</h2>
            <p style="font-size:13px; color:var(--text-sub);">Defina a nova data de vencimento estendida para este cliente:</p>
            <input type="hidden" id="pago-id">
            <input type="hidden" id="pago-path">
            <label>Nova Data Estendida</label>
            <input type="date" id="pago-nova-data">
            <button id="btn-confirmar-pago" class="btn-acao-modal" style="background:var(--success);">CONFIRMAR PAGO</button>
            <button id="btn-fechar-pago-modal" style="background:none; border:none; color:var(--text-sub); margin-top:14px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;">CANCELAR</button>
        </div>
    </div>

    <!-- MODAL CONFIGURAR ROBÔ -->
    <div id="modal-robo" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800; color:var(--text);">⚙️ Configurações do Robô</h2>
            <label>Mensagem: Próximo Vencimento</label>
            <textarea id="msg-aviso" rows="3" placeholder="Ex: Olá {nome}, seu acesso vence em breve..."></textarea>
            <label>Mensagem: Expirado</label>
            <textarea id="msg-expirado" rows="3" placeholder="Ex: Atenção {nome}, seu login expirou..."></textarea>
            <button id="btn-salvar-robo" class="btn-acao-modal">SALVAR CONFIGURAÇÕES</button>
            <button id="btn-fechar-robo" style="background:none; border:none; color:var(--text-sub); margin-top:14px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;">FECHAR</button>
        </div>
    </div>

    <!-- MODAL PAGOS -->
    <div id="modal-pagos" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800; color:var(--success);">Área de Clientes Pagos</h2>
            <div id="lista-pagos-corpo" style="text-align:left; margin-top:12px; max-height: 50vh; overflow-y: auto;"></div>
            <button id="btn-fechar-pagos" class="btn-acao-modal" style="background:#1e293b; color:var(--text); box-shadow:none;">FECHAR JANELA</button>
        </div>
    </div>

    <!-- MODAL ARQUIVADOS -->
    <div id="modal-arquivados" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800;">Clientes Arquivados</h2>
            <div id="lista-arquivados-corpo" style="text-align:left; margin-top:12px; max-height: 50vh; overflow-y: auto;"></div>
            <button id="btn-fechar-arquivados" class="btn-acao-modal" style="background:#1e293b; color:var(--text); box-shadow:none;">FECHAR JANELA</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app">
        <header class="header-fixo">
            <div class="busca-container">
                <input type="text" id="busca" placeholder="Buscar cliente, painel ou whats...">
                <div class="botoes-header-direita">
                    <button class="btn-robo-config" id="btn-abrir-robo" title="Configurar Robô">⚙️</button>
                    <button class="btn-sair-input" id="btn-sair">SAIR</button>
                </div>
            </div>

            <div class="stats-topo">
                <span id="contagem">Carregando dados...</span>
                <span id="btn-ocultar-olho" style="cursor:pointer;">👁️</span>
            </div>

            <button class="btn-novo-cliente-topo" id="btn-abrir-add-cli">+ Adicionar Cliente</button>
            
            <div class="botoes-topo-flex">
                <button class="btn-topo-acao btn-topo-pagos" id="btn-aba-pagos">Pagos (0)</button>
                <button class="btn-topo-acao" id="btn-aba-arquivados">Arquivados (0)</button>
            </div>

            <!-- MURAL INTEGRADO -->
            <section class="secao-mural">
                <div class="mural-header-toggle">
                    <button class="btn-add-mural" id="btn-add-mural">+ Nota no Mural</button>
                    <button class="btn-toggle-mural" id="btn-hide-mural">Ocultar Mural</button>
                </div>
                <div id="wrapper-mural-retratil">
                    <div id="lista-mural"></div>
                </div>
            </section>
        </header>

        <div class="conteudo-rolavel">
            <section class="lista-clientes" id="lista-corpo"></section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, collectionGroup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        let app, db;
        let logado = null;
        let clientesRaw = [];
        let muralRaw = [];
        let muralOculto = false;
        let activeUnsubs = [];

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            alert("Erro de conexão Firebase: " + e.message);
        }

        function obterValorCampo(obj, ...chaves) {
            for (let k of chaves) {
                if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
                    return obj[k];
                }
            }
            return '';
        }

        function extrairDataISO(val) {
            if (!val) return '';
            try {
                if (typeof val === 'object' && val.seconds) {
                    return new Date(val.seconds * 1000).toISOString().split('T')[0];
                }
                if (val instanceof Date) {
                    return val.toISOString().split('T')[0];
                }
                let str = String(val).trim();
                if (str.includes('/')) {
                    let p = str.split('/');
                    if (p.length === 3) {
                        if (p[2].length === 4) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                        if (p[0].length === 4) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
                    }
                }
                if (str.includes('-')) {
                    let p = str.split('T')[0].split('-');
                    if (p.length === 3) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
                }
            } catch (e) { console.error("Erro extraindo data", e); }
            return '';
        }

        function formatarDataExibicao(val) {
            const iso = extrairDataISO(val);
            if (!iso) return '-';
            const partes = iso.split('-');
            if (partes.length !== 3) return String(val);
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function executarLogin() {
            const userVal = document.getElementById('u').value.trim();
            const passVal = document.getElementById('p').value.trim();

            if (!userVal || !passVal) {
                alert("Preencha o usuário e a senha.");
                return;
            }

            logado = userVal;
            
            if (document.getElementById('remember').checked) {
                localStorage.setItem('gestor_u', userVal);
                localStorage.setItem('gestor_p', passVal);
            } else {
                localStorage.removeItem('gestor_u');
                localStorage.removeItem('gestor_p');
            }

            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            iniciarListenersFirestore();
        }

        function iniciarListenersFirestore() {
            if (!logado) return;
            
            activeUnsubs.forEach(unsub => unsub());
            activeUnsubs = [];

            try {
                const unsubGroup = onSnapshot(collectionGroup(db, 'clientes'), (snapshot) => {
                    const temp = [];
                    snapshot.forEach(d => {
                        const path = d.ref.path;
                        const data = d.data();
                        
                        if (!data.usuario || path.toLowerCase().includes(logado.toLowerCase()) || String(data.usuario).toLowerCase() === logado.toLowerCase()) {
                            temp.push({ id: d.id, _fullPath: path, ...data });
                        }
                    });

                    clientesRaw = temp;
                    renderizarClientes();
                }, (error) => {
                    console.error("Erro no escaneamento de clientes:", error);
                });

                activeUnsubs.push(unsubGroup);
            } catch (err) {
                console.error("Falha ao criar listener:", err);
            }

            try {
                const unsubMural = onSnapshot(collection(db, "usuarios", logado, "mural"), (snapshot) => {
                    muralRaw = [];
                    snapshot.forEach(d => muralRaw.push({ id: d.id, _fullPath: d.ref.path, ...d.data() }));
                    renderizarMural();
                }, (e) => {});
                
                activeUnsubs.push(unsubMural);
            } catch(e) {}
        }

        function calcularDiferencaDias(dataRef) {
            if(!dataRef) return 999;
            const hoje = new Date();
            hoje.setHours(0,0,0,0);
            const ref = new Date(dataRef + "T00:00:00");
            const diffTime = ref - hoje;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function renderizarClientes() {
            const termo = document.getElementById('busca').value.toLowerCase().trim();
            const container = document.getElementById('lista-corpo');
            container.innerHTML = "";

            // Clientes Ativos (Não arquivados)
            const ativos = clientesRaw.filter(c => !c.arquivado);
            const pagosCount = clientesRaw.filter(c => c.pago && !c.arquivado).length;
            const arquivadosCount = clientesRaw.filter(c => c.arquivado).length;

            document.getElementById('btn-aba-pagos').innerText = `Pagos (${pagosCount})`;
            document.getElementById('btn-aba-arquivados').innerText = `Arquivados (${arquivadosCount})`;
            
            // CONTAGEM TOTAL PERMANECE INALTERADA QUANDO MARCA PAGO
            document.getElementById('contagem').innerHTML = `Total de Clientes: <b>${ativos.length}</b>`;

            const filtrados = ativos.filter(c => {
                const nome = String(obterValorCampo(c, 'nome', 'cliente', 'Nome', 'name')).toLowerCase();
                const painel = String(obterValorCampo(c, 'painel', 'Painel', 'servico', 'service')).toLowerCase();
                const whats = String(obterValorCampo(c, 'whats', 'whatsapp', 'Whats', 'telefone', 'phone', 'celular')).toLowerCase();
                return nome.includes(termo) || painel.includes(termo) || whats.includes(termo);
            });

            // LÓGICA DE ORDENAÇÃO: VENCIDOS E PRÓXIMOS DO VENCIMENTO NO TOPO DA TELA
            filtrados.sort((a, b) => {
                const dtA = extrairDataISO(obterValorCampo(a, 'vencimento', 'dataVencimento', 'Vencimento', 'data'));
                const dtB = extrairDataISO(obterValorCampo(b, 'vencimento', 'dataVencimento', 'Vencimento', 'data'));

                const diasA = calcularDiferencaDias(dtA);
                const diasB = calcularDiferencaDias(dtB);

                // Definição de níveis de prioridade (quanto menor o número, mais alto fica no topo)
                // 1: Vencido (dias < 0)
                // 2: Vence Hoje ou Próximo (dias <= 3)
                // 3: Pago (com estendimento ativado)
                // 4: Em dia normal (> 3 dias)
                const getPrioridade = (c, dias) => {
                    if (dias < 0 && !c.pago) return 1;
                    if (dias <= 3 && !c.pago) return 2;
                    if (c.pago) return 3;
                    return 4;
                };

                const prioA = getPrioridade(a, diasA);
                const prioB = getPrioridade(b, diasB);

                if (prioA !== prioB) {
                    return prioA - prioB;
                }

                // Se tiverem a mesma prioridade, ordena pela data mais próxima
                return diasA - diasB;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-sub); margin-top:30px; font-weight:600;">Nenhum cliente encontrado.</p>`;
                return;
            }

            const hojeStr = new Date().toISOString().split('T')[0];

            filtrados.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card-cliente';

                const rawVenc = obterValorCampo(c, 'vencimento', 'dataVencimento', 'Vencimento', 'data', 'venc');
                const isoVenc = extrairDataISO(rawVenc);
                const isoEstendida = extrairDataISO(c.dataEstendida);
                
                const diffDias = calcularDiferencaDias(isoVenc);

                let statusClass = 'em-dia';
                let statusTexto = 'EM DIA';

                if (c.pago) {
                    statusClass = 'pago-status';
                    statusTexto = 'PAGO';
                    card.classList.add('pago-border');
                } else if (diffDias < 0) {
                    statusClass = 'vencido';
                    statusTexto = 'VENCIDO';
                    card.classList.add('vencido-border');
                } else if (diffDias <= 3) {
                    statusClass = 'vence-logo';
                    statusTexto = diffDias === 0 ? 'VENCE HOJE' : `VENCE EM ${diffDias} DIA(S)`;
                    card.classList.add('vence-hoje-border');
                }

                const nomeExibir = obterValorCampo(c, 'nome', 'cliente', 'Nome', 'name') || 'Sem nome';
                const painelExibir = obterValorCampo(c, 'painel', 'Painel', 'servico') || '-';
                const whatsExibir = obterValorCampo(c, 'whats', 'whatsapp', 'Whats', 'telefone', 'phone', 'celular') || '-';
                const obsExibir = obterValorCampo(c, 'obs', 'observacao', 'Obs', 'notas') || '';

                card.innerHTML = `
                    <div class="container-badges">
                        <span class="status-vencimento ${statusClass}">${statusTexto}</span>
                        ${c.prolongado ? `<span class="selo-prolongado">Prolongado</span>` : ''}
                    </div>
                    <h3>${nomeExibir}</h3>
                    <div class="info-p">Painel: <b>${painelExibir}</b></div>
                    <div class="info-p">Vencimento Original: <b>${formatarDataExibicao(rawVenc)}</b></div>
                    <div class="info-p">WhatsApp: <b>${whatsExibir}</b></div>

                    <!-- OBSERVAÇÃO VERDE SE ESTIVER PAGO -->
                    ${c.pago ? `
                        <div class="obs-pago-verde">
                            <span>✅ PAGO</span> ${isoEstendida ? `(Estendido até ${formatarDataExibicao(isoEstendida)})` : ''}
                        </div>
                    ` : ''}

                    ${obsExibir ? `<div class="obs-box">${obsExibir}</div>` : ''}
                    <div class="card-linha"></div>
                    <div class="flex-botoes-icones">
                        <button class="btn-icone btn-i-renovar" title="Renovar +1 Mês" data-id="${c.id}" data-path="${c._fullPath}" data-action="renovar">
                            <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                        </button>
                        <button class="btn-icone btn-i-pago" title="Marcar/Alterar Pago" data-id="${c.id}" data-path="${c._fullPath}" data-action="pago">
                            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="btn-icone btn-i-prolongar" title="Prolongar 3 Dias" data-id="${c.id}" data-path="${c._fullPath}" data-action="prolongar">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14 14"/></svg>
                        </button>
                        <button class="btn-icone btn-i-editar" title="Editar" data-id="${c.id}" data-path="${c._fullPath}" data-action="editar">
                            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 2 2h14a2 2 0 0 2 2h14a2 2 0 0 2 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="btn-icone btn-i-arquivar" title="Arquivar" data-id="${c.id}" data-path="${c._fullPath}" data-action="arquivar">
                            <svg viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                        </button>
                        <button class="btn-icone btn-i-excluir" title="Excluir" data-id="${c.id}" data-path="${c._fullPath}" data-action="excluir">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarMural() {
            const container = document.getElementById('lista-mural');
            container.innerHTML = "";
            muralRaw.forEach(m => {
                const item = document.createElement('div');
                item.className = 'card-aviso';
                item.innerHTML = `
                    <span>${m.texto || m.Texto}</span>
                    <button style="border:none; background:none; color:var(--danger); font-weight:800; cursor:pointer;" data-mural-id="${m.id}" data-path="${m._fullPath}">✕</button>
                `;
                container.appendChild(item);
            });
        }

        async function tratarAcaoCliente(id, path, acao) {
            const docRef = doc(db, path);
            const cli = clientesRaw.find(c => c.id === id);

            if (acao === 'excluir') {
                if (confirm("Deseja realmente excluir este cliente?")) {
                    await deleteDoc(docRef);
                }
            } else if (acao === 'arquivar') {
                await updateDoc(docRef, { arquivado: true });
            } else if (acao === 'pago') {
                // ABRE O MODAL AUTOMATICAMENTE PARA DEFINIR/ALTERAR A DATA ESTENDIDA
                document.getElementById('pago-id').value = id;
                document.getElementById('pago-path').value = path;
                const isoEst = extrairDataISO(cli.dataEstendida) || extrairDataISO(obterValorCampo(cli, 'vencimento', 'dataVencimento'));
                document.getElementById('pago-nova-data').value = isoEst;
                document.getElementById('modal-pago-data').style.display = 'flex';
            } else if (acao === 'prolongar') {
                const rawVenc = obterValorCampo(cli, 'vencimento', 'dataVencimento', 'Vencimento', 'data');
                const isoVenc = extrairDataISO(rawVenc) || new Date().toISOString().split('T')[0];
                let d = new Date(isoVenc + "T00:00:00");
                d.setDate(d.getDate() + 3);
                const nData = d.toISOString().split('T')[0];
                await updateDoc(docRef, { vencimento: nData, dataVencimento: nData, prolongado: true });
            } else if (acao === 'renovar') {
                const rawVenc = obterValorCampo(cli, 'vencimento', 'dataVencimento', 'Vencimento', 'data');
                const isoVenc = extrairDataISO(rawVenc) || new Date().toISOString().split('T')[0];
                let d = new Date(isoVenc + "T00:00:00");
                d.setMonth(d.getMonth() + 1);
                const nData = d.toISOString().split('T')[0];
                await updateDoc(docRef, { vencimento: nData, dataVencimento: nData, prolongado: false, pago: false, dataEstendida: null });
            } else if (acao === 'editar') {
                abrirModalCliente(cli);
            }
        }

        async function confirmarAcaoPago() {
            const id = document.getElementById('pago-id').value;
            const path = document.getElementById('pago-path').value;
            const novaData = document.getElementById('pago-nova-data').value;

            if (!novaData) {
                alert("Por favor, selecione uma data.");
                return;
            }

            const docRef = doc(db, path);
            // Salva status PAGO, define a data estendida, sem excluir o cliente ou alterar a contagem total
            await updateDoc(docRef, { 
                pago: true, 
                dataEstendida: novaData 
            });

            document.getElementById('modal-pago-data').style.display = 'none';
        }

        function abrirModalCliente(cli = null) {
            const modal = document.getElementById('modal-cliente');
            if (cli) {
                const rawVenc = obterValorCampo(cli, 'vencimento', 'dataVencimento', 'Vencimento', 'data');
                document.getElementById('modal-titulo').innerText = "Editar Cliente";
                document.getElementById('edit-id').value = cli.id;
                document.getElementById('edit-path').value = cli._fullPath;
                document.getElementById('cli-nome').value = obterValorCampo(cli, 'nome', 'cliente', 'Nome', 'name');
                document.getElementById('cli-painel').value = obterValorCampo(cli, 'painel', 'Painel', 'servico');
                document.getElementById('cli-whats').value = obterValorCampo(cli, 'whats', 'whatsapp', 'Whats', 'telefone', 'phone', 'celular');
                document.getElementById('cli-vencimento').value = extrairDataISO(rawVenc);
                document.getElementById('cli-obs').value = obterValorCampo(cli, 'obs', 'observacao', 'Obs');
            } else {
                document.getElementById('modal-titulo').innerText = "Novo Cliente";
                document.getElementById('edit-id').value = "";
                document.getElementById('edit-path').value = "";
                document.getElementById('cli-nome').value = "";
                document.getElementById('cli-painel').value = "";
                document.getElementById('cli-whats').value = "";
                document.getElementById('cli-vencimento').value = "";
                document.getElementById('cli-obs').value = "";
            }
            modal.style.display = 'flex';
        }

        async function salvarCliente() {
            const id = document.getElementById('edit-id').value;
            const targetPath = document.getElementById('edit-path').value;
            
            const dados = {
                nome: document.getElementById('cli-nome').value.trim(),
                painel: document.getElementById('cli-painel').value.trim(),
                whats: document.getElementById('cli-whats').value.trim(),
                vencimento: document.getElementById('cli-vencimento').value,
                dataVencimento: document.getElementById('cli-vencimento').value,
                obs: document.getElementById('cli-obs').value.trim()
            };

            if (!dados.nome || !dados.vencimento) {
                alert("Preencha ao menos o nome e a data de vencimento.");
                return;
            }

            try {
                if (id && targetPath) {
                    await updateDoc(doc(db, targetPath), dados);
                } else {
                    dados.arquivado = false;
                    dados.pago = false;
                    dados.prolongado = false;
                    dados.usuario = logado;
                    await addDoc(collection(db, "usuarios", logado, "clientes"), dados);
                }
                document.getElementById('modal-cliente').style.display = 'none';
            } catch (err) {
                alert("Erro ao salvar dados: " + err.message);
            }
        }

        function abrirModalPagos() {
            const container = document.getElementById('lista-pagos-corpo');
            container.innerHTML = "";
            const pagos = clientesRaw.filter(c => c.pago && !c.arquivado);
            
            if(pagos.length === 0) {
                container.innerHTML = "<p style='font-size:13px; color:var(--text-sub);'>Nenhum cliente na lista de pagos.</p>";
            } else {
                pagos.forEach(c => {
                    const item = document.createElement('div');
                    item.style.padding = "10px 0";
                    item.style.borderBottom = "1px solid #1e293b";
                    item.style.display = "flex";
                    item.style.justifyContent = "space-between";
                    item.style.alignItems = "center";
                    item.innerHTML = `
                        <div>
                            <strong style="font-size:14px; color:#fff;">${obterValorCampo(c, 'nome', 'cliente', 'Nome')}</strong>
                            <div style="font-size:11px; color:var(--text-sub);">${obterValorCampo(c, 'painel', 'Painel') || '-'} - Pago até: ${formatarDataExibicao(c.dataEstendida)}</div>
                        </div>
                        <button style="background:rgba(239, 68, 68, 0.2); border:1px solid #ef4444; color:#f87171; font-size:10px; font-weight:800; padding:6px 10px; border-radius:8px; cursor:pointer;" data-desmarcar-pago="${c.id}" data-path="${c._fullPath}">DESMARCAR PAGO</button>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById('modal-pagos').style.display = 'flex';
        }

        function abrirModalArquivados() {
            const container = document.getElementById('lista-arquivados-corpo');
            container.innerHTML = "";
            const arq = clientesRaw.filter(c => c.arquivado);
            
            if(arq.length === 0) {
                container.innerHTML = "<p style='font-size:13px; color:var(--text-sub);'>Nenhum cliente arquivado.</p>";
            } else {
                arq.forEach(c => {
                    const item = document.createElement('div');
                    item.style.padding = "10px 0";
                    item.style.borderBottom = "1px solid #1e293b";
                    item.style.display = "flex";
                    item.style.justifyContent = "space-between";
                    item.style.alignItems = "center";
                    item.innerHTML = `
                        <div>
                            <strong style="font-size:14px; color:#fff;">${obterValorCampo(c, 'nome', 'cliente', 'Nome')}</strong>
                            <div style="font-size:11px; color:var(--text-sub);">${obterValorCampo(c, 'painel', 'Painel') || '-'}</div>
                        </div>
                        <button style="background:rgba(59, 130, 246, 0.2); border:1px solid #3b82f6; color:#60a5fa; font-size:10px; font-weight:800; padding:6px 10px; border-radius:8px; cursor:pointer;" data-desarquivar="${c.id}" data-path="${c._fullPath}">DESARQUIVAR</button>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById('modal-arquivados').style.display = 'flex';
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-login-submit').addEventListener('click', executarLogin);
            
            document.getElementById('u').addEventListener('keypress', (e) => { if(e.key === 'Enter') executarLogin(); });
            document.getElementById('p').addEventListener('keypress', (e) => { if(e.key === 'Enter') executarLogin(); });

            document.getElementById('busca').addEventListener('input', renderizarClientes);
            document.getElementById('btn-abrir-add-cli').addEventListener('click', () => abrirModalCliente());
            document.getElementById('btn-salvar-cli').addEventListener('click', salvarCliente);
            document.getElementById('btn-fechar-cli').addEventListener('click', () => { document.getElementById('modal-cliente').style.display = 'none'; });

            document.getElementById('btn-confirmar-pago').addEventListener('click', confirmarAcaoPago);
            document.getElementById('btn-fechar-pago-modal').addEventListener('click', () => { document.getElementById('modal-pago-data').style.display = 'none'; });

            document.getElementById('btn-aba-pagos').addEventListener('click', abrirModalPagos);
            document.getElementById('btn-fechar-pagos').addEventListener('click', () => { document.getElementById('modal-pagos').style.display = 'none'; });

            document.getElementById('btn-aba-arquivados').addEventListener('click', abrirModalArquivados);
            document.getElementById('btn-fechar-arquivados').addEventListener('click', () => { document.getElementById('modal-arquivados').style.display = 'none'; });

            document.getElementById('btn-abrir-robo').addEventListener('click', () => { document.getElementById('modal-robo').style.display = 'flex'; });
            document.getElementById('btn-fechar-robo').addEventListener('click', () => { document.getElementById('modal-robo').style.display = 'none'; });

            document.getElementById('btn-sair').addEventListener('click', () => {
                if(confirm("Deseja realmente sair?")) {
                    localStorage.removeItem('gestor_u');
                    localStorage.removeItem('gestor_p');
                    location.reload();
                }
            });

            document.getElementById('lista-corpo').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (btn) {
                    const id = btn.getAttribute('data-id');
                    const path = btn.getAttribute('data-path');
                    const action = btn.getAttribute('data-action');
                    tratarAcaoCliente(id, path, action);
                }
            });

            document.getElementById('lista-mural').addEventListener('click', async (e) => {
                const btn = e.target.closest('[data-mural-id]');
                if (btn) {
                    const id = btn.getAttribute('data-mural-id');
                    const path = btn.getAttribute('data-path');
                    await deleteDoc(doc(db, path || `usuarios/${logado}/mural/${id}`));
                }
            });

            document.getElementById('btn-add-mural').addEventListener('click', async () => {
                const txt = prompt("Digite a anotação para o mural:");
                if (txt) {
                    await addDoc(collection(db, "usuarios", logado, "mural"), { texto: txt });
                }
            });

            document.getElementById('btn-hide-mural').addEventListener('click', () => {
                muralOculto = !muralOculto;
                document.getElementById('wrapper-mural-retratil').style.display = muralOculto ? 'none' : 'block';
                document.getElementById('btn-hide-mural').innerText = muralOculto ? 'Exibir Mural' : 'Ocultar Mural';
            });

            document.getElementById('lista-pagos-corpo').addEventListener('click', async (e) => {
                const btn = e.target.closest('[data-desmarcar-pago]');
                if (btn) {
                    const id = btn.getAttribute('data-desmarcar-pago');
                    const path = btn.getAttribute('data-path');
                    await updateDoc(doc(db, path), { pago: false, dataEstendida: null });
                    abrirModalPagos();
                }
            });

            document.getElementById('lista-arquivados-corpo').addEventListener('click', async (e) => {
                const btn = e.target.closest('[data-desarquivar]');
                if (btn) {
                    const id = btn.getAttribute('data-desarquivar');
                    const path = btn.getAttribute('data-path');
                    await updateDoc(doc(db, path), { arquivado: false });
                    abrirModalArquivados();
                }
            });

            const savedU = localStorage.getItem('gestor_u');
            const savedP = localStorage.getItem('gestor_p');
            if (savedU && savedP) { 
                document.getElementById('u').value = savedU; 
                document.getElementById('p').value = savedP; 
                document.getElementById('remember').checked = true; 
                executarLogin(); 
            }
        });
    </script>
</body>
</html>
