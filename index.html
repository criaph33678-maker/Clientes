<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Gestor Pro V13.2</title>
    <style>
        :root { --bg: #000; --card: #161616; --text: #fff; --accent: #3b82f6; --success: #00ff00; --danger: #ff0000; --warning: #ffcc00; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
        
        /* LOGIN */
        #tela-login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid #333; width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 12px; box-sizing: border-box; }
        .btn-entrar { width: 100%; padding: 15px; background: var(--accent); border: none; color: #fff; font-weight: 900; border-radius: 12px; cursor: pointer; }

        /* INTERFACE PRINCIPAL (ADMIN OU CLIENTE) */
        #interface { display: none; padding: 15px; padding-top: env(safe-area-inset-top); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* ESTILO DOS CARDS DE CLIENTE (VISÃO ADMIN) */
        .card { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 12px; border: 1px solid #333; }
        .urgente { border: 2px solid var(--danger); }
        .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-acao { padding: 10px; border-radius: 8px; border: none; color: #fff; font-weight: 700; font-size: 12px; }

        #loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; color: var(--accent); font-weight: 800; }
    </style>
</head>
<body>

    <div id="loading">CARREGANDO...</div>

    <div id="tela-login">
        <div class="login-card">
            <h2 style="margin:0 0 20px 0">Gestor Pro</h2>
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <label style="font-size: 12px; color: #888; display: flex; align-items: center; gap: 5px; margin-bottom: 15px;">
                <input type="checkbox" id="lembrar" style="width:15px" checked> Manter conectado
            </label>
            <button class="btn-entrar" onclick="tentarLogin()">ACESSAR SISTEMA</button>
        </div>
    </div>

    <div id="interface">
        <div class="header">
            <h3 id="saudacao">Olá!</h3>
            <button onclick="logout()" style="background:none; border:none; color:var(--danger); font-weight:700;">SAIR</button>
        </div>
        
        <div id="conteudo-dinamico"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, onSnapshot, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- VERIFICAÇÃO DE SESSÃO ---
        const sUser = localStorage.getItem('gestor_u');
        const sPass = localStorage.getItem('gestor_p');
        if(sUser && sPass) validar(sUser, sPass, true);

        window.tentarLogin = () => {
            const u = document.getElementById('user').value.toLowerCase().trim();
            const p = document.getElementById('pass').value;
            validar(u, p, document.getElementById('lembrar').checked);
        };

        async function validar(u, p, manter) {
            document.getElementById('loading').style.display = 'block';
            
            // 1. Verificamos se é VOCÊ (Admin Master)
            // Crie esse usuário no seu painel /admin/ com login 'admin' para testar
            const q = query(collection(db, "usuarios"), where("login", "==", u), where("senha", "==", p));
            const snap = await getDocs(q);

            if (!snap.empty) {
                const dados = snap.docs[0].data();
                if(manter) { localStorage.setItem('gestor_u', u); localStorage.setItem('gestor_p', p); }
                
                // Se o login for 'admin', ele abre a visão de administrador
                if(u === 'admin') carregarAdmin(dados); 
                else carregarCliente(dados);
            } else {
                alert("Acesso negado!");
                document.getElementById('loading').style.display = 'none';
            }
        }

        // --- VISÃO DO SEU USO (ADMIN) ---
        function carregarAdmin(info) {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('interface').style.display = 'block';
            document.getElementById('saudacao').innerText = "Painel Master";

            // Aqui ele puxa a sua lista antiga de 'clientes'
            onSnapshot(query(collection(db, "clientes"), orderBy("data", "asc")), (snap) => {
                const lista = snap.docs.map(d => {
                    const c = d.data();
                    return `
                    <div class="card">
                        <b>${c.nome}</b><br>
                        <small>Vence: ${c.data}</small>
                        <div class="acoes">
                            <button class="btn-acao" style="background:#444">EDITAR</button>
                            <button class="btn-acao" style="background:var(--danger)">EXCLUIR</button>
                        </div>
                    </div>`;
                }).join('');
                document.getElementById('conteudo-dinamico').innerHTML = `<h4>Todos os Clientes:</h4>` + lista;
            });
        }

        // --- VISÃO DO CLIENTE ---
        function carregarCliente(info) {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('interface').style.display = 'block';
            document.getElementById('saudacao').innerText = "Olá, " + info.nome;
            
            document.getElementById('conteudo-dinamico').innerHTML = `
                <div class="card" style="border-left: 5px solid var(--accent)">
                    <p>Seu plano: <b>${info.plano}</b></p>
                    <p>Vencimento: <b>${info.vencimento}</b></p>
                </div>
            `;
        }

        window.logout = () => { localStorage.clear(); location.reload(); };
    </script>
</body>
</html>
