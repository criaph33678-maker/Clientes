<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Gestor Business V12.4</title>
    <style>
        :root { --bg: #000; --card: #1a1a1a; --text: #fff; --accent: #3b82f6; --danger: #ff0000; --warning: #ffcc00; --success: #00ff00; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-top: calc(165px + env(safe-area-inset-top)); }
        
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); padding: 10px; padding-top: env(safe-area-inset-top); z-index: 100; border-bottom: 1px solid #333; }
        .stats { font-size: 11px; color: #aaa; display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; white-space: nowrap; font-weight: 600; }
        .stats b { color: var(--accent); }
        
        .busca-container { display: flex; gap: 8px; align-items: center; background: #222; padding: 8px 15px; border-radius: 20px; border: 1px solid #444; margin-bottom: 10px; }
        .busca-container input { background: none; border: none; color: white; flex: 1; outline: none; font-size: 15px; }

        /* CAMPO DE AVISO RECUPERADO */
        .campo-aviso { background: rgba(59, 130, 246, 0.15); border: 1px dashed var(--accent); border-radius: 12px; padding: 10px; text-align: center; color: var(--accent); font-size: 13px; font-weight: 700; margin-top: 5px; cursor: pointer; min-height: 20px; }

        .cliente-item { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 12px; border: 1px solid #333; }
        .cliente-item.urgente { border: 2px solid var(--danger) !important; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
        .info h4 { margin: 0; font-size: 20px; font-weight: 900; text-transform: uppercase; }
        .info p { margin: 4px 0; font-size: 14px; color: #bbb; }
        .alerta-texto { font-weight: 900; font-size: 13px; display: block; margin-top: 5px; text-transform: uppercase; }

        .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; border-top: 1px solid #333; padding-top: 12px; }
        .btn-acao { padding: 12px; border-radius: 10px; border: none; font-weight: 800; font-size: 13px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; text-transform: uppercase; }
        .btn-plus { background: var(--success); }
        .btn-edit { background: #444; }
        .btn-del { background: var(--danger); grid-column: span 2; }

        #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 300; left: 50%; transform: translateX(-50%); bottom: 30px; font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 20px; border-radius: 20px; width: 85%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 14px; margin: 8px 0; background: #333; border: 1px solid #444; border-radius: 10px; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header-fixo">
        <div id="contadores" class="stats">Carregando...</div>
        <div class="busca-container">
            <span>🔍</span>
            <input type="text" id="inputBusca" placeholder="Pesquisar cliente..." oninput="filtrarClientes()">
            <button onclick="abrirModal()" style="background:var(--accent); border:none; color:white; border-radius:50%; width:32px; height:32px; font-weight:900;">+</button>
        </div>
        <div id="textoAviso" class="campo-aviso" onclick="editarAviso()">Carregando lembretes...</div>
    </div>

    <div id="lista"></div>
    <div id="toast">✅ Sucesso!</div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin:0 0 10px 0; font-weight:900">Novo Cliente</h3>
            <input type="hidden" id="editId">
            <input type="text" id="nomeCli" placeholder="Nome">
            <input type="text" id="wppCli" placeholder="WhatsApp">
            <input type="date" id="dataCli">
            <input type="text" id="painelCli" placeholder="Painel">
            <button class="btn-plus" style="width:100%; padding:15px; margin-top:10px" onclick="salvarCliente()">Confirmar Alteração</button>
            <button onclick="fecharModal()" style="background:none; border:none; color:#aaa; width:100%; margin-top:10px">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let todosClientes = [];

        // LÓGICA DO AVISO CONECTADA AO FIREBASE
        onSnapshot(doc(db, "config", "avisoGeral"), (snap) => {
            if (snap.exists()) {
                document.getElementById('textoAviso').innerText = "📢 " + snap.data().texto;
            } else {
                document.getElementById('textoAviso').innerText = "📢 Toque para adicionar um lembrete...";
            }
        });

        window.editarAviso = async () => {
            const atual = document.getElementById('textoAviso').innerText.replace("📢 ", "");
            const novo = prompt("Digite o novo lembrete:", atual);
            if (novo !== null) {
                await setDoc(doc(db, "config", "avisoGeral"), { texto: novo });
                mostrarFeedback("📌 Lembrete atualizado!");
            }
        };

        function mostrarFeedback(msg, cor = "#00ff00") {
            const t = document.getElementById("toast");
            t.innerText = msg; t.style.backgroundColor = cor;
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        }

        window.abrirModal = (id = null) => {
            document.getElementById('modal').style.display = 'flex';
            if(id) {
                const c = todosClientes.find(cli => cli.id === id);
                document.getElementById('modalTitle').innerText = "Editar Cliente";
                document.getElementById('editId').value = id;
                document.getElementById('nomeCli').value = c.nome;
                document.getElementById('wppCli').value = c.whatsapp || "";
                document.getElementById('dataCli').value = c.data;
                document.getElementById('painelCli').value = c.painel || "";
            } else {
                document.getElementById('modalTitle').innerText = "Novo Cliente";
                document.getElementById('editId').value = "";
                document.querySelectorAll('#modal input').forEach(i => i.value = "");
            }
        };

        window.fecharModal = () => { document.getElementById('modal').style.display = 'none'; };

        window.salvarCliente = async () => {
            const id = document.getElementById('editId').value;
            const dados = {
                nome: document.getElementById('nomeCli').value,
                whatsapp: document.getElementById('wppCli').value.replace(/\D/g,''),
                data: document.getElementById('dataCli').value,
                painel: document.getElementById('painelCli').value || "Geral"
            };
            if(id) {
                if(confirm("Confirmar alteração?")) {
                    await updateDoc(doc(db, "clientes", id), dados);
                    mostrarFeedback("✅ Cliente editado!");
                }
            } else {
                await addDoc(collection(db, "clientes"), { ...dados, criadoEm: Date.now() });
                mostrarFeedback("✅ Cliente cadastrado!");
            }
            fecharModal();
        };

        window.renovarUmMes = async (id, dataAtual) => {
            if(!confirm("Renovar +1 mês?")) return;
            let p = dataAtual.split('-');
            let d = new Date(p[0], p[1]-1, p[2]);
            d.setMonth(d.getMonth() + 1);
            await updateDoc(doc(db, "clientes", id), { data: d.toISOString().split('T')[0] });
            mostrarFeedback("🚀 Renovado com sucesso!");
        };

        window.excluirCliente = async (id) => {
            if(confirm("Excluir permanentemente?")) {
                await deleteDoc(doc(db, "clientes", id));
                mostrarFeedback("🗑️ Cliente excluído!", "#ff0000");
            }
        };

        window.filtrarClientes = () => {
            const termo = document.getElementById('inputBusca').value.toLowerCase();
            renderizar(todosClientes.filter(c => c.nome.toLowerCase().includes(termo)));
        };

        function renderizar(lista) {
            const hoje = new Date();
            hoje.setHours(0,0,0,0);
            document.getElementById('lista').innerHTML = lista.map(c => {
                const dataVenc = new Date(c.data + 'T23:59:59');
                const diff = Math.ceil((dataVenc - hoje) / 86400000);
                const isUrgent = diff <= 3 && diff >= 0;
                const isExpired = diff < 0;
                return `
                <div class="cliente-item ${isUrgent || isExpired ? 'urgente' : ''}">
                    <div class="info">
                        <h4>${c.nome}</h4>
                        <p>🖥️ Painel: <b>${c.painel}</b></p>
                        <p>📅 Vencimento: <b>${c.data.split('-').reverse().join('/')}</b></p>
                        <span class="alerta-texto" style="color:${isExpired ? 'var(--danger)' : (isUrgent ? 'var(--warning)' : 'var(--success)')}">
                            ${isExpired ? '❌ VENCIDO' : (isUrgent ? '⚠️ VENCE EM ' + diff + ' DIAS' : '✅ EM DIA')}
                        </span>
                    </div>
                    <div class="acoes">
                        <button class="btn-acao btn-plus" onclick="renovarUmMes('${c.id}', '${c.data}')">➕ +1 Mês</button>
                        <button class="btn-acao btn-edit" onclick="abrirModal('${c.id}')">✏️ Editar</button>
                        <button class="btn-acao btn-del" onclick="excluirCliente('${c.id}')">🗑️ Excluir</button>
                    </div>
                </div>
            `}).join('');
        }

        onSnapshot(query(collection(db, "clientes"), orderBy("data", "asc")), (snap) => {
            todosClientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const paineis = {};
            todosClientes.forEach(c => { paineis[c.painel] = (paineis[c.painel] || 0) + 1; });
            document.getElementById('contadores').innerHTML = Object.keys(paineis).map(p => `${p}: <b>${paineis[p]}</b>`).join(' | ') + ` | TOTAL: <b>${todosClientes.length}</b>`;
            filtrarClientes();
        });
    </script>
</body>
</html>
