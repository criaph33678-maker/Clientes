<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Gestor Business V13.3-Power</title>
    <style>
        :root { --bg: #0a0a0c; --card: #151518; --text: #ffffff; --accent: #007aff; --danger: #ff3b30; --success: #34c759; --gray: #8e8e93; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        /* TELA DE LOGIN ESTILO 13.3 */
        #tela-login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle at top, #1c1c1e 0%, #000 100%); }
        .login-card { background: rgba(30, 30, 32, 0.8); backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 30px; border: 1px solid #333; width: 85%; max-width: 340px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .login-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 25px; letter-spacing: -1px; }
        .login-card input { width: 100%; padding: 16px; margin: 8px 0; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; border-radius: 14px; box-sizing: border-box; font-size: 16px; outline: none; }
        .btn-entrar { width: 100%; padding: 16px; background: var(--accent); border: none; color: #fff; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 15px; font-size: 16px; }

        /* INTERFACE PRINCIPAL */
        #app-interface { display: none; padding: 20px; padding-top: calc(140px + env(safe-area-inset-top)); }
        
        .btn-sair-topo { position: fixed; top: calc(15px + env(safe-area-inset-top)); right: 20px; background: rgba(255, 59, 48, 0.15); color: #ff453a; border: 1px solid rgba(255, 59, 48, 0.3); padding: 8px 15px; border-radius: 10px; font-weight: 700; font-size: 12px; z-index: 1000; }

        /* HEADER 13.3 */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(20px); padding: 15px 20px; padding-top: calc(10px + env(safe-area-inset-top)); z-index: 900; border-bottom: 1px solid #1c1c1e; height: 125px; display: flex; flex-direction: column; justify-content: flex-end; }
        .stats { font-size: 13px; color: var(--gray); margin-bottom: 12px; font-weight: 500; }
        .stats b { color: var(--text); font-weight: 700; }
        
        .busca-container { display: flex; gap: 10px; align-items: center; background: #1c1c1e; padding: 12px 18px; border-radius: 16px; border: 1px solid #2c2c2e; }
        .busca-container input { background: none; border: none; color: white; flex: 1; outline: none; font-size: 16px; }

        /* BOTÃO ADICIONAR DESTAQUE 13.3 */
        #btn-add-cliente { background: linear-gradient(135deg, #34c759 0%, #248a3d 100%); color: #fff; border: none; padding: 18px; border-radius: 18px; font-weight: 800; width: 100%; margin-bottom: 25px; font-size: 14px; letter-spacing: 0.5px; box-shadow: 0 10px 20px rgba(52, 199, 89, 0.2); }

        /* MURAL ESTILIZADO */
        .secao-titulo { display: flex; justify-content: space-between; align-items: center; margin: 25px 0 15px 0; }
        .secao-titulo h5 { margin: 0; font-size: 17px; font-weight: 800; color: var(--text); }
        .card-aviso { background: var(--card); border: 1px solid #2c2c2e; padding: 20px; border-radius: 20px; color: #efeff4; font-size: 15px; font-weight: 500; margin-bottom: 12px; position: relative; overflow: hidden; }
        .card-aviso::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }

        /* LISTA DE CLIENTES 13.3 */
        .cliente-item { background: var(--card); padding: 20px; border-radius: 24px; margin-bottom: 15px; border: 1px solid #2c2c2e; transition: transform 0.2s; }
        .info h4 { margin: 0 0 5px 0; font-size: 19px; font-weight: 800; color: #fff; }
        .info p { margin: 0; font-size: 13px; color: var(--gray); font-weight: 500; }
        
        .acoes { display: flex; gap: 10px; margin-top: 18px; }
        .btn-acao { flex: 1; padding: 14px; border-radius: 14px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; transition: opacity 0.2s; }
        .btn-renovar { background: #1c1c1e; color: var(--accent); border: 1px solid rgba(0, 122, 255, 0.2); }
        .btn-excluir { background: rgba(255, 59, 48, 0.1); color: #ff453a; }

        #loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--accent); font-weight: 900; z-index: 2000; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="loading">Sincronizando...</div>

    <div id="tela-login">
        <div class="login-card">
            <h2>Gestor Business</h2>
            <input type="text" id="userInput" placeholder="Usuário">
            <input type="password" id="passInput" placeholder="Senha">
            <button class="btn-entrar" onclick="fazerLogin()">ACESSAR PAINEL</button>
        </div>
    </div>

    <div id="app-interface">
        <button class="btn-sair-topo" onclick="confirmarSair()">SAIR</button>
        
        <div class="header-fixo">
            <div id="contadores" class="stats"></div>
            <div class="busca-container">
                <input type="text" id="inputBusca" placeholder="Buscar na lista..." oninput="filtrarClientes()">
            </div>
        </div>

        <button id="btn-add-cliente" onclick="novoCliente()">+ NOVO CLIENTE</button>

        <div class="mural-avisos">
            <div class="secao-titulo">
                <h5 id="tituloMural">Mural de Notas</h5>
                <button onclick="adicionarAviso()" style="background:none; color:var(--accent); border:none; font-weight:700; font-size:13px;">+ ADICIONAR</button>
            </div>
            <div id="listaAvisos"></div>
        </div>

        <div class="secao-titulo"><h5>Seus Registros</h5></div>
        <div id="listaCorpo"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let todosDados = [];
        let usuarioLogado = null;

        window.fazerLogin = async () => {
            const u = document.getElementById('userInput').value.toLowerCase().trim();
            const p = document.getElementById('passInput').value;
            if(!u || !p) return;
            
            document.getElementById('loading').style.display = 'block';
            const q = query(collection(db, "usuarios"), where("login", "==", u), where("senha", "==", p));
            const snap = await getDocs(q);
            
            if(!snap.empty) { 
                usuarioLogado = snap.docs[0].data(); 
                iniciarApp(); 
            } else { 
                alert("Login ou senha inválidos."); 
                document.getElementById('loading').style.display = 'none';
            }
        };

        function iniciarApp() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app-interface').style.display = 'block';
            document.getElementById('tituloMural').innerText = (usuarioLogado.login === 'admin') ? "Notas do Administrador" : "Minhas Anotações";
            carregarDados();
            carregarMural();
        }

        function carregarDados() {
            const q = (usuarioLogado.login === 'admin') 
                ? query(collection(db, "clientes"), orderBy("data", "asc"))
                : query(collection(db, "clientes"), where("dono", "==", usuarioLogado.login), orderBy("data", "asc"));

            onSnapshot(q, (snap) => {
                todosDados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('contadores').innerHTML = `Registros ativos: <b>${todosDados.length}</b>`;
                renderizarLista(todosDados);
            });
        }

        function renderizarLista(lista) {
            document.getElementById('listaCorpo').innerHTML = lista.map(c => `
                <div class="cliente-item">
                    <div class="info">
                        <h4>${c.nome}</h4>
                        <p>${c.painel} • Expira em: ${c.data.split('-').reverse().join('/')}</p>
                    </div>
                    <div class="acoes">
                        <button class="btn-acao btn-renovar" onclick="renovar('${c.id}', '${c.data}')">RENOVAR MÊS</button>
                        <button class="btn-acao btn-excluir" onclick="excluir('${c.id}', 'clientes')">REMOVER</button>
                    </div>
                </div>`).join('');
        }

        function carregarMural() {
            const qMural = (usuarioLogado.login === 'admin') 
                ? query(collection(db, "avisos"), orderBy("criadoEm", "desc"))
                : query(collection(db, "lembretes_privados"), where("usuarioId", "==", usuarioLogado.login), orderBy("criadoEm", "desc"));

            onSnapshot(qMural, (snap) => {
                document.getElementById('listaAvisos').innerHTML = snap.docs.map(d => `
                    <div class="card-aviso" onclick="excluir('${d.id}', '${(usuarioLogado.login === 'admin') ? 'avisos' : 'lembretes_privados'}')">
                        ${d.data().texto}
                    </div>`).join('');
            });
        }

        window.novoCliente = async () => {
            const n = prompt("Nome completo:");
            const p = prompt("Painel / Serviço:");
            const d = prompt("Vencimento (AAAA-MM-DD):", new Date().toISOString().split('T')[0]);
            if(n && p && d) {
                await addDoc(collection(db, "clientes"), { nome: n, painel: p, data: d, dono: usuarioLogado.login });
            }
        };

        window.adicionarAviso = async () => {
            const t = prompt("Escreva sua nota:");
            if(!t) return;
            const pasta = (usuarioLogado.login === 'admin') ? "avisos" : "lembretes_privados";
            const obj = { texto: t, criadoEm: Date.now() };
            if(usuarioLogado.login !== 'admin') obj.usuarioId = usuarioLogado.login;
            await addDoc(collection(db, pasta), obj);
        };

        window.renovar = async (id, data) => {
            let d = new Date(data + 'T23:59:59');
            d.setMonth(d.getMonth() + 1);
            await updateDoc(doc(db, "clientes", id), { data: d.toISOString().split('T')[0] });
        };

        window.excluir = async (id, pasta) => { if(confirm("Deseja apagar este registro?")) await deleteDoc(doc(db, pasta, id)); };
        
        window.confirmarSair = () => { if(confirm("Deseja sair da conta?")) location.reload(); };

        window.filtrarClientes = () => {
            const t = document.getElementById('inputBusca').value.toLowerCase();
            renderizarLista(todosDados.filter(c => c.nome.toLowerCase().includes(t)));
        };
    </script>
</body>
</html>
