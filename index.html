<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gestor Business V13.13-Final</title>
    <style>
        :root { --bg: #000; --card: #111; --text: #fff; --accent: #3b82f6; --danger: #ff3b30; --success: #4ade80; --warning: #facc15; }
        
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; }

        /* HEADER COM CONTAGEM DETALHADA (FOTO) */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 10px 15px; padding-top: env(safe-area-inset-top); z-index: 1000; border-bottom: 1px solid #1a1a1a; }
        .stats-topo { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 8px; }
        .stats-topo b { color: #3b82f6; }
        .busca-wrapper { display: flex; gap: 10px; align-items: center; }
        .busca-container { background: #1a1a1a; flex: 1; display: flex; align-items: center; padding: 10px 15px; border-radius: 25px; border: 1px solid #333; }
        .busca-container input { background: none; border: none; color: #fff; flex: 1; outline: none; font-size: 14px; }
        .btn-add-topo { background: #3b82f6; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 22px; font-weight: bold; cursor: pointer; }

        /* MURAL DE LEMBRETES */
        .secao-mural { margin-top: calc(110px + env(safe-area-inset-top)); padding: 15px; }
        .mural-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-left: 3px solid #3b82f6; padding-left: 10px; }
        .card-aviso { background: #1a1a1a; padding: 15px; border-radius: 18px; margin-bottom: 8px; font-weight: bold; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #0056b3; }

        /* CARDS DE CLIENTES COM BORDA NEON (FOTO) */
        .lista-clientes { padding: 0 15px 100px 15px; }
        .card-cliente { background: #111; border: 1px solid #333; border-radius: 28px; padding: 20px; margin-bottom: 15px; position: relative; }
        .card-cliente.vence-logo { border: 2px solid var(--danger); box-shadow: 0 0 15px rgba(255, 59, 48, 0.3); }
        .card-cliente h3 { margin: 0 0 10px 0; text-transform: uppercase; font-size: 22px; font-weight: 900; }
        .info-linha { display: flex; align-items: center; gap: 8px; color: #ccc; font-size: 14px; margin-bottom: 5px; }
        .aviso-vencimento { color: var(--warning); font-weight: bold; font-size: 13px; margin-top: 8px; display: flex; align-items: center; gap: 5px; text-transform: uppercase; }

        /* BOTÕES IGUAL À FOTO */
        .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-card { padding: 14px; border-radius: 14px; border: none; font-weight: 900; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase; }
        .btn-renovar { background: var(--success); color: #000; }
        .btn-editar { background: #333; color: #fff; }
        .btn-excluir { background: var(--danger); color: #fff; grid-column: span 2; margin-top: 5px; }

        .btn-sair { position: fixed; top: 12px; right: 15px; background: none; border: none; color: #444; font-size: 10px; z-index: 1100; font-weight: bold; }
    </style>
</head>
<body>

    <button class="btn-sair" onclick="confirmarSair()">SAIR</button>

    <div id="tela-login" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <div style="background:#111; padding:35px; border-radius:30px; width:85%; max-width:300px; text-align:center; border:1px solid #333;">
            <h1 style="margin-bottom:30px; letter-spacing:-1px;">GESTOR</h1>
            <input type="text" id="u" placeholder="Usuário" style="width:100%; padding:15px; margin-bottom:12px; border-radius:15px; border:1px solid #333; background:#000; color:#fff; box-sizing:border-box; outline:none;">
            <input type="password" id="p" placeholder="Senha" style="width:100%; padding:15px; margin-bottom:25px; border-radius:15px; border:1px solid #333; background:#000; color:#fff; box-sizing:border-box; outline:none;">
            <button onclick="logar()" style="width:100%; padding:15px; background:#3b82f6; border:none; color:#fff; border-radius:15px; font-weight:900; font-size:16px;">ACESSAR</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="header-fixo">
            <div id="contagem" class="stats-topo"></div>
            <div class="busca-wrapper">
                <div class="busca-container">
                    <input type="text" id="busca" placeholder="Pesquisar cliente..." oninput="filtrar()">
                </div>
                <button class="btn-add-topo" onclick="novoCliente()">+</button>
            </div>
        </header>

        <section class="secao-mural">
            <div class="mural-header">
                <h2 style="font-size:15px; margin:0;">📌 MURAL DE LEMBRETES</h2>
                <button onclick="novoAviso()" style="background:#3b82f6; border:none; color:white; padding:6px 12px; border-radius:8px; font-weight:bold; font-size:10px;">+ NOVO AVISO</button>
            </div>
            <div id="lista-mural"></div>
        </section>

        <section class="lista-clientes" id="lista-corpo"></section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let dadosRaw = [];
        let logado = null;

        window.logar = async () => {
            const login = document.getElementById('u').value.toLowerCase().trim();
            const pass = document.getElementById('p').value;
            const q = query(collection(db, "usuarios"), where("login", "==", login), where("senha", "==", pass));
            const snap = await getDocs(q);
            if(!snap.empty) { logado = snap.docs[0].data(); iniciarApp(); } else { alert("Login Incorreto!"); }
        };

        function iniciarApp() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            carregarDados();
            carregarMural();
        }

        function carregarDados() {
            const q = (logado.login === 'admin') 
                ? query(collection(db, "clientes"), orderBy("data", "asc"))
                : query(collection(db, "clientes"), where("dono", "==", logado.login), orderBy("data", "asc"));

            onSnapshot(q, (snap) => {
                dadosRaw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // LÓGICA DE CONTAGEM (FOTO)
                const uniplay = dadosRaw.filter(x => x.painel.toLowerCase().includes('uniplay')).length;
                const unitv = dadosRaw.filter(x => x.painel.toLowerCase().includes('unitv')).length;
                document.getElementById('contagem').innerHTML = `Unplay: <b>${uniplay}</b> | Unitv: <b>${unitv}</b> | TOTAL: <b>${dadosRaw.length}</b>`;
                
                render(dadosRaw);
            });
        }

        function render(lista) {
            const hoje = new Date(); hoje.setHours(0,0,0,0);

            document.getElementById('lista-corpo').innerHTML = lista.map(c => {
                const v = new Date(c.data + 'T23:59:59');
                const diff = Math.ceil((v - hoje) / 86400000);
                const classeVence = (diff <= 3 && diff >= 0) ? 'vence-logo' : '';

                return `
                <div class="card-cliente ${classeVence}">
                    <h3>${c.nome}</h3>
                    <div class="info-linha">🖥️ Painel: <b>${c.painel}</b></div>
                    <div class="info-linha">📅 Vencimento: <b>${c.data.split('-').reverse().join('/')}</b></div>
                    
                    ${diff <= 3 && diff >= 0 ? `
                        <div class="aviso-vencimento">⚠️ VENCE EM ${diff} ${diff === 1 ? 'DIA' : 'DIAS'}</div>
                    ` : ''}

                    ${diff < 0 ? `<div class="aviso-vencimento" style="color:red">❌ VENCIDO</div>` : ''}

                    <div class="grid-botoes">
                        <button class="btn-card btn-renovar" onclick="renovar('${c.id}', '${c.data}')">➕ +1 MÊS</button>
                        <button class="btn-card btn-editar" onclick="editar('${c.id}')">✏️ EDITAR</button>
                        <button class="btn-card btn-excluir" onclick="excluir('${c.id}', 'clientes')">🗑️ EXCLUIR</button>
                    </div>
                </div>`;
            }).join('');
        }

        function carregarMural() {
            const q = (logado.login === 'admin') 
                ? query(collection(db, "avisos"), orderBy("criadoEm", "desc"))
                : query(collection(db, "lembretes_privados"), where("usuarioId", "==", logado.login), orderBy("criadoEm", "desc"));

            onSnapshot(q, (snap) => {
                document.getElementById('lista-mural').innerHTML = snap.docs.map(d => `
                    <div class="card-aviso" onclick="excluir('${d.id}', '${logado.login === 'admin' ? 'avisos' : 'lembretes_privados'}')">
                        📢 ${d.data().texto}
                    </div>`).join('');
            });
        }

        window.novoCliente = async () => {
            const n = prompt("Nome:");
            const p = prompt("Painel (Uniplay ou Unitv):");
            const d = prompt("Vencimento (AAAA-MM-DD):");
            if(n && p && d) await addDoc(collection(db, "clientes"), { nome: n, painel: p, data: d, dono: logado.login });
        };

        window.novoAviso = async () => {
            const t = prompt("Escreva sua nota:");
            if(t) {
                const pasta = (logado.login === 'admin') ? "avisos" : "lembretes_privados";
                await addDoc(collection(db, pasta), { texto: t, usuarioId: logado.login, criadoEm: Date.now() });
            }
        };

        window.renovar = async (id, data) => {
            let dt = new Date(data + 'T23:59:59');
            dt.setMonth(dt.getMonth() + 1);
            await updateDoc(doc(db, "clientes", id), { data: dt.toISOString().split('T')[0] });
        };

        window.excluir = async (id, pasta) => { if(confirm("Remover este item?")) await deleteDoc(doc(db, pasta, id)); };
        window.confirmarSair = () => { if(confirm("Sair da conta?")) location.reload(); };
        window.filtrar = () => {
            const t = document.getElementById('busca').value.toLowerCase();
            render(dadosRaw.filter(x => x.nome.toLowerCase().includes(t)));
        };
    </script>
</body>
</html>
