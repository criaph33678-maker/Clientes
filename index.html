<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>Gestor Business V15.0 - Universal</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root { 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --card-brd: #e2e8f0; 
            --text: #0f172a; 
            --text-sub: #64748b;
            
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --warning: #eab308;
            --success: #10b981;
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.12);
        }
        
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; overflow: hidden; }

        /* TELA DE LOGIN */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100vw; background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); padding: 20px; position: relative; z-index: 5000; }
        .login-card { background: #ffffff; padding: 36px 28px; border-radius: 28px; width: 100%; max-width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.8); box-shadow: var(--shadow-lg); }
        .login-card h2 { color: var(--text); font-size: 22px; font-weight: 800; margin-top: 0; margin-bottom: 24px; letter-spacing: -0.5px; }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--card-brd); background: #f8fafc; color: var(--text); margin-bottom: 14px; outline: none; font-size: 14px; font-weight: 600; transition: border-color 0.2s; }
        .login-card input:focus { border-color: var(--primary); background: #fff; }
        .remember-box { display: flex; align-items: center; gap: 10px; color: var(--text-sub); font-size: 13px; margin-bottom: 24px; cursor: pointer; justify-content: flex-start; width: 100%; font-weight: 600; }
        .remember-box input { accent-color: var(--primary); width: 18px; height: 18px; border-radius: 6px; }
        
        .btn-login-3d { background: var(--primary); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: transform 0.1s, background 0.2s; }
        .btn-login-3d:active { transform: scale(0.98); }
        .btn-login-3d:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        /* ESTRUTURA DO APP */
        #app { display: none; height: 100vh; width: 100vw; flex-direction: column; background: var(--bg); }

        /* HEADER FIXO NO TOPO */
        .header-fixo { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px; padding-top: calc(env(safe-area-inset-top) + 12px); z-index: 4000; border-bottom: 1px solid var(--card-brd); display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .busca-container { background: #f1f5f9; display: flex; align-items: center; padding: 10px 16px; border-radius: 16px; border: 1px solid #e2e8f0; gap: 10px; }
        .busca-container input { background: none; border: none; color: var(--text); flex: 1; outline: none; font-size: 14px; font-weight: 600; }
        .busca-container input::placeholder { color: #94a3b8; }
        
        .botoes-header-direita { display: flex; align-items: center; gap: 10px; }
        .btn-robo-config { background: #f1f5f9; border: 1px solid #e2e8f0; font-size: 16px; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .btn-sair-input { background: rgba(239, 68, 68, 0.1); border: none; color: var(--danger); font-size: 11px; font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 10px; letter-spacing: 0.5px; text-transform: uppercase; }

        .stats-topo { font-size: 13px; color: var(--text-sub); font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
        .stats-topo b { color: var(--primary); font-size: 15px; }

        .btn-novo-cliente-topo { background: var(--primary); border: none; color: white; width: 100%; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .botoes-topo-flex { display: flex; gap: 8px; }
        .btn-topo-acao { flex: 1; background: #ffffff; border: 1px solid var(--card-brd); color: var(--text); padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; box-shadow: var(--shadow-sm); }
        .btn-topo-pagos { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }

        /* MURAL */
        .secao-mural { background: transparent; padding: 0; width: 100%; }
        .mural-header-toggle { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn-add-mural { background: #f1f5f9; border: 1px solid #e2e8f0; color: var(--text); font-size: 11px; text-transform: uppercase; font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 10px; flex: 1; }
        .btn-toggle-mural { background: transparent; border: none; color: var(--text-sub); font-size: 11px; font-weight: 700; padding: 8px; cursor: pointer; }
        
        #wrapper-mural-retratil { max-height: 100px; overflow-y: auto; margin-top: 8px; }
        .card-aviso { background: #ffffff; padding: 10px 14px; border-radius: 12px; margin-bottom: 6px; font-size: 12px; font-weight: 600; border-left: 4px solid var(--primary); color: var(--text); box-shadow: var(--shadow-sm); border: 1px solid #f1f5f9; border-left-width: 4px; display: flex; justify-content: space-between; align-items: center; }

        /* CONTEÚDO ROLÁVEL */
        .conteudo-rolavel { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: var(--bg); }
        
        /* CARDS DOS CLIENTES */
        .card-cliente { background: var(--card); border: 1px solid var(--card-brd); border-radius: 20px; padding: 18px; margin-bottom: 14px; position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-md); transition: transform 0.2s, box-shadow 0.2s; }
        .card-cliente.vencido-border { border: 1.5px solid rgba(239, 68, 68, 0.4) !important; box-shadow: 0 4px 16px rgba(239, 68, 68, 0.08); }
        
        .card-cliente h3 { margin: 0 0 6px 0; font-size: 17px; font-weight: 800; color: var(--text); width: 60%; letter-spacing: -0.3px; }
        .info-p { font-size: 13px; color: var(--text-sub); margin: 3px 0; font-weight: 500; }
        .info-p b { color: var(--text); font-weight: 700; }
        .obs-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 10px; font-size: 12px; color: #475569; margin-top: 8px; font-weight: 500; }
        
        .card-linha { height: 1px; background: #f1f5f9; margin: 14px 0; border: none; width: 100%; }

        .container-badges { position: absolute; top: 18px; right: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .selo-prolongado { background: #ffedd5; color: #c2410c; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; border: 1px solid #fed7aa; }
        
        .status-vencimento { font-size: 10px; font-weight: 800; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px; }
        .status-vencimento.em-dia { background: #dcfce7; color: #15803d; }
        .status-vencimento.vence-logo { background: #fef9c3; color: #a16207; }
        .status-vencimento.vencido { background: #fee2e2; color: #b91c1c; }

        /* BOTÕES DE AÇÃO */
        .flex-botoes-icones { display: flex; gap: 8px; justify-content: flex-end; align-items: center; width: 100%; flex-wrap: wrap; }
        .btn-icone { width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: #f8fafc; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; padding: 0; box-shadow: var(--shadow-sm); }
        .btn-i-renovar { background: #f3e8ff; border-color: #e9d5ff; }
        .btn-i-editar { background: #fef9c3; border-color: #fef08a; }
        .btn-i-pago { background: #dcfce7; border-color: #bbf7d0; }
        .btn-i-prolongar { background: #fff7ed; border-color: #ffedd5; }
        .btn-i-arquivar { background: #dbeafe; border-color: #bfdbfe; }
        .btn-i-excluir { background: #fee2e2; border-color: #fecaca; }
        .btn-icone svg { width: 18px; height: 18px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .btn-i-renovar svg { stroke: #9333ea; }
        .btn-i-editar svg { stroke: #ca8a04; }
        .btn-i-pago svg { stroke: #16a34a; }
        .btn-i-prolongar svg { stroke: #ea580c; }
        .btn-i-arquivar svg { stroke: #2563eb; }
        .btn-i-excluir svg { stroke: #dc2626; }
        .btn-icone:active { transform: scale(0.92); }

        /* MODAIS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); z-index: 6000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #ffffff; width: 100%; max-width: 360px; padding: 28px; border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center; border: 1px solid #f1f5f9; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--card-brd); background: #f8fafc; color: var(--text); font-size: 14px; outline: none; font-weight: 500; }
        .modal-content input:focus, .modal-content textarea:focus { border-color: var(--primary); background: #fff; }
        .modal-content label { display: block; text-align: left; font-size: 11px; font-weight: 800; color: var(--text-sub); margin-top: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-acao-modal { background: var(--primary); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; margin-top: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="login-container">
        <div class="login-card">
            <h2>GESTOR BUSINESS</h2>
            <input type="text" id="u" placeholder="Usuário" autocomplete="username">
            <input type="password" id="p" placeholder="Senha" autocomplete="current-password">
            <label class="remember-box"><input type="checkbox" id="remember"> Lembrar meu acesso</label>
            <button type="button" id="btn-login-submit" class="btn-login-3d">ENTRAR</button>
        </div>
    </div>

    <!-- MODAL CLIENTE -->
    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <h2 id="modal-titulo" style="margin-top:0; font-size:18px; font-weight:800;">Novo Cliente</h2>
            <input type="hidden" id="edit-id">
            <input type="hidden" id="edit-path">
            <input type="text" id="cli-nome" placeholder="Nome do Cliente">
            <input type="text" id="cli-painel" placeholder="Nome do Painel (Ex: unitv, uniplay)">
            <input type="text" id="cli-whats" placeholder="WhatsApp (Ex: 5548999998888)">
            <input type="date" id="cli-vencimento">
            <textarea id="cli-obs" rows="2" placeholder="Observações (Ex: Usa 2 aparelhos, paga via Pix)"></textarea>
            <button id="btn-salvar-cli" class="btn-acao-modal">SALVAR DADOS</button>
            <button id="btn-fechar-cli" style="background:none; border:none; color:var(--text-sub); margin-top:14px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;">CANCELAR</button>
        </div>
    </div>

    <!-- MODAL CONFIGURAÇÃO DO ROBÔ -->
    <div id="modal-robo" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800; color:var(--text);">⚙️ Configurações do Robô</h2>
            <label>Mensagem: Próximo Vencimento</label>
            <textarea id="msg-aviso" rows="3" placeholder="Ex: Olá {nome}, seu acesso vence em breve..."></textarea>
            <label>Mensagem: Expirado</label>
            <textarea id="msg-expirado" rows="3" placeholder="Ex: Atenção {nome}, seu login expirou..."></textarea>
            <button id="btn-salvar-robo" class="btn-acao-modal">SALVAR CONFIGURAÇÕES</button>
            <button id="btn-fechar-robo" style="background:none; border:none; color:var(--text-sub); margin-top:14px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;">FECHAR</button>
        </div>
    </div>

    <!-- MODAL LISTA DE PAGOS -->
    <div id="modal-pagos" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800; color:var(--success);">Clientes Pagos</h2>
            <div id="lista-pagos-corpo" style="text-align:left; margin-top:12px; max-height: 50vh; overflow-y: auto;"></div>
            <button id="btn-fechar-pagos" class="btn-acao-modal" style="background:#f1f5f9; color:var(--text); box-shadow:none;">FECHAR JANELA</button>
        </div>
    </div>

    <!-- MODAL ARQUIVADOS -->
    <div id="modal-arquivados" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800;">Clientes Arquivados</h2>
            <div id="lista-arquivados-corpo" style="text-align:left; margin-top:12px; max-height: 50vh; overflow-y: auto;"></div>
            <button id="btn-fechar-arquivados" class="btn-acao-modal" style="background:#f1f5f9; color:var(--text); box-shadow:none;">FECHAR JANELA</button>
        </div>
    </div>

    <!-- APLICATIVO -->
    <div id="app">
        <header class="header-fixo">
            <div class="busca-container">
                <input type="text" id="busca" placeholder="Buscar cliente, painel ou whats...">
                <div class="botoes-header-direita">
                    <button class="btn-robo-config" id="btn-abrir-robo" title="Configurar Robô">⚙️</button>
                    <button class="btn-sair-input" id="btn-sair">SAIR</button>
                </div>
            </div>

            <div class="stats-topo">
                <span id="contagem">Buscando dados no Firebase...</span>
                <span id="btn-ocultar-olho" style="cursor:pointer;">👁️</span>
            </div>

            <button class="btn-novo-cliente-topo" id="btn-abrir-add-cli">+ Adicionar Cliente</button>
            
            <div class="botoes-topo-flex">
                <button class="btn-topo-acao btn-topo-pagos" id="btn-aba-pagos">Pagos (0)</button>
                <button class="btn-topo-acao" id="btn-aba-arquivados">Arquivados (0)</button>
            </div>

            <!-- MURAL INTEGRADO -->
            <section class="secao-mural">
                <div class="mural-header-toggle">
                    <button class="btn-add-mural" id="btn-add-mural">+ Nota no Mural</button>
                    <button class="btn-toggle-mural" id="btn-hide-mural">Ocultar Mural</button>
                </div>
                <div id="wrapper-mural-retratil">
                    <div id="lista-mural"></div>
                </div>
            </section>
        </header>

        <div class="conteudo-rolavel">
            <section class="lista-clientes" id="lista-corpo"></section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, collectionGroup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        let app, db;
        let logado = null;
        let clientesRaw = [];
        let muralRaw = [];
        let muralOculto = false;
        let activeUnsubs = [];

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            alert("Erro de conexão Firebase: " + e.message);
        }

        function executarLogin() {
            const userVal = document.getElementById('u').value.trim();
            const passVal = document.getElementById('p').value.trim();

            if (!userVal || !passVal) {
                alert("Preencha o usuário e a senha.");
                return;
            }

            logado = userVal;
            
            if (document.getElementById('remember').checked) {
                localStorage.setItem('gestor_u', userVal);
                localStorage.setItem('gestor_p', passVal);
            } else {
                localStorage.removeItem('gestor_u');
                localStorage.removeItem('gestor_p');
            }

            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            iniciarListenersFirestore();
        }

        function iniciarListenersFirestore() {
            if (!logado) return;
            
            activeUnsubs.forEach(unsub => unsub());
            activeUnsubs = [];

            // VARREDURA UNIVERSAL DE CLIENTES
            try {
                const unsubGroup = onSnapshot(collectionGroup(db, 'clientes'), (snapshot) => {
                    const temp = [];
                    snapshot.forEach(d => {
                        const path = d.ref.path;
                        const data = d.data();
                        
                        // Captura documentos da raiz 'clientes' ou pertencentes ao usuário logado
                        if (!data.usuario || path.toLowerCase().includes(logado.toLowerCase()) || data.usuario.toLowerCase() === logado.toLowerCase()) {
                            temp.push({ id: d.id, _fullPath: path, ...data });
                        }
                    });

                    clientesRaw = temp;
                    renderizarClientes();
                }, (error) => {
                    console.error("Erro no escaneamento de clientes:", error);
                    alert("Aviso de acesso Firestore: " + error.message);
                });

                activeUnsubs.push(unsubGroup);
            } catch (err) {
                console.error("Falha ao criar listener:", err);
            }

            // VARREDURA DE MURAL (Subcoleção ou Raiz)
            try {
                const unsubMural = onSnapshot(collection(db, "usuarios", logado, "mural"), (snapshot) => {
                    muralRaw = [];
                    snapshot.forEach(d => muralRaw.push({ id: d.id, _fullPath: d.ref.path, ...d.data() }));
                    renderizarMural();
                }, (e) => console.log("Mural não configurado ou vazio."));
                
                activeUnsubs.push(unsubMural);
            } catch(e) {}
        }

        function renderizarClientes() {
            const termo = document.getElementById('busca').value.toLowerCase().trim();
            const container = document.getElementById('lista-corpo');
            container.innerHTML = "";

            const ativos = clientesRaw.filter(c => !c.arquivado && !c.pago);
            const pagosCount = clientesRaw.filter(c => c.pago && !c.arquivado).length;
            const arquivadosCount = clientesRaw.filter(c => c.arquivado).length;

            document.getElementById('btn-aba-pagos').innerText = `Pagos (${pagosCount})`;
            document.getElementById('btn-aba-arquivados').innerText = `Arquivados (${arquivadosCount})`;
            document.getElementById('contagem').innerHTML = `Total de Ativos: <b>${ativos.length}</b>`;

            const filtrados = ativos.filter(c => {
                const nome = (c.nome || c.cliente || c.Nome || "").toLowerCase();
                const painel = (c.painel || c.Painel || "").toLowerCase();
                const whats = (c.whats || c.whatsapp || c.Whats || "").toLowerCase();
                return nome.includes(termo) || painel.includes(termo) || whats.includes(termo);
            });

            if (filtrados.length === 0) {
                if (clientesRaw.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:var(--text-sub); margin-top:30px; padding:20px; background:#fff; border-radius:16px; border:1px solid #e2e8f0;">
                        <p style="font-weight:700; margin-bottom:8px;">Nenhum cliente cadastrado ainda.</p>
                        <p style="font-size:12px; color:#94a3b8;">Clique em <b>"+ ADICIONAR CLIENTE"</b> no topo para incluir seu primeiro registro.</p>
                    </div>`;
                } else {
                    container.innerHTML = `<p style="text-align:center; color:var(--text-sub); margin-top:30px; font-weight:600;">Nenhum resultado para a busca.</p>`;
                }
                return;
            }

            filtrados.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card-cliente';

                const hoje = new Date().toISOString().split('T')[0];
                const venc = c.vencimento || c.dataVencimento || c.Vencimento || "";
                let statusClass = 'em-dia';
                let statusTexto = 'EM DIA';

                if (venc && venc < hoje) {
                    statusClass = 'vencido';
                    statusTexto = 'VENCIDO';
                    card.classList.add('vencido-border');
                } else if (venc && venc === hoje) {
                    statusClass = 'vence-logo';
                    statusTexto = 'VENCE HOJE';
                }

                const nomeExibir = c.nome || c.cliente || c.Nome || 'Sem nome';
                const painelExibir = c.painel || c.Painel || '-';
                const whatsExibir = c.whats || c.whatsapp || c.Whats || '-';
                const obsExibir = c.obs || c.observacao || c.Obs || '';

                card.innerHTML = `
                    <div class="container-badges">
                        <span class="status-vencimento ${statusClass}">${statusTexto}</span>
                        ${c.prolongado ? `<span class="selo-prolongado">Prolongado</span>` : ''}
                    </div>
                    <h3>${nomeExibir}</h3>
                    <div class="info-p">Painel: <b>${painelExibir}</b></div>
                    <div class="info-p">Vencimento: <b>${formatarData(venc)}</b></div>
                    <div class="info-p">WhatsApp: <b>${whatsExibir}</b></div>
                    ${obsExibir ? `<div class="obs-box">${obsExibir}</div>` : ''}
                    <div class="card-linha"></div>
                    <div class="flex-botoes-icones">
                        <button class="btn-icone btn-i-renovar" title="Renovar +1 Mês" data-id="${c.id}" data-path="${c._fullPath}" data-action="renovar">
                            <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                        </button>
                        <button class="btn-icone btn-i-pago" title="Marcar como Pago" data-id="${c.id}" data-path="${c._fullPath}" data-action="pago">
                            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button class="btn-icone btn-i-prolongar" title="Prolongar 3 Dias" data-id="${c.id}" data-path="${c._fullPath}" data-action="prolongar">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14 14"/></svg>
                        </button>
                        <button class="btn-icone btn-i-editar" title="Editar" data-id="${c.id}" data-path="${c._fullPath}" data-action="editar">
                            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="btn-icone btn-i-arquivar" title="Arquivar" data-id="${c.id}" data-path="${c._fullPath}" data-action="arquivar">
                            <svg viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                        </button>
                        <button class="btn-icone btn-i-excluir" title="Excluir" data-id="${c.id}" data-path="${c._fullPath}" data-action="excluir">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function formatarData(dataIso) {
            if (!dataIso) return '-';
            const partes = dataIso.split('-');
            if (partes.length !== 3) return dataIso;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function renderizarMural() {
            const container = document.getElementById('lista-mural');
            container.innerHTML = "";
            muralRaw.forEach(m => {
                const item = document.createElement('div');
                item.className = 'card-aviso';
                item.innerHTML = `
                    <span>${m.texto || m.Texto}</span>
                    <button style="border:none; background:none; color:var(--danger); font-weight:800; cursor:pointer;" data-mural-id="${m.id}" data-path="${m._fullPath}">✕</button>
                `;
                container.appendChild(item);
            });
        }

        async function tratarAcaoCliente(id, path, acao) {
            const docRef = doc(db, path);
            const cli = clientesRaw.find(c => c.id === id);

            if (acao === 'excluir') {
                if (confirm("Tem certeza que deseja excluir este cliente?")) {
                    await deleteDoc(docRef);
                }
            } else if (acao === 'arquivar') {
                await updateDoc(docRef, { arquivado: true });
            } else if (acao === 'pago') {
                await updateDoc(docRef, { pago: true });
            } else if (acao === 'prolongar') {
                const venc = cli.vencimento || cli.dataVencimento || cli.Vencimento;
                if (!venc) return;
                let d = new Date(venc);
                d.setDate(d.getDate() + 3);
                await updateDoc(docRef, { 
                    vencimento: d.toISOString().split('T')[0],
                    prolongado: true 
                });
            } else if (acao === 'renovar') {
                const venc = cli.vencimento || cli.dataVencimento || cli.Vencimento;
                if (!venc) return;
                let d = new Date(venc);
                d.setMonth(d.getMonth() + 1);
                await updateDoc(docRef, { 
                    vencimento: d.toISOString().split('T')[0],
                    prolongado: false,
                    pago: false
                });
            } else if (acao === 'editar') {
                abrirModalCliente(cli);
            }
        }

        function abrirModalCliente(cli = null) {
            const modal = document.getElementById('modal-cliente');
            if (cli) {
                document.getElementById('modal-titulo').innerText = "Editar Cliente";
                document.getElementById('edit-id').value = cli.id;
                document.getElementById('edit-path').value = cli._fullPath;
                document.getElementById('cli-nome').value = cli.nome || cli.cliente || cli.Nome || "";
                document.getElementById('cli-painel').value = cli.painel || cli.Painel || "";
                document.getElementById('cli-whats').value = cli.whats || cli.whatsapp || cli.Whats || "";
                document.getElementById('cli-vencimento').value = cli.vencimento || cli.dataVencimento || cli.Vencimento || "";
                document.getElementById('cli-obs').value = cli.obs || cli.observacao || cli.Obs || "";
            } else {
                document.getElementById('modal-titulo').innerText = "Novo Cliente";
                document.getElementById('edit-id').value = "";
                document.getElementById('edit-path').value = "";
                document.getElementById('cli-nome').value = "";
                document.getElementById('cli-painel').value = "";
                document.getElementById('cli-whats').value = "";
                document.getElementById('cli-vencimento').value = "";
                document.getElementById('cli-obs').value = "";
            }
            modal.style.display = 'flex';
        }

        async function salvarCliente() {
            const id = document.getElementById('edit-id').value;
            const targetPath = document.getElementById('edit-path').value;
            
            const dados = {
                nome: document.getElementById('cli-nome').value.trim(),
                painel: document.getElementById('cli-painel').value.trim(),
                whats: document.getElementById('cli-whats').value.trim(),
                vencimento: document.getElementById('cli-vencimento').value,
                obs: document.getElementById('cli-obs').value.trim()
            };

            if (!dados.nome || !dados.vencimento) {
                alert("Preencha ao menos o nome e o vencimento.");
                return;
            }

            try {
                if (id && targetPath) {
                    await updateDoc(doc(db, targetPath), dados);
                } else {
                    dados.arquivado = false;
                    dados.pago = false;
                    dados.prolongado = false;
                    dados.usuario = logado;
                    await addDoc(collection(db, "usuarios", logado, "clientes"), dados);
                }
                document.getElementById('modal-cliente').style.display = 'none';
            } catch (err) {
                alert("Erro ao salvar dados: " + err.message);
            }
        }

        function abrirModalPagos() {
            const container = document.getElementById('lista-pagos-corpo');
            container.innerHTML = "";
            const pagos = clientesRaw.filter(c => c.pago && !c.arquivado);
            
            if(pagos.length === 0) {
                container.innerHTML = "<p style='font-size:13px; color:var(--text-sub);'>Nenhum cliente pago.</p>";
            } else {
                pagos.forEach(c => {
                    const item = document.createElement('div');
                    item.style.padding = "10px 0";
                    item.style.borderBottom = "1px solid #f1f5f9";
                    item.style.display = "flex";
                    item.style.justifyContent = "space-between";
                    item.style.alignItems = "center";
                    item.innerHTML = `
                        <div>
                            <strong style="font-size:14px;">${c.nome || c.cliente || c.Nome}</strong>
                            <div style="font-size:11px; color:var(--text-sub);">${c.painel || '-'} - Vence: ${formatarData(c.vencimento || c.dataVencimento)}</div>
                        </div>
                        <button style="background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; font-size:10px; font-weight:800; padding:6px 10px; border-radius:8px; cursor:pointer;" data-desmarcar-pago="${c.id}" data-path="${c._fullPath}">REATIVAR</button>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById('modal-pagos').style.display = 'flex';
        }

        function abrirModalArquivados() {
            const container = document.getElementById('lista-arquivados-corpo');
            container.innerHTML = "";
            const arq = clientesRaw.filter(c => c.arquivado);
            
            if(arq.length === 0) {
                container.innerHTML = "<p style='font-size:13px; color:var(--text-sub);'>Nenhum cliente arquivado.</p>";
            } else {
                arq.forEach(c => {
                    const item = document.createElement('div');
                    item.style.padding = "10px 0";
                    item.style.borderBottom = "1px solid #f1f5f9";
                    item.style.display = "flex";
                    item.style.justifyContent = "space-between";
                    item.style.alignItems = "center";
                    item.innerHTML = `
                        <div>
                            <strong style="font-size:14px;">${c.nome || c.cliente || c.Nome}</strong>
                            <div style="font-size:11px; color:var(--text-sub);">${c.painel || '-'}</div>
                        </div>
                        <button style="background:#dbeafe; border:1px solid #bfdbfe; color:#1e40af; font-size:10px; font-weight:800; padding:6px 10px; border-radius:8px; cursor:pointer;" data-desarquivar="${c.id}" data-path="${c._fullPath}">DESARQUIVAR</button>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById('modal-arquivados').style.display = 'flex';
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-login-submit').addEventListener('click', executarLogin);
            
            document.getElementById('u').addEventListener('keypress', (e) => { if(e.key === 'Enter') executarLogin(); });
            document.getElementById('p').addEventListener('keypress', (e) => { if(e.key === 'Enter') executarLogin(); });

            document.getElementById('busca').addEventListener('input', renderizarClientes);
            document.getElementById('btn-abrir-add-cli').addEventListener('click', () => abrirModalCliente());
            document.getElementById('btn-salvar-cli').addEventListener('click', salvarCliente);
            document.getElementById('btn-fechar-cli').addEventListener('click', () => { document.getElementById('modal-cliente').style.display = 'none'; });

            document.getElementById('btn-aba-pagos').addEventListener('click', abrirModalPagos);
            document.getElementById('btn-fechar-pagos').addEventListener('click', () => { document.getElementById('modal-pagos').style.display = 'none'; });

            document.getElementById('btn-aba-arquivados').addEventListener('click', abrirModalArquivados);
            document.getElementById('btn-fechar-arquivados').addEventListener('click', () => { document.getElementById('modal-arquivados').style.display = 'none'; });

            document.getElementById('btn-abrir-robo').addEventListener('click', () => { document.getElementById('modal-robo').style.display = 'flex'; });
            document.getElementById('btn-fechar-robo').addEventListener('click', () => { document.getElementById('modal-robo').style.display = 'none'; });

            document.getElementById('btn-sair').addEventListener('click', () => {
                if(confirm("Deseja realmente sair?")) {
                    localStorage.removeItem('gestor_u');
                    localStorage.removeItem('gestor_p');
                    location.reload();
                }
            });

            document.getElementById('lista-corpo').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (btn) {
                    const id = btn.getAttribute('data-id');
                    const path = btn.getAttribute('data-path');
                    const action = btn.getAttribute('data-action');
                    tratarAcaoCliente(id, path, action);
                }
            });

            document.getElementById('lista-mural').addEventListener('click', async (e) => {
                const btn = e.target.closest('[data-mural-id]');
                if (btn) {
                    const id = btn.getAttribute('data-mural-id');
                    const path = btn.getAttribute('data-path');
                    await deleteDoc(doc(db, path || `usuarios/${logado}/mural/${id}`));
                }
            });

            document.getElementById('btn-add-mural').addEventListener('click', async () => {
                const txt = prompt("Digite a anotação para o mural:");
                if (txt) {
                    await addDoc(collection(db, "usuarios", logado, "mural"), { texto: txt });
                }
            });

            document.getElementById('btn-hide-mural').addEventListener('click', () => {
                muralOculto = !muralOculto;
                document.getElementById('wrapper-mural-retratil').style.display = muralOculto ? 'none' : 'block';
                document.getElementById('btn-hide-mural').innerText = muralOculto ? 'Exibir Mural' : 'Ocultar Mural';
            });

            document.getElementById('lista-pagos-corpo').addEventListener('click', async (e) => {
                const btn = e.target.closest('[data-desmarcar-pago]');
                if (btn) {
                    const id = btn.getAttribute('data-desmarcar-pago');
                    const path = btn.getAttribute('data-path');
                    await updateDoc(doc(db, path), { pago: false });
                    abrirModalPagos();
                }
            });

            document.getElementById('lista-arquivados-corpo').addEventListener('click', async (e) => {
                const btn = e.target.closest('[data-desarquivar]');
                if (btn) {
                    const id = btn.getAttribute('data-desarquivar');
                    const path = btn.getAttribute('data-path');
                    await updateDoc(doc(db, path), { arquivado: false });
                    abrirModalArquivados();
                }
            });

            const savedU = localStorage.getItem('gestor_u');
            const savedP = localStorage.getItem('gestor_p');
            if (savedU && savedP) { 
                document.getElementById('u').value = savedU; 
                document.getElementById('p').value = savedP; 
                document.getElementById('remember').checked = true; 
                executarLogin(); 
            }
        });
    </script>
</body>
</html>
