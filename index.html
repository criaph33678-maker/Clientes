<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gestor Business V13.15</title>
    <style>
        :root { --bg: #000; --card: #111; --text: #fff; --accent: #3b82f6; --danger: #ff3b30; --success: #4ade80; --warning: #facc15; }
        
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; }

        /* HEADER E BOTÃO ADICIONAR NO TOPO */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 10px 15px; padding-top: env(safe-area-inset-top); z-index: 1000; border-bottom: 1px solid #1a1a1a; }
        .stats-topo { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
        .stats-topo b { color: var(--accent); }
        
        /* BOTÃO ADICIONAR CLIENTE NO TOPO (SOLICITADO) */
        .btn-novo-cliente-topo { background: var(--accent); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; margin-bottom: 12px; cursor: pointer; text-transform: uppercase; }

        .busca-container { background: #1a1a1a; display: flex; align-items: center; padding: 10px 15px; border-radius: 15px; border: 1px solid #333; }
        .busca-container input { background: none; border: none; color: #fff; flex: 1; outline: none; font-size: 14px; }
        
        /* CONTEÚDO */
        .secao-mural { margin-top: calc(145px + env(safe-area-inset-top)); padding: 15px; }
        .card-aviso { background: #1a1a1a; padding: 12px; border-radius: 15px; margin-bottom: 8px; font-size: 13px; font-weight: bold; border-left: 4px solid var(--accent); }

        /* CARDS PEQUENOS */
        .lista-clientes { padding: 0 15px 100px 15px; }
        .card-cliente { background: #111; border: 1px solid #333; border-radius: 20px; padding: 15px; margin-bottom: 12px; position: relative; }
        .card-cliente.vence-logo { border: 2px solid var(--danger); box-shadow: 0 0 10px rgba(255, 59, 48, 0.2); }
        .card-cliente h3 { margin: 0 0 5px 0; font-size: 18px; font-weight: 800; text-transform: uppercase; }
        .info-p { font-size: 12px; color: #aaa; margin: 2px 0; }
        .vence-em { color: var(--warning); font-weight: bold; font-size: 11px; margin-top: 5px; }

        /* BOTÕES */
        .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn-card { padding: 10px; border-radius: 10px; border: none; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .btn-renovar { background: var(--success); color: #000; }
        .btn-editar { background: #333; color: #fff; }
        .btn-excluir { background: var(--danger); color: #fff; grid-column: span 2; margin-top: 4px; padding: 8px; }

        .btn-sair { position: fixed; top: 12px; right: 15px; background: none; border: none; color: #444; font-size: 10px; z-index: 1100; font-weight: bold; }
    </style>
</head>
<body>

    <button class="btn-sair" onclick="confirmarSair()">SAIR</button>

    <div id="tela-login" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <div style="background:#111; padding:30px; border-radius:25px; width:85%; max-width:280px; text-align:center; border:1px solid #333;">
            <h2 style="margin-bottom:25px;">GESTOR BUSINESS</h2>
            <input type="text" id="u" placeholder="Usuário" style="width:100%; padding:12px; margin-bottom:10px; border-radius:12px; border:1px solid #333; background:#000; color:#fff; box-sizing:border-box; outline:none;">
            <input type="password" id="p" placeholder="Senha" style="width:100%; padding:12px; margin-bottom:20px; border-radius:12px; border:1px solid #333; background:#000; color:#fff; box-sizing:border-box; outline:none;">
            <button onclick="logar()" style="width:100%; padding:12px; background:var(--accent); border:none; color:#fff; border-radius:12px; font-weight:900;">ACESSAR</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="header-fixo">
            <div id="contagem" class="stats-topo"></div>
            <button class="btn-novo-cliente-topo" onclick="novoCliente()">+ Adicionar Cliente</button>
            <div class="busca-container">
                <input type="text" id="busca" placeholder="Buscar cliente na lista..." oninput="filtrar()">
            </div>
        </header>

        <section class="secao-mural">
            <div id="lista-mural"></div>
        </section>

        <section class="lista-clientes" id="lista-corpo"></section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let dadosRaw = [];
        let logado = null;

        window.logar = async () => {
            const login = document.getElementById('u').value.toLowerCase().trim();
            const pass = document.getElementById('p').value;
            const q = query(collection(db, "usuarios"), where("login", "==", login), where("senha", "==", pass));
            const snap = await getDocs(q);
            if(!snap.empty) { logado = snap.docs[0].data(); iniciarApp(); } else { alert("Acesso negado!"); }
        };

        function iniciarApp() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            carregarDados();
            carregarMural();
        }

        function carregarDados() {
            const q = (logado.login === 'admin') 
                ? query(collection(db, "clientes"), orderBy("data", "asc"))
                : query(collection(db, "clientes"), where("dono", "==", logado.login), orderBy("data", "asc"));

            onSnapshot(q, (snap) => {
                dadosRaw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // CONTAGEM DINÂMICA DE TODOS OS PAINÉIS EXISTENTES
                const contagemPaineis = {};
                dadosRaw.forEach(c => {
                    const p = c.painel || "Outros";
                    contagemPaineis[p] = (contagemPaineis[p] || 0) + 1;
                });

                let htmlStats = "";
                for (const p in contagemPaineis) {
                    htmlStats += `${p}: <b>${contagemPaineis[p]}</b> | `;
                }
                document.getElementById('contagem').innerHTML = htmlStats + `Total: <b>${dadosRaw.length}</b>`;
                
                render(dadosRaw);
            });
        }

        function render(lista) {
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            document.getElementById('lista-corpo').innerHTML = lista.map(c => {
                const v = new Date(c.data + 'T23:59:59');
                const diff = Math.ceil((v - hoje) / 86400000);
                const classeVence = (diff <= 3 && diff >= 0) ? 'vence-logo' : '';

                return `
                <div class="card-cliente ${classeVence}">
                    <h3>${c.nome}</h3>
                    <p class="info-p">Painel: <b>${c.painel}</b></p>
                    <p class="info-p">Vence: <b>${c.data.split('-').reverse().join('/')}</b></p>
                    ${diff <= 3 && diff >= 0 ? `<div class="vence-em">⚠️ VENCE EM ${diff} DIAS</div>` : ''}
                    <div class="grid-botoes">
                        <button class="btn-card btn-renovar" onclick="renovar('${c.id}', '${c.data}')">+1 MÊS</button>
                        <button class="btn-card btn-editar" onclick="editar('${c.id}')">EDITAR</button>
                        <button class="btn-card btn-excluir" onclick="excluir('${c.id}', 'clientes')">EXCLUIR</button>
                    </div>
                </div>`;
            }).join('');
        }

        function carregarMural() {
            const q = (logado.login === 'admin') 
                ? query(collection(db, "avisos"), orderBy("criadoEm", "desc"))
                : query(collection(db, "lembretes_privados"), where("usuarioId", "==", logado.login), orderBy("criadoEm", "desc"));

            onSnapshot(q, (snap) => {
                document.getElementById('lista-mural').innerHTML = snap.docs.map(d => `
                    <div class="card-aviso" onclick="excluir('${d.id}', '${logado.login === 'admin' ? 'avisos' : 'lembretes_privados'}')">
                        📢 ${d.data().texto}
                    </div>`).join('');
            });
        }

        window.novoCliente = async () => {
            const n = prompt("Nome do Cliente:");
            const p = prompt("Nome do Painel (Livre):");
            const d = prompt("Vencimento (AAAA-MM-DD):");
            if(n && p && d) await addDoc(collection(db, "clientes"), { nome: n, painel: p, data: d, dono: logado.login });
        };

        window.renovar = async (id, data) => {
            let dt = new Date(data + 'T23:59:59');
            dt.setMonth(dt.getMonth() + 1);
            await updateDoc(doc(db, "clientes", id), { data: dt.toISOString().split('T')[0] });
        };

        window.excluir = async (id, pasta) => { if(confirm("Remover?")) await deleteDoc(doc(db, pasta, id)); };
        window.confirmarSair = () => { location.reload(); };
        window.filtrar = () => {
            const t = document.getElementById('busca').value.toLowerCase();
            render(dadosRaw.filter(x => x.nome.toLowerCase().includes(t)));
        };
    </script>
</body>
</html>
