<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gestor Pro">
    
    <title>Gestor Elite V8</title>
    <style>
        :root { --bg: #000; --card: #1a1a1a; --text: #fff; --accent: #3b82f6; --danger: #ff4d4d; --warning: #f59e0b; --success: #10b981; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            padding-top: calc(80px + env(safe-area-inset-top)); /* Ajuste para o entalhe do iPhone */
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .header { 
            position: fixed; top: 0; left: 0; right: 0; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); 
            padding: 15px; padding-top: env(safe-area-inset-top);
            z-index: 100; border-bottom: 1px solid #333; 
            display: flex; justify-content: center; 
        }
        
        .btn-add { background: var(--accent); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; }

        /* LEMBRETES */
        .lembretes-container { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 25px; border: 1px dashed var(--warning); }
        .lembretes-header { color: var(--warning); font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .lembrete-input-group { display: flex; gap: 5px; margin-bottom: 15px; }
        .lembrete-input-group input { flex: 1; background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; }
        .btn-add-lembrete { background: var(--warning); color: black; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; }
        .lembrete-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; }
        .btn-del-lembrete { color: var(--danger); background: none; border: none; font-size: 18px; }

        /* CLIENTES */
        .cliente-item { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .urgente { border: 2px solid var(--danger) !important; background: rgba(255, 77, 77, 0.05); }
        .info h4 { margin: 0; font-size: 18px; }
        .info p { margin: 4px 0; font-size: 13px; color: #aaa; }
        .acoes { display: flex; gap: 10px; border-top: 1px solid #333; padding-top: 12px; margin-top: 12px; }
        .btn-acao { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; }
        .btn-plus { background: var(--success); color: white; }
        .btn-edit { background: #333; color: white; }
        .btn-del { background: rgba(255, 77, 77, 0.15); color: var(--danger); }

        /* MODAL */
        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn-save { background: var(--accent); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; }
        .btn-cancel { background: transparent; color: #888; border: none; width: 100%; padding: 10px; }
    </style>
</head>
<body>

    <div class="header"><button class="btn-add" onclick="abrirModal()">+ Novo Cliente</button></div>

    <div class="lembretes-container">
        <div class="lembretes-header">⚠️ LEMBRETES</div>
        <div class="lembrete-input-group">
            <input type="text" id="novoLembrete" placeholder="Novo lembrete...">
            <button class="btn-add-lembrete" onclick="adicionarLembrete()">+</button>
        </div>
        <div id="listaLembretes"></div>
    </div>

    <div id="lista"></div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin:0">Cliente</h3>
            <input type="hidden" id="editId">
            <input type="text" id="nomeCli" placeholder="Nome">
            <input type="date" id="dataCli">
            <input type="text" id="painelCli" placeholder="Painel">
            <button class="btn-save" onclick="salvarCliente()">Salvar</button>
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('meusClientesProV8')) || [];
        let lembretes = JSON.parse(localStorage.getItem('meusLembretesV8')) || [];

        function adicionarLembrete() {
            const txt = document.getElementById('novoLembrete').value;
            if(!txt) return;
            lembretes.push({ id: Date.now(), texto: txt });
            document.getElementById('novoLembrete').value = "";
            salvarLembretes();
        }

        function excluirLembrete(id) {
            lembretes = lembretes.filter(l => l.id !== id);
            salvarLembretes();
        }

        function salvarLembretes() {
            localStorage.setItem('meusLembretesV8', JSON.stringify(lembretes));
            renderLembretes();
        }

        function renderLembretes() {
            const div = document.getElementById('listaLembretes');
            div.innerHTML = lembretes.map(l => `
                <div class="lembrete-item">
                    <span>• ${l.texto}</span>
                    <button class="btn-del-lembrete" onclick="excluirLembrete(${l.id})">×</button>
                </div>
            `).join('');
        }

        function abrirModal(id = null) {
            document.getElementById('modal').style.display = 'flex';
            if(id) {
                const c = clientes.find(item => item.id === id);
                document.getElementById('editId').value = c.id;
                document.getElementById('nomeCli').value = c.nome;
                document.getElementById('dataCli').value = c.data;
                document.getElementById('painelCli').value = c.painel;
            } else {
                document.getElementById('editId').value = "";
                document.getElementById('nomeCli').value = "";
                document.getElementById('dataCli').value = "";
                document.getElementById('painelCli').value = "";
            }
        }

        function fecharModal() { document.getElementById('modal').style.display = 'none'; }

        function salvarCliente() {
            const id = document.getElementById('editId').value;
            const nome = document.getElementById('nomeCli').value;
            const data = document.getElementById('dataCli').value;
            const painel = document.getElementById('painelCli').value;
            if(!nome || !data) return alert("Preencha!");

            if(id) {
                const index = clientes.findIndex(c => c.id == id);
                clientes[index] = { id: Number(id), nome, data, painel };
            } else {
                clientes.push({ id: Date.now(), nome, data, painel });
            }
            atualizarStorage();
            fecharModal();
        }

        function renovarUmMes(id) {
            const index = clientes.findIndex(c => c.id === id);
            let partes = clientes[index].data.split('-');
            let ano = parseInt(partes[0]);
            let mes = parseInt(partes[1]);
            let dia = partes[2];
            mes++; if (mes > 12) { mes = 1; ano++; }
            let novoMes = mes < 10 ? '0' + mes : mes;
            clientes[index].data = `${ano}-${novoMes}-${dia}`;
            atualizarStorage();
        }

        function excluirCliente(id) {
            if(confirm("Apagar?")) {
                clientes = clientes.filter(c => c.id !== id);
                atualizarStorage();
            }
        }

        function atualizarStorage() {
            localStorage.setItem('meusClientesProV8', JSON.stringify(clientes));
            renderClientes();
        }

        function renderClientes() {
            const listaDiv = document.getElementById('lista');
            const hoje = new Date(); hoje.setHours(0,0,0,0);

            clientes.sort((a, b) => {
                const dA = new Date(a.data); const dB = new Date(b.data);
                const urgA = ((dA - hoje) / 86400000) <= 3 ? 1 : 0;
                const urgB = ((dB - hoje) / 86400000) <= 3 ? 1 : 0;
                if (urgA !== urgB) return urgB - urgA;
                return dA - dB;
            });
            
            listaDiv.innerHTML = clientes.map(c => {
                const dV = new Date(c.data);
                const diff = Math.ceil((dV - hoje) / 86400000);
                const isUrgente = diff <= 3;
                return `
                    <div class="cliente-item ${isUrgente ? 'urgente' : ''}">
                        <div class="info">
                            <h4>${c.nome} ${isUrgente ? '⚠️' : ''}</h4>
                            <p>🖥️ Painel: ${c.painel}</p>
                            <p style="color: ${isUrgente ? 'var(--danger)' : '#aaa'}">
                                ${isUrgente ? 'VENCE EM ' + diff + ' DIAS' : 'Vence em: ' + c.data.split('-').reverse().join('/')}
                            </p>
                        </div>
                        <div class="acoes">
                            <button class="btn-acao btn-plus" onclick="renovarUmMes(${c.id})">+1 Mês</button>
                            <button class="btn-acao btn-edit" onclick="abrirModal(${c.id})">Editar</button>
                            <button class="btn-acao btn-del" onclick="excluirCliente(${c.id})">Excluir</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = () => { renderLembretes(); renderClientes(); };
    </script>
</body>
</html>
