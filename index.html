<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Gestor Business V12</title>
    <style>
        :root { --bg: #000; --card: #1a1a1a; --text: #fff; --accent: #3b82f6; --danger: #ff0000; --warning: #f59e0b; --success: #00ff00; --wpp: #25d366; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-top: calc(115px + env(safe-area-inset-top)); }
        
        /* HEADER COM CONTADORES E BUSCA */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); padding: 10px; padding-top: env(safe-area-inset-top); z-index: 100; border-bottom: 1px solid #333; }
        .stats { font-size: 11px; color: #aaa; display: flex; gap: 8px; margin-bottom: 8px; justify-content: flex-start; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; font-weight: 600; }
        .stats b { color: var(--accent); }
        
        .busca-container { display: flex; gap: 8px; align-items: center; background: #222; padding: 8px 15px; border-radius: 20px; border: 1px solid #444; }
        .busca-container input { background: none; border: none; color: white; flex: 1; outline: none; font-size: 15px; }

        /* LISTA DE CLIENTES E DESTAQUE DE LETRAS */
        .cliente-item { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 12px; border: 1px solid #333; transition: 0.3s; }
        .info h4 { margin: 0 0 5px 0; font-size: 20px; font-weight: 800; text-transform: uppercase; color: var(--text); }
        .info p { margin: 4px 0; font-size: 14px; color: #bbb; font-weight: 500; }
        .info b { color: var(--text); }

        /* BOTÕES COM CORES INTENSAS */
        .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; border-top: 1px solid #333; padding-top: 12px; }
        .btn-acao { padding: 12px; border-radius: 10px; border: none; font-weight: 800; font-size: 13px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-plus { background: var(--success); box-shadow: 0 0 10px rgba(0, 255, 0, 0.2); }
        .btn-plus:active { background: #00cc00; }
        .btn-edit { background: #444; }
        .btn-del { background: var(--danger); grid-column: span 2; box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); }
        .btn-del:active { background: #cc0000; }

        /* TOAST E MODAL */
        #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 300; left: 50%; transform: translateX(-50%); bottom: 30px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 20px; border-radius: 20px; width: 85%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 14px; margin: 8px 0; background: #333; border: 1px solid #444; border-radius: 10px; color: white; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header-fixo">
        <div id="contadores" class="stats">Calculando...</div>
        <div class="busca-container">
            <span style="font-size: 16px;">🔍</span>
            <input type="text" id="inputBusca" placeholder="Pesquisar nome do cliente..." oninput="filtrarClientes()">
            <button onclick="abrirModal()" style="background:var(--accent); border:none; color:white; border-radius:50%; width:32px; height:32px; font-weight:900; font-size:18px">+</button>
        </div>
    </div>

    <div id="lista"></div>
    <div id="toast">✅ Operação realizada!</div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin:0 0 10px 0; font-weight:900">Novo Cliente</h3>
            <input type="hidden" id="editId">
            <input type="text" id="nomeCli" placeholder="Nome do Cliente">
            <input type="text" id="wppCli" placeholder="WhatsApp (DDD+Número)">
            <input type="date" id="dataCli">
            <input type="text" id="painelCli" placeholder="Nome do Painel">
            <button class="btn-plus" style="width:100%; padding:15px; margin-top:10px" onclick="salvarCliente()">Confirmar e Salvar</button>
            <button onclick="fecharModal()" style="background:none; border:none; color:#aaa; width:100%; margin-top:10px; font-weight:600">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let todosClientes = [];

        function mostrarFeedback(mensagem, cor = "#00ff00") {
            const toast = document.getElementById("toast");
            toast.innerText = mensagem;
            toast.style.backgroundColor = cor;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        window.abrirModal = (id = null) => {
            document.getElementById('modal').style.display = 'flex';
            if(id) {
                const c = todosClientes.find(cli => cli.id === id);
                document.getElementById('modalTitle').innerText = "Editar Dados";
                document.getElementById('editId').value = id;
                document.getElementById('nomeCli').value = c.nome;
                document.getElementById('wppCli').value = c.whatsapp || "";
                document.getElementById('dataCli').value = c.data;
                document.getElementById('painelCli').value = c.painel || "";
            } else {
                document.getElementById('modalTitle').innerText = "Novo Cadastro";
                document.getElementById('editId').value = "";
                document.querySelectorAll('#modal input').forEach(i => i.value = "");
            }
        };

        window.fecharModal = () => { document.getElementById('modal').style.display = 'none'; };

        window.salvarCliente = async () => {
            const id = document.getElementById('editId').value;
            const dados = {
                nome: document.getElementById('nomeCli').value,
                whatsapp: document.getElementById('wppCli').value.replace(/\D/g,''),
                data: document.getElementById('dataCli').value,
                painel: document.getElementById('painelCli').value || "Geral"
            };
            if(!dados.nome || !dados.data) return alert("Nome e Data são obrigatórios!");
            if(id) {
                if(confirm("Deseja salvar as alterações deste cliente?")) {
                    await updateDoc(doc(db, "clientes", id), dados);
                    mostrarFeedback("✅ Alterações salvas com sucesso!");
                }
            } else {
                await addDoc(collection(db, "clientes"), { ...dados, criadoEm: Date.now() });
                mostrarFeedback("✅ Novo cliente cadastrado!");
            }
            fecharModal();
        };

        window.renovarUmMes = async (id, dataAtual) => {
            if(!confirm("Confirmar renovação de +1 mês para este cliente?")) return;
            let p = dataAtual.split('-');
            let d = new Date(p[0], p[1]-1, p[2]);
            d.setMonth(d.getMonth() + 1);
            await updateDoc(doc(db, "clientes", id), { data: d.toISOString().split('T')[0] });
            mostrarFeedback("🚀 Renovação realizada com sucesso!");
        };

        window.excluirCliente = async (id) => {
            if(confirm("⚠️ ATENÇÃO: Deseja EXCLUIR este cliente permanentemente?")) {
                await deleteDoc(doc(db, "clientes", id));
                mostrarFeedback("🗑️ Cliente excluído do sistema!", "#ff0000");
            }
        };

        window.filtrarClientes = () => {
            const termo = document.getElementById('inputBusca').value.toLowerCase();
            renderizar(todosClientes.filter(c => c.nome.toLowerCase().includes(termo)));
        };

        function renderizar(lista) {
            document.getElementById('lista').innerHTML = lista.map(c => `
                <div class="cliente-item">
                    <div class="info">
                        <h4>${c.nome}</h4>
                        <p>🖥️ Painel: <b>${c.painel}</b></p>
                        <p>📅 Vencimento: <b>${c.data.split('-').reverse().join('/')}</b></p>
                    </div>
                    <div class="acoes">
                        <button class="btn-acao btn-plus" onclick="renovarUmMes('${c.id}', '${c.data}')">➕ +1 Mês</button>
                        <button class="btn-acao btn-edit" onclick="abrirModal('${c.id}')">✏️ Editar</button>
                        <button class="btn-acao btn-del" onclick="excluirCliente('${c.id}')">🗑️ Excluir Cliente</button>
                    </div>
                </div>
            `).join('');
        }

        onSnapshot(query(collection(db, "clientes"), orderBy("data", "asc")), (snap) => {
            todosClientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const paineis = {};
            todosClientes.forEach(c => { paineis[c.painel] = (paineis[c.painel] || 0) + 1; });
            document.getElementById('contadores').innerHTML = Object.keys(paineis).map(p => `${p}: <b>${paineis[p]}</b>`).join(' | ') + ` | TOTAL: <b>${todosClientes.length}</b>`;
            filtrarClientes();
        });
    </script>
</body>
</html>
