<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Gestor Business V13.3</title>
    <style>
        :root { --bg: #000; --card: #111; --text: #fff; --accent: #3b82f6; --danger: #e63946; --success: #4ade80; --warning: #facc15; }
        
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* HEADER E BUSCA (IGUAL À FOTO) */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 10px 15px; padding-top: env(safe-area-inset-top); z-index: 1000; }
        .stats-topo { font-size: 11px; color: #3b82f6; font-weight: bold; margin-bottom: 8px; }
        .busca-wrapper { display: flex; gap: 10px; align-items: center; }
        .busca-container { background: #1a1a1a; flex: 1; display: flex; align-items: center; padding: 10px 15px; border-radius: 25px; border: 1px solid #333; }
        .busca-container input { background: none; border: none; color: #fff; flex: 1; outline: none; font-size: 14px; }
        .btn-add-total { background: #3b82f6; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; cursor: pointer; }

        /* MURAL (IGUAL À FOTO) */
        .secao-mural { margin-top: calc(100px + env(safe-area-inset-top)); padding: 15px; }
        .mural-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .mural-header h2 { font-size: 16px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .btn-novo-aviso { background: #3b82f6; border: none; color: white; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 12px; }
        .card-aviso { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #3b82f6; font-weight: bold; display: flex; align-items: center; gap: 10px; }

        /* CARDS DE CLIENTES (IGUAL À FOTO) */
        .lista-clientes { padding: 0 15px 100px 15px; }
        .card-cliente { background: #111; border: 2px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; }
        .card-cliente.vence-logo { border-color: #e63946; box-shadow: 0 0 10px rgba(230, 57, 70, 0.2); }
        .card-cliente h3 { margin: 0 0 10px 0; text-transform: uppercase; font-size: 22px; letter-spacing: 1px; }
        .info-linha { display: flex; align-items: center; gap: 8px; color: #ccc; font-size: 14px; margin-bottom: 5px; }
        .aviso-vencimento { color: var(--warning); font-weight: bold; font-size: 13px; margin-top: 5px; display: flex; align-items: center; gap: 5px; }

        /* BOTÕES DO CARD (IGUAL À FOTO) */
        .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-card { padding: 12px; border-radius: 12px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-renovar { background: #4ade80; color: #000; }
        .btn-editar { background: #333; color: #fff; }
        .btn-excluir { background: #e63946; color: #fff; grid-column: span 2; margin-top: 5px; }

        .btn-sair { position: fixed; top: 10px; right: 10px; background: none; border: none; color: #444; font-size: 10px; z-index: 1100; }
    </style>
</head>
<body>

    <button class="btn-sair" onclick="confirmarSair()">SAIR</button>

    <div id="tela-login" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <div style="background:#111; padding:30px; border-radius:20px; width:80%; max-width:300px; text-align:center; border:1px solid #333;">
            <h2>GESTOR</h2>
            <input type="text" id="u" placeholder="Usuário" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #333; background:#000; color:#fff;">
            <input type="password" id="p" placeholder="Senha" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #333; background:#000; color:#fff;">
            <button onclick="logar()" style="width:100%; padding:12px; background:#3b82f6; border:none; color:#fff; border-radius:8px; font-weight:bold; margin-top:10px;">ENTRAR</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="header-fixo">
            <div id="contagem" class="stats-topo"></div>
            <div class="busca-wrapper">
                <div class="busca-container">
                    <span>🔍</span>
                    <input type="text" id="busca" placeholder="Pesquisar cliente..." oninput="filtrar()">
                </div>
                <button class="btn-add-total" onclick="novoCliente()">+</button>
            </div>
        </header>

        <section class="secao-mural">
            <div class="mural-header">
                <h2>📌 MURAL DE LEMBRETES</h2>
                <button class="btn-novo-aviso" onclick="novoAviso()">+ NOVO AVISO</button>
            </div>
            <div id="lista-mural"></div>
        </section>

        <section class="lista-clientes" id="lista-corpo"></section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let dados = [];
        let user = null;

        window.logar = async () => {
            const login = document.getElementById('u').value.toLowerCase().trim();
            const pass = document.getElementById('p').value;
            const q = query(collection(db, "usuarios"), where("login", "==", login), where("senha", "==", pass));
            const snap = await getDocs(q);
            if(!snap.empty) { user = snap.docs[0].data(); iniciar(); } else { alert("Erro!"); }
        };

        function iniciar() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            carregar();
            carregarMural();
        }

        function carregar() {
            const q = (user.login === 'admin') 
                ? query(collection(db, "clientes"), orderBy("data", "asc"))
                : query(collection(db, "clientes"), where("dono", "==", user.login), orderBy("data", "asc"));

            onSnapshot(q, (snap) => {
                dados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('contagem').innerHTML = `TOTAL: ${dados.length}`;
                render();
            });
        }

        function render() {
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            document.getElementById('lista-corpo').innerHTML = dados.map(c => {
                const venc = new Date(c.data + 'T23:59:59');
                const diff = Math.ceil((venc - hoje) / 86400000);
                return `
                <div class="card-cliente ${diff <= 3 ? 'vence-logo' : ''}">
                    <h3>${c.nome}</h3>
                    <div class="info-linha">🖥️ Painel: <b>${c.painel}</b></div>
                    <div class="info-linha">📅 Vencimento: <b>${c.data.split('-').reverse().join('/')}</b></div>
                    ${diff <= 3 && diff >= 0 ? `<div class="aviso-vencimento">⚠️ VENCE EM ${diff} DIAS</div>` : ''}
                    ${diff < 0 ? `<div class="aviso-vencimento" style="color:red">❌ VENCIDO</div>` : ''}
                    
                    <div class="grid-botoes">
                        <button class="btn-card btn-renovar" onclick="renovar('${c.id}', '${c.data}')">➕ +1 MÊS</button>
                        <button class="btn-card btn-editar" onclick="editar('${c.id}')">✏️ EDITAR</button>
                        <button class="btn-card btn-excluir" onclick="excluir('${c.id}', 'clientes')">🗑️ EXCLUIR</button>
                    </div>
                </div>`;
            }).join('');
        }

        function carregarMural() {
            const q = (user.login === 'admin') 
                ? query(collection(db, "avisos"), orderBy("criadoEm", "desc"))
                : query(collection(db, "lembretes_privados"), where("usuarioId", "==", user.login), orderBy("criadoEm", "desc"));

            onSnapshot(q, (snap) => {
                document.getElementById('lista-mural').innerHTML = snap.docs.map(d => `
                    <div class="card-aviso" onclick="excluir('${d.id}', '${user.login === 'admin' ? 'avisos' : 'lembretes_privados'}')">
                        📢 ${d.data().texto}
                    </div>`).join('');
            });
        }

        window.novoCliente = async () => {
            const n = prompt("Nome:");
            const p = prompt("Painel:");
            const d = prompt("Vencimento (AAAA-MM-DD):");
            if(n && p && d) await addDoc(collection(db, "clientes"), { nome: n, painel: p, data: d, dono: user.login });
        };

        window.novoAviso = async () => {
            const t = prompt("Aviso:");
            if(t) {
                const pasta = (user.login === 'admin') ? "avisos" : "lembretes_privados";
                await addDoc(collection(db, pasta), { texto: t, usuarioId: user.login, criadoEm: Date.now() });
            }
        };

        window.renovar = async (id, data) => {
            let d = new Date(data + 'T23:59:59');
            d.setMonth(d.getMonth() + 1);
            await updateDoc(doc(db, "clientes", id), { data: d.toISOString().split('T')[0] });
        };

        window.excluir = async (id, pasta) => { if(confirm("Excluir?")) await deleteDoc(doc(db, pasta, id)); };
        window.confirmarSair = () => { location.reload(); };
        window.filtrar = () => {
            const t = document.getElementById('busca').value.toLowerCase();
            const f = dados.filter(c => c.nome.toLowerCase().includes(t));
            renderF(f);
        };
        function renderF(l) { /* mesma lógica de render mas para lista filtrada */ }
    </script>
</body>
</html>
