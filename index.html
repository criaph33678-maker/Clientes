    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        let app, db;
        let dadosRaw = [];
        let pagosRaw = [];
        let arquivadosRaw = [];
        let logado = null;
        let ocultarValores = false;
        let muralOculto = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            alert("Erro na conexão inicial do Firebase: " + e.message);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedU = localStorage.getItem('gestor_u');
            const savedP = localStorage.getItem('gestor_p');
            if(savedU && savedP) { 
                document.getElementById('u').value = savedU; 
                document.getElementById('p').value = savedP; 
                document.getElementById('remember').checked = true; 
                window.logar(); 
            }
            if(localStorage.getItem('mural_oculto') === 'true') {
                muralOculto = true;
                const el = document.getElementById('wrapper-mural-retratil');
                if(el) el.style.display = 'none';
                const btn = document.getElementById('btn-hide-mural');
                if(btn) btn.innerText = "Exibir Mural";
            }
        });

        window.logar = async () => {
            const btn = document.querySelector('.btn-login-3d');
            try {
                const login = document.getElementById('u').value.toLowerCase().trim();
                const pass = document.getElementById('p').value;

                if(!login || !pass) {
                    return alert("Por favor, preencha o login e a senha!");
                }

                if(btn) btn.innerText = "ENTRANDO...";

                const q = query(collection(db, "usuarios"), where("login", "==", login), where("senha", "==", pass));
                const snap = await getDocs(q);
                
                if(!snap.empty) { 
                    logado = snap.docs[0].data();
                    if(document.getElementById('remember').checked) { 
                        localStorage.setItem('gestor_u', login); 
                        localStorage.setItem('gestor_p', pass); 
                    }
                    document.getElementById('tela-login').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    carregarDados();
                } else { 
                    alert("Usuário ou senha incorretos!"); 
                    if(btn) btn.innerText = "ENTRAR";
                }
            } catch (error) {
                if(btn) btn.innerText = "ENTRAR";
                alert("Falha ao autenticar no banco de dados:\n" + error.message);
            }
        };

        function carregarDados() {
            try {
                const qC = (logado.login === 'admin') 
                    ? query(collection(db, "clientes"), orderBy("data", "asc")) 
                    : query(collection(db, "clientes"), where("dono", "==", logado.login), orderBy("data", "asc"));
                
                onSnapshot(qC, (snap) => {
                    let temp = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    let filtradoDono = (logado.login === 'admin') ? temp.filter(c => !c.dono || c.dono === 'admin') : temp;
                    
                    dadosRaw = filtradoDono.filter(c => !c.arquivado && !c.pago);
                    pagosRaw = filtradoDono.filter(c => !c.arquivado && c.pago === true);
                    arquivadosRaw = filtradoDono.filter(c => c.arquivado === true);
                    
                    atualizarContadores();
                    render(dadosRaw);
                }, (error) => {
                    alert("Erro ao buscar clientes: " + error.message);
                });

                const colMural = logado.login === 'admin' ? "avisos" : "lembretes_privados";
                const qM = (logado.login === 'admin') 
                    ? query(collection(db, "avisos"), orderBy("criadoEm", "desc")) 
                    : query(collection(db, "lembretes_privados"), where("usuarioId", "==", logado.login), orderBy("criadoEm", "desc"));
                
                onSnapshot(qM, (snap) => {
                    const lm = document.getElementById('lista-mural');
                    if(lm) {
                        lm.innerHTML = snap.docs.map(d => `
                            <div class="card-aviso" onclick="window.muralAcao('edit', '${d.id}', '${d.data().texto || d.data().textoAviso}')">📢 ${d.data().texto || d.data().textoAviso}</div>
                        `).join('');
                    }
                }, (error) => {
                    console.log("Aviso Mural:", error.message);
                });
            } catch (err) {
                alert("Erro ao carregar dados: " + err.message);
            }
        }

        window.abrirModalRobo = async () => {
            document.getElementById('modal-robo').style.display = 'flex';
            const docRef = doc(db, "config_robo", logado.login);
            const snap = await getDoc(docRef);
            if(snap.exists()) {
                const d = snap.data();
                document.getElementById('msg-aviso').value = d.msgAviso || "";
                document.getElementById('msg-expirado').value = d.msgExpirado || "";
                document.getElementById('robo-frequencia').value = d.frequencia || "1";
                document.getElementById('hora-disparo-1').value = d.hora1 || "09:00";
                document.getElementById('hora-disparo-2').value = d.hora2 || "18:00";
            }
        };

        window.salvarConfigRobo = async () => {
            const docRef = doc(db, "config_robo", logado.login);
            await setDoc(docRef, {
                msgAviso: document.getElementById('msg-aviso').value,
                msgExpirado: document.getElementById('msg-expirado').value,
                frequencia: document.getElementById('robo-frequencia').value,
                hora1: document.getElementById('hora-disparo-1').value,
                hora2: document.getElementById('hora-disparo-2').value
            });
            alert("Configurações salvas!");
            document.getElementById('modal-robo').style.display = 'none';
        };

        window.toggleMuralVisivel = () => {
            muralOculto = !muralOculto;
            document.getElementById('wrapper-mural-retratil').style.display = muralOculto ? 'none' : 'block';
            document.getElementById('btn-hide-mural').innerText = muralOculto ? "Exibir Mural" : "Ocultar Mural";
            localStorage.setItem('mural_oculto', muralOculto);
        };

        window.toggleOcultarStatus = () => {
            ocultarValores = !ocultarValores;
            document.getElementById('btn-ocultar-olho').innerText = ocultarValores ? "🙈" : "👁️";
            atualizarContadores();
        };

        function atualizarContadores() {
            const btnArq = document.getElementById('btn-aba-arquivados');
            if(btnArq) btnArq.innerText = `Arquivados (${arquivadosRaw.length})`;
            
            const btnPagos = document.getElementById('btn-aba-pagos');
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            
            let pagosExpirando = pagosRaw.some(c => {
                const dataUso = c.dataExibicao || c.data;
                const [ano, mes, dia] = dataUso.split('-').map(Number);
                const v = new Date(ano, mes - 1, dia, 23, 59, 59);
                const diff = Math.ceil((v - hoje) / 86400000);
                return diff <= 1;
            });

            if(btnPagos) {
                btnPagos.innerText = pagosExpirando ? `Pagos 🔴 (${pagosRaw.length})` : `Pagos (${pagosRaw.length})`;
            }
            
            const contElement = document.getElementById('contagem');
            if(!contElement) return;

            if(ocultarValores) {
                contElement.innerHTML = "Dados ocultados!";
                return;
            }
            const contPaineis = {};
            dadosRaw.forEach(c => contPaineis[c.painel] = (contPaineis[c.painel] || 0) + 1);
            let htmlS = ""; for (const p in contPaineis) htmlS += `${p}: <b>${contPaineis[p]}</b> | `;
            contElement.innerHTML = htmlS + `Pendentes: <b>${dadosRaw.length}</b>`;
        }

        window.muralAcao = async (tipo, id, textoAntigo) => {
            const col = logado.login === 'admin' ? "avisos" : "lembretes_privados";
            if(tipo === 'add') {
                const t = prompt("Nova anotação:");
                if(t) await addDoc(collection(db, col), logado.login === 'admin' ? { textoAviso: t, criadoEm: Date.now() } : { texto: t, usuarioId: logado.login, criadoEm: Date.now() });
            } else {
                const acao = confirm("Deseja EXCLUIR? (Cancele para EDITAR)");
                if(acao) { if(confirm("Apagar nota?")) await deleteDoc(doc(db, col, id)); }
                else {
                    const nt = prompt("Editar nota:", textoAntigo);
                    if(nt && nt !== textoAntigo) await updateDoc(doc(db, col, id), logado.login === 'admin' ? { textoAviso: nt } : { texto: nt });
                }
            }
        };

        function render(lista) {
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            const lc = document.getElementById('lista-corpo');
            if(!lc) return;

            lc.innerHTML = lista.map(c => {
                const dataExibir = c.dataExibicao || c.data;
                const [ano, mes, dia] = dataExibir.split('-').map(Number);
                const v = new Date(ano, mes - 1, dia, 23, 59, 59);
                const diff = Math.ceil((v - hoje) / 86400000);
                
                let classeSelo = "em-dia", textoSelo = "Em Dia", cardClasseExtra = "";
                
                if (diff <= 1) {
                    classeSelo = "vencido";
                    textoSelo = "Expirado";
                    cardClasseExtra = "vencido-border";
                } else if (diff <= 2) {
                    classeSelo = "vence-logo";
                    textoSelo = "Próx. Vencimento";
                }

                const seloProlongado = c.prolongado ? `<span class="selo-prolongado">Prolongado</span>` : '';
                const whatsText = c.whats ? ` | Whats: <b>${c.whats}</b>` : '';
                const obsText = c.obs ? `<div class="obs-box">📌 ${c.obs}</div>` : '';
                
                return `
                <div class="card-cliente ${cardClasseExtra}">
                    <h3>${c.nome}</h3>
                    
                    <div class="container-badges">
                        <span class="status-vencimento ${classeSelo}">${textoSelo}</span>
                        ${seloProlongado}
                    </div>

                    <p class="info-p">Painel: <b>${c.painel}</b>${whatsText}</p>
                    <p class="info-p">Vencimento: <b>${dia}/${mes}/${ano}</b></p>
                    ${obsText}
                    
                    <hr class="card-linha">

                    <div class="flex-botoes-icones">
                        <button class="btn-icone btn-i-renovar" title="RENOVAR" onclick="window.renovarConfirmar('${c.id}', '${c.dataOriginal || c.data}')">
                            <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l.57-1.19"/></svg>
                        </button>
                        
                        <button class="btn-icone btn-i-pago" title="MARCAR PAGO" onclick="window.marcarPago('${c.id}', ${c.pago || false})">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                        </button>

                        <button class="btn-icone btn-i-prolongar" title="PROLONGAR" onclick="window.prolongarCliente('${c.id}', '${dataExibir}')">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </button>
                        
                        <button class="btn-icone btn-i-editar" title="EDITAR" onclick="window.abrirModalEdit('${c.id}','${c.nome}','${c.painel}','${c.whats || ''}','${c.data}','${c.obs || ''}')">
                            <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </button>
                        
                        <button class="btn-icone btn-i-arquivar" title="ARQUIVAR" onclick="window.arquivarCliente('${c.id}', true)">
                            <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        </button>
                        
                        <button class="btn-icone btn-i-excluir" title="EXCLUIR" onclick="window.excluirConfirmar('${c.id}')">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        window.marcarPago = async (id, statusAtual) => {
            await updateDoc(doc(db, "clientes", id), { pago: !statusAtual });
        };

        window.prolongarCliente = async (id, dataAtualStr) => {
            const diasExtra = prompt("Quantos dias deseja prolongar? (Ex: 1, 2 ou 3):", "2");
            if(diasExtra && !isNaN(diasExtra)) {
                const [a, m, d] = dataAtualStr.split('-').map(Number);
                let nd = new Date(a, m - 1, d);
                nd.setDate(nd.getDate() + parseInt(diasExtra));
                
                const novaDataExibicao = nd.toISOString().split('T')[0];
                await updateDoc(doc(db, "clientes", id), { 
                    dataExibicao: novaDataExibicao,
                    prolongado: true
                });
            }
        };

        window.renovarConfirmar = async (id, dataOriginal) => {
            if(confirm("Deseja renovar este cliente por +1 mês?")) {
                const [a, m, d] = dataOriginal.split('-').map(Number);
                let nd = new Date(a, m - 1, d);
                nd.setMonth(nd.getMonth() + 1);
                
                const novaDataBase = nd.toISOString().split('T')[0];
                await updateDoc(doc(db, "clientes", id), { 
                    data: novaDataBase,
                    dataOriginal: novaDataBase,
                    dataExibicao: novaDataBase,
                    pago: false,
                    prolongado: false 
                });
                document.getElementById('modal-pagos').style.display = 'none';
            }
        };

        window.abrirModalPagos = () => {
            const corpo = document.getElementById('lista-pagos-corpo');
            if(!corpo) return;
            if(pagosRaw.length === 0) {
                corpo.innerHTML = "<p style='color:var(--text-sub);text-align:center;font-size:13px;font-weight:600;'>Nenhum cliente na lista de pagos.</p>";
            } else {
                corpo.innerHTML = pagosRaw.map(c => `
                    <div style="background:#f8fafc; padding:14px; border-radius:14px; margin-bottom:8px; border:1px solid var(--card-brd);">
                        <b style="text-transform:uppercase; color:var(--text); font-size:14px;">${c.nome}</b><br>
                        <span style="font-size:12px; color:var(--text-sub)">Painel: ${c.painel} | Vencimento: ${c.data}</span>
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <button onclick="window.renovarConfirmar('${c.id}', '${c.dataOriginal || c.data}')" style="background:var(--primary); border:none; color:#fff; padding:8px 12px; border-radius:10px; font-size:11px; font-weight:800; cursor:pointer;">RENOVAR (+1 MÊS)</button>
                            <button onclick="window.marcarPago('${c.id}', true)" style="background:#e2e8f0; border:none; color:var(--text); padding:8px 12px; border-radius:10px; font-size:11px; font-weight:800; cursor:pointer;">VOLTA PENDENTE</button>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('modal-pagos').style.display = 'flex';
        };

        window.arquivarCliente = async (id, status) => {
            const msg = status ? "Arquivar este cliente?" : "Desarquivar este cliente?";
            if(confirm(msg)) {
                await updateDoc(doc(db, "clientes", id), { arquivado: status });
                if(!status) document.getElementById('modal-arquivados').style.display = 'none';
            }
        };

        window.abrirModalArquivados = () => {
            const corpo = document.getElementById('lista-arquivados-corpo');
            if(!corpo) return;
            if(arquivadosRaw.length === 0) {
                corpo.innerHTML = "<p style='color:var(--text-sub);text-align:center;font-size:13px;font-weight:600;'>Nenhum cliente arquivado.</p>";
            } else {
                corpo.innerHTML = arquivadosRaw.map(c => `
                    <div style="background:#f8fafc; padding:14px; border-radius:14px; margin-bottom:8px; border:1px solid var(--card-brd);">
                        <b style="text-transform:uppercase; color:var(--text); font-size:14px;">${c.nome}</b><br>
                        <span style="font-size:12px; color:var(--text-sub)">Painel: ${c.painel}</span>
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <button onclick="window.arquivarCliente('${c.id}', false)" style="background:var(--primary); border:none; color:#fff; padding:8px 12px; border-radius:10px; font-size:11px; font-weight:800; cursor:pointer;">DESARQUIVAR</button>
                            <button onclick="window.excluirConfirmar('${c.id}')" style="background:var(--danger); border:none; color:#fff; padding:8px 12px; border-radius:10px; font-size:11px; font-weight:800; cursor:pointer;">EXCLUIR</button>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('modal-arquivados').style.display = 'flex';
        };

        window.abrirModalAdd = () => { 
            document.getElementById('edit-id').value = ""; 
            document.getElementById('cli-nome').value = ""; 
            document.getElementById('cli-painel').value = ""; 
            document.getElementById('cli-whats').value = ""; 
            document.getElementById('cli-vencimento').value = ""; 
            document.getElementById('cli-obs').value = ""; 
            document.getElementById('modal-titulo').innerText = "Novo Cliente"; 
            document.getElementById('modal-cliente').style.display = 'flex'; 
        };

        window.abrirModalEdit = (id, n, p, w, d, o) => { 
            document.getElementById('edit-id').value = id; 
            document.getElementById('cli-nome').value = n; 
            document.getElementById('cli-painel').value = p; 
            document.getElementById('cli-whats').value = w; 
            document.getElementById('cli-vencimento').value = d; 
            document.getElementById('cli-obs').value = o; 
            document.getElementById('modal-titulo').innerText = "Editar Cliente"; 
            document.getElementById('modal-cliente').style.display = 'flex'; 
        };

        window.fecharModal = () => document.getElementById('modal-cliente').style.display = 'none';
        
        window.processarCliente = async () => {
            const id = document.getElementById('edit-id').value, 
                  n = document.getElementById('cli-nome').value, 
                  p = document.getElementById('cli-painel').value.toLowerCase().trim(), 
                  w = document.getElementById('cli-whats').value.trim(), 
                  d = document.getElementById('cli-vencimento').value,
                  o = document.getElementById('cli-obs').value;

            if(!n || !p || !d) return alert("Preencha ao menos Nome, Painel e Vencimento!");

            if(id) {
                await updateDoc(doc(db, "clientes", id), { 
                    nome: n, 
                    painel: p, 
                    whats: w, 
                    data: d, 
                    dataOriginal: d,
                    dataExibicao: d,
                    obs: o 
                });
            } else {
                await addDoc(collection(db, "clientes"), { 
                    nome: n, 
                    painel: p, 
                    whats: w, 
                    data: d, 
                    dataOriginal: d,
                    dataExibicao: d,
                    obs: o,
                    dono: logado.login, 
                    arquivado: false, 
                    pago: false,
                    prolongado: false
                });
            }
            window.fecharModal();
        };

        window.excluirConfirmar = async (id) => { 
            if(confirm("Excluir cliente definitivamente?")) {
                await deleteDoc(doc(db, "clientes", id));
                document.getElementById('modal-arquivados').style.display = 'none';
            } 
        };
        
        window.confirmarSair = () => { localStorage.clear(); location.reload(); };
        
        window.filtrar = () => { 
            const t = document.getElementById('busca').value.toLowerCase(); 
            const filtrados = dadosRaw.filter(x => 
                x.nome.toLowerCase().includes(t) || 
                x.painel.toLowerCase().includes(t) || 
                (x.whats && x.whats.includes(t))
            );
            render(filtrados); 
        };
    </script>
