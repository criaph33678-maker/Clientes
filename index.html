<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gestor Pro Elite</title>
    <style>
        :root { 
            --bg: #000000; 
            --card-bg: #1a1a1a; 
            --text: #ffffff; 
            --accent: #3b82f6; 
            --danger: #ff4d4d; 
            --warning: #f59e0b;
            --success: #10b981;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            padding-top: 80px; 
        }

        /* Header Fixo */
        .header-action {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            z-index: 100;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #333;
        }
        .btn-add-top {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* Lembrete */
        .aviso-card { 
            background: var(--card-bg); 
            border-left: 4px solid var(--warning); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
        }
        #textoAviso { 
            border: none; background: transparent; 
            width: 100%; color: var(--warning); 
            font-size: 16px; font-weight: bold; outline: none; 
        }

        /* Cartão do Cliente */
        .cliente-item { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            border: 1px solid #333;
        }
        .urgente { 
            border: 2px solid var(--danger) !important; 
            background: rgba(255, 77, 77, 0.05);
        }

        .cliente-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .info h4 { margin: 0; font-size: 18px; color: #fff; }
        .info p { margin: 4px 0; font-size: 13px; color: #aaa; }

        /* Ações Individuais */
        .acoes-cliente {
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
            padding-top: 12px;
        }

        .btn-acao {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-plus { background: var(--success); color: white; }
        .btn-edit { background: #333; color: white; }
        .btn-del { background: rgba(255, 77, 77, 0.15); color: var(--danger); }

        /* Modal */
        #modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #222;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
        }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #333; border: 1px solid #444; 
            border-radius: 8px; color: white; box-sizing: border-box;
        }
        .btn-save { background: var(--accent); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; }
        .btn-cancel { background: transparent; color: #888; border: none; width: 100%; padding: 10px; }
    </style>
</head>
<body>

    <div class="header-action">
        <button class="btn-add-top" onclick="abrirModal()">+ Novo Cliente</button>
    </div>

    <div class="aviso-card">
        <small style="color:#888">📌 LEMBRETE IMPORTANTE</small>
        <input type="text" id="textoAviso" placeholder="Toque para editar..." onchange="salvarAviso()">
    </div>

    <div id="lista"></div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top:0">Novo Cliente</h3>
            <input type="hidden" id="editId">
            <input type="text" id="nomeCli" placeholder="Nome do Cliente">
            <input type="date" id="dataCli">
            <input type="text" id="painelCli" placeholder="Nome do Painel">
            <button class="btn-save" onclick="salvarCliente()">Confirmar</button>
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('meusClientesProV3')) || [];

        function abrirModal(id = null) {
            document.getElementById('modal').style.display = 'flex';
            if(id) {
                const c = clientes.find(item => item.id === id);
                document.getElementById('modalTitle').innerText = "Editar Cliente";
                document.getElementById('editId').value = c.id;
                document.getElementById('nomeCli').value = c.nome;
                document.getElementById('dataCli').value = c.data;
                document.getElementById('painelCli').value = c.painel;
            } else {
                document.getElementById('modalTitle').innerText = "Novo Cliente";
                document.getElementById('editId').value = "";
                document.getElementById('nomeCli').value = "";
                document.getElementById('dataCli').value = "";
                document.getElementById('painelCli').value = "";
            }
        }

        function fecharModal() { document.getElementById('modal').style.display = 'none'; }

        function salvarCliente() {
            const id = document.getElementById('editId').value;
            const nome = document.getElementById('nomeCli').value;
            const data = document.getElementById('dataCli').value;
            const painel = document.getElementById('painelCli').value;

            if(!nome || !data) return alert("Preencha Nome e Data!");

            if(id) {
                const index = clientes.findIndex(c => c.id == id);
                clientes[index] = { id: Number(id), nome, data, painel };
            } else {
                clientes.push({ id: Date.now(), nome, data, painel });
            }

            atualizarStorage();
            fecharModal();
        }

        function renovar30Dias(id) {
            const index = clientes.findIndex(c => c.id === id);
            let dataAtual = new Date(clientes[index].data);
            dataAtual.setDate(dataAtual.getDate() + 30);
            
            // Formatar de volta para YYYY-MM-DD
            clientes[index].data = dataAtual.toISOString().split('T')[0];
            
            atualizarStorage();
        }

        function excluirCliente(id) {
            if(confirm("Tem certeza que deseja apagar este cliente?")) {
                clientes = clientes.filter(c => c.id !== id);
                atualizarStorage();
            }
        }

        function atualizarStorage() {
            localStorage.setItem('meusClientesProV3', JSON.stringify(clientes));
            render();
        }

        function salvarAviso() {
            localStorage.setItem('meuAvisoProV3', document.getElementById('textoAviso').value);
        }

        function render() {
            const listaDiv = document.getElementById('lista');
            const hoje = new Date();
            hoje.setHours(0,0,0,0);

            clientes.sort((a, b) => {
                const dataA = new Date(a.data);
                const dataB = new Date(b.data);
                const diffA = (dataA - hoje) / (1000 * 60 * 60 * 24);
                const diffB = (dataB - hoje) / (1000 * 60 * 60 * 24);
                const urgA = diffA <= 3 ? 1 : 0;
                const urgB = diffB <= 3 ? 1 : 0;
                if (urgA !== urgB) return urgB - urgA;
                return dataA - dataB;
            });
            
            listaDiv.innerHTML = clientes.map(c => {
                const dataVen = new Date(c.data);
                const diffDias = Math.ceil((dataVen - hoje) / (1000 * 60 * 60 * 24));
                const isUrgente = diffDias <= 3;

                return `
                    <div class="cliente-item ${isUrgente ? 'urgente' : ''}">
                        <div class="cliente-header">
                            <div class="info">
                                <h4>${c.nome} ${isUrgente ? '⚠️' : ''}</h4>
                                <p>🖥️ Painel: ${c.painel}</p>
                                <p style="color: ${isUrgente ? 'var(--danger)' : '#aaa'}">
                                    ${isUrgente ? 'VENCE EM ' + diffDias + ' DIAS' : 'Vence em: ' + c.data.split('-').reverse().join('/')}
                                </p>
                            </div>
                        </div>
                        <div class="acoes-cliente">
                            <button class="btn-acao btn-plus" onclick="renovar30Dias(${c.id})">+30 Dias</button>
                            <button class="btn-acao btn-edit" onclick="abrirModal(${c.id})">Editar</button>
                            <button class="btn-acao btn-del" onclick="excluirCliente(${c.id})">Excluir</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            const avisoSalvo = localStorage.getItem('meuAvisoProV3');
            if(avisoSalvo) document.getElementById('textoAviso').value = avisoSalvo;
        }

        window.onload = render;
    </script>
</body>
</html>
