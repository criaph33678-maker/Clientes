<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>Gestor Business V15.0 - Modern</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root { 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --card-brd: #e2e8f0; 
            --text: #0f172a; 
            --text-sub: #64748b;
            
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --warning: #eab308;
            --success: #10b981;
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.12);
        }
        
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; overflow: hidden; }

        /* TELA DE LOGIN */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100vw; background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); padding: 20px; position: relative; z-index: 5000; }
        .login-card { background: #ffffff; padding: 36px 28px; border-radius: 28px; width: 100%; max-width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.8); box-shadow: var(--shadow-lg); }
        .login-card h2 { color: var(--text); font-size: 22px; font-weight: 800; margin-top: 0; margin-bottom: 24px; letter-spacing: -0.5px; }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--card-brd); background: #f8fafc; color: var(--text); margin-bottom: 14px; outline: none; font-size: 14px; font-weight: 600; transition: border-color 0.2s; }
        .login-card input:focus { border-color: var(--primary); background: #fff; }
        .remember-box { display: flex; align-items: center; gap: 10px; color: var(--text-sub); font-size: 13px; margin-bottom: 24px; cursor: pointer; justify-content: flex-start; width: 100%; font-weight: 600; }
        .remember-box input { accent-color: var(--primary); width: 18px; height: 18px; border-radius: 6px; }
        
        .btn-login-3d { background: var(--primary); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: transform 0.1s, background 0.2s; }
        .btn-login-3d:active { transform: scale(0.98); }

        /* ESTRUTURA DO APP */
        #app { display: none; height: 100vh; width: 100vw; flex-direction: column; background: var(--bg); }

        /* HEADER FIXO NO TOPO */
        .header-fixo { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px; padding-top: calc(env(safe-area-inset-top) + 12px); z-index: 4000; border-bottom: 1px solid var(--card-brd); display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .busca-container { background: #f1f5f9; display: flex; align-items: center; padding: 10px 16px; border-radius: 16px; border: 1px solid #e2e8f0; gap: 10px; }
        .busca-container input { background: none; border: none; color: var(--text); flex: 1; outline: none; font-size: 14px; font-weight: 600; }
        .busca-container input::placeholder { color: #94a3b8; }
        
        .botoes-header-direita { display: flex; align-items: center; gap: 10px; }
        .btn-robo-config { background: #f1f5f9; border: 1px solid #e2e8f0; font-size: 16px; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .btn-sair-input { background: rgba(239, 68, 68, 0.1); border: none; color: var(--danger); font-size: 11px; font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 10px; letter-spacing: 0.5px; text-transform: uppercase; }

        .stats-topo { font-size: 12px; color: var(--text-sub); font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }

        .btn-novo-cliente-topo { background: var(--primary); border: none; color: white; width: 100%; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .botoes-topo-flex { display: flex; gap: 8px; }
        .btn-topo-acao { flex: 1; background: #ffffff; border: 1px solid var(--card-brd); color: var(--text); padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; box-shadow: var(--shadow-sm); }
        .btn-topo-pagos { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }

        /* MURAL */
        .secao-mural { background: transparent; padding: 0; width: 100%; }
        .mural-header-toggle { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn-add-mural { background: #f1f5f9; border: 1px solid #e2e8f0; color: var(--text); font-size: 11px; text-transform: uppercase; font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 10px; flex: 1; }
        .btn-toggle-mural { background: transparent; border: none; color: var(--text-sub); font-size: 11px; font-weight: 700; padding: 8px; cursor: pointer; }
        
        #wrapper-mural-retratil { max-height: 100px; overflow-y: auto; margin-top: 8px; }
        .card-aviso { background: #ffffff; padding: 10px 14px; border-radius: 12px; margin-bottom: 6px; font-size: 12px; font-weight: 600; border-left: 4px solid var(--primary); color: var(--text); box-shadow: var(--shadow-sm); border-top: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }

        /* CONTEÚDO ROLÁVEL */
        .conteudo-rolavel { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: var(--bg); }
        
        /* CARDS DOS CLIENTES (MODERNO) */
        .card-cliente { background: var(--card); border: 1px solid var(--card-brd); border-radius: 20px; padding: 18px; margin-bottom: 14px; position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-md); transition: transform 0.2s, box-shadow 0.2s; }
        .card-cliente.vencido-border { border: 1.5px solid rgba(239, 68, 68, 0.4) !important; box-shadow: 0 4px 16px rgba(239, 68, 68, 0.08); }
        
        .card-cliente h3 { margin: 0 0 6px 0; font-size: 17px; font-weight: 800; color: var(--text); width: 60%; letter-spacing: -0.3px; }
        .info-p { font-size: 13px; color: var(--text-sub); margin: 3px 0; font-weight: 500; }
        .info-p b { color: var(--text); font-weight: 700; }
        .obs-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 10px; font-size: 12px; color: #475569; margin-top: 8px; font-weight: 500; }
        
        .card-linha { height: 1px; background: #f1f5f9; margin: 14px 0; border: none; width: 100%; }

        .container-badges { position: absolute; top: 18px; right: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .selo-prolongado { background: #ffedd5; color: #c2410c; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; border: 1px solid #fed7aa; }
        
        .status-vencimento { font-size: 10px; font-weight: 800; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px; }
        .status-vencimento.em-dia { background: #dcfce7; color: #15803d; }
        .status-vencimento.vence-logo { background: #fef9c3; color: #a16207; }
        .status-vencimento.vencido { background: #fee2e2; color: #b91c1c; }

        /* BOTÕES DE AÇÃO */
        .flex-botoes-icones { display: flex; gap: 8px; justify-content: flex-end; align-items: center; width: 100%; flex-wrap: wrap; }
        
        .btn-icone { width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: #f8fafc; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; padding: 0; box-shadow: var(--shadow-sm); }
        
        .btn-i-renovar { background: #f3e8ff; border-color: #e9d5ff; }
        .btn-i-editar { background: #fef9c3; border-color: #fef08a; }
        .btn-i-pago { background: #dcfce7; border-color: #bbf7d0; }
        .btn-i-prolongar { background: #fff7ed; border-color: #ffedd5; }
        .btn-i-arquivar { background: #dbeafe; border-color: #bfdbfe; }
        .btn-i-excluir { background: #fee2e2; border-color: #fecaca; }

        .btn-icone svg { width: 18px; height: 18px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .btn-i-renovar svg { stroke: #9333ea; }
        .btn-i-editar svg { stroke: #ca8a04; }
        .btn-i-pago svg { stroke: #16a34a; }
        .btn-i-prolongar svg { stroke: #ea580c; }
        .btn-i-arquivar svg { stroke: #2563eb; }
        .btn-i-excluir svg { stroke: #dc2626; }

        .btn-icone:active { transform: scale(0.92); }

        /* MODAIS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); z-index: 6000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #ffffff; width: 100%; max-width: 360px; padding: 28px; border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center; border: 1px solid #f1f5f9; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--card-brd); background: #f8fafc; color: var(--text); font-size: 14px; outline: none; font-weight: 500; }
        .modal-content input:focus, .modal-content textarea:focus { border-color: var(--primary); background: #fff; }
        .modal-content label { display: block; text-align: left; font-size: 11px; font-weight: 800; color: var(--text-sub); margin-top: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .btn-acao-modal { background: var(--primary); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; margin-top: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="login-container">
        <div class="login-card">
            <h2>GESTOR BUSINESS</h2>
            <input type="text" id="u" placeholder="Usuário">
            <input type="password" id="p" placeholder="Senha">
            <label class="remember-box"><input type="checkbox" id="remember"> Lembrar meu acesso</label>
            <button class="btn-login-3d" onclick="window.logar()">ENTRAR</button>
        </div>
    </div>

    <!-- MODAL CONFIGURAÇÃO DO ROBÔ -->
    <div id="modal-robo" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800; color:var(--text);">⚙️ Configurações do Robô</h2>
            
            <label>Mensagem: Próximo Vencimento (2 dias)</label>
            <textarea id="msg-aviso" rows="3" placeholder="Ex: Olá {nome}, seu acesso vence em 2 dias..."></textarea>
            
            <label>Mensagem: Expirado / Dia Crítico</label>
            <textarea id="msg-expirado" rows="3" placeholder="Ex: Atenção {nome}, seu login expira hoje..."></textarea>
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Envios por dia</label>
                    <select id="robo-frequencia">
                        <option value="1">1 vez por dia</option>
                        <option value="2">2 vezes por dia</option>
                    </select>
                </div>
            </div>
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Horário 1</label>
                    <input type="time" id="hora-disparo-1">
                </div>
                <div style="flex:1;">
                    <label>Horário 2</label>
                    <input type="time" id="hora-disparo-2">
                </div>
            </div>

            <button class="btn-acao-modal" onclick="window.salvarConfigRobo()">SALVAR CONFIGURAÇÕES</button>
            <button onclick="document.getElementById('modal-robo').style.display='none'" style="background:none; border:none; color:var(--text-sub); margin-top:14px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;">FECHAR</button>
        </div>
    </div>

    <!-- MODAL CLIENTE (NOVO / EDITAR) -->
    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <h2 id="modal-titulo" style="margin-top:0; font-size:18px; font-weight:800;">Novo Cliente</h2>
            <input type="hidden" id="edit-id">
            <input type="text" id="cli-nome" placeholder="Nome do Cliente">
            <input type="text" id="cli-painel" placeholder="Nome do Painel (Ex: unitv, uniplay)">
            <input type="text" id="cli-whats" placeholder="WhatsApp (Ex: 5548999998888)">
            <input type="date" id="cli-vencimento">
            <textarea id="cli-obs" rows="2" placeholder="Observações (Ex: Usa 2 aparelhos, paga via Pix)"></textarea>
            <button id="btn-salvar" class="btn-acao-modal" onclick="window.processarCliente()">SALVAR DADOS</button>
            <button onclick="window.fecharModal()" style="background:none; border:none; color:var(--text-sub); margin-top:14px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;">CANCELAR</button>
        </div>
    </div>

    <!-- MODAL LISTA DE PAGOS -->
    <div id="modal-pagos" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800; color:var(--success);">Clientes Pagos</h2>
            <div id="lista-pagos-corpo" style="text-align:left; margin-top:12px; max-height: 50vh; overflow-y: auto;"></div>
            <button onclick="document.getElementById('modal-pagos').style.display='none'" class="btn-acao-modal" style="background:#f1f5f9; color:var(--text); box-shadow:none;">FECHAR JANELA</button>
        </div>
    </div>

    <!-- MODAL ARQUIVADOS -->
    <div id="modal-arquivados" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:18px; font-weight:800;">Clientes Arquivados</h2>
            <div id="lista-arquivados-corpo" style="text-align:left; margin-top:12px; max-height: 50vh; overflow-y: auto;"></div>
            <button onclick="document.getElementById('modal-arquivados').style.display='none'" class="btn-acao-modal" style="background:#f1f5f9; color:var(--text); box-shadow:none;">FECHAR JANELA</button>
        </div>
    </div>

    <!-- APLICATIVO -->
    <div id="app">
        <header class="header-fixo">
            <div class="busca-container">
                <input type="text" id="busca" placeholder="Buscar cliente, painel ou whats..." oninput="window.filtrar()">
                <div class="botoes-header-direita">
                    <button class="btn-robo-config" title="Configurar Robô" onclick="window.abrirModalRobo()">⚙️</button>
                    <button class="btn-sair-input" onclick="window.confirmarSair()">SAIR</button>
                </div>
            </div>

            <div class="stats-topo">
                <span id="contagem"></span>
                <span id="btn-ocultar-olho" style="cursor:pointer;" onclick="window.toggleOcultarStatus()">👁️</span>
            </div>

            <button class="btn-novo-cliente-topo" onclick="window.abrirModalAdd()">+ Adicionar Cliente</button>
            
            <div class="botoes-topo-flex">
                <button class="btn-topo-acao btn-topo-pagos" id="btn-aba-pagos" onclick="window.abrirModalPagos()">Pagos (0)</button>
                <button class="btn-topo-acao" id="btn-aba-arquivados" onclick="window.abrirModalArquivados()">Arquivados (0)</button>
            </div>

            <!-- MURAL INTEGRADO -->
            <section class="secao-mural">
                <div class="mural-header-toggle">
                    <button class="btn-add-mural" onclick="window.muralAcao('add')">+ Nota no Mural</button>
                    <button class="btn-toggle-mural" id="btn-hide-mural" onclick="window.toggleMuralVisivel()">Ocultar Mural</button>
                </div>
                <div id="wrapper-mural-retratil">
                    <div id="lista-mural"></div>
                </div>
            </section>
        </header>

        <!-- CONTAINER EXCLUSIVO PARA ROLAGEM -->
        <div class="conteudo-rolavel">
            <section class="lista-clientes" id="lista-corpo"></section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        let app, db;
        let dadosRaw = [];
        let pagosRaw = [];
        let arquivadosRaw = [];
        let logado = null;
        let ocultarValores = false;
        let muralOculto = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            alert("Erro Firebase: " + e.message);
        }

        window.onload = () => {
            const savedU = localStorage.getItem('gestor_u'), savedP = localStorage.getItem('gestor_p');
            if(savedU && savedP) { 
                document.getElementById('u').value = savedU; 
                document.getElementById('p').value = savedP; 
                document.getElementById('remember').checked = true; 
                window.logar(); 
            }
            if(localStorage.getItem('mural_oculto') === 'true') {
                muralOculto = true;
                const el = document.getElementById('wrapper-mural-retratil');
                if(el) el.style.display = 'none';
                const btn = document.getElementById('btn-hide-mural');
                if(btn) btn.innerText = "Exibir Mural";
            }
        };

        window.logar = async () => {
            try {
                const login = document.getElementById('u').value.toLowerCase().trim(), pass = document.getElementById('p').value;
                if(!login || !pass) return alert("Preencha o login e senha!");
                
                const q = query(collection(db, "usuarios"), where("login", "==", login), where("senha", "==", pass));
                const snap = await getDocs(q
