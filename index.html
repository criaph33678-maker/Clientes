<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Gestor Business V13.18</title>
    
    <link rel="manifest" href="data:application/manifest+json,{%22display%22:%22standalone%22,%22start_url%22:%22/%22,%22name%22:%22Gestor%20Business%22,%22theme_color%22:%22#000000%22,%22background_color%22:%22#000000%22}">

    <style>
        :root { --bg: #000; --card: #111; --text: #fff; --accent: #3b82f6; --danger: #ff3b30; --success: #4ade80; --warning: #facc15; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; }

        /* HEADER ORIGINAL ADAPTADO */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 10px 15px; padding-top: env(safe-area-inset-top); z-index: 1000; border-bottom: 1px solid #1a1a1a; }
        .stats-topo { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        
        /* SEÇÃO DE CRÉDITOS FIXA E DISCRETA */
        .creditos-topo { display: flex; gap: 15px; background: #111; padding: 6px 12px; border-radius: 10px; border: 1px solid #222; font-size: 11px; font-weight: bold; color: #aaa; margin-bottom: 8px; }
        .credito-item { cursor: pointer; }
        .credito-item span { color: var(--accent); font-weight: 900; }

        .btn-novo-cliente-topo { background: var(--accent); color: white; border: none; width: 100%; padding: 12px; border-radius: 15px; font-weight: 900; font-size: 13px; margin-bottom: 8px; cursor: pointer; text-transform: uppercase; }
        
        /* LINHA DE BOTÕES EXTRA NO TOPO */
        .botoes-topo-flex { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-topo-acao { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* BARRA DE PESQUISA MENOR */
        .busca-container { background: #1a1a1a; display: flex; align-items: center; padding: 6px 12px; border-radius: 12px; border: 1px solid #333; }
        .busca-container input { background: none; border: none; color: #fff; flex: 1; outline: none; font-size: 13px; }
        
        /* LOGIN */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #111; padding: 30px; border-radius: 25px; width: 85%; max-width: 280px; text-align: center; border: 1px solid #333; }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        .remember-box { display: flex; align-items: center; gap: 8px; color: #888; font-size: 13px; margin-bottom: 20px; cursor: pointer; justify-content: flex-start; width: 100%; }
        .remember-box input { accent-color: var(--accent); width: 18px; height: 18px; }

        /* ESPAÇAMENTO MURAL CORRIGIDO PARA NOVOS ELEMENTOS */
        .secao-mural { margin-top: calc(215px + env(safe-area-inset-top)); padding: 15px 15px 0 15px; }
        .card-aviso { background: #1a1a1a; padding: 12px; border-radius: 15px; margin-bottom: 8px; font-size: 13px; font-weight: bold; border-left: 4px solid var(--accent); color: #fff; cursor: pointer; }
        .btn-add-mural { background: none; border: none; color: var(--accent); font-size: 10px; width: 100%; margin-bottom: 5px; text-transform: uppercase; font-weight: 900; cursor: pointer; }

        /* CARDS E SELOS */
        .lista-clientes { padding: 0 15px 120px 15px; }
        .card-cliente { background: #111; border: 1px solid #333; border-radius: 20px; padding: 15px; margin-bottom: 12px; position: relative; }
        .card-cliente.vence-logo { border: 2px solid var(--danger) !important; box-shadow: 0 0 15px rgba(255, 59, 48, 0.4); }
        .card-cliente h3 { margin: 0 0 5px 0; font-size: 18px; font-weight: 800; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .info-p { font-size: 12px; color: #aaa; margin: 2px 0; }
        
        /* SELO PAGO */
        .selo-pago { background: rgba(74, 222, 128, 0.2); color: var(--success); border: 1px solid var(--success); font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* GRID DE BOTÕES EXPANDIDO */
        .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn-card { padding: 12px; border-radius: 12px; border: none; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .btn-renovar { background: var(--success); color: #000; }
        .btn-editar { background: #333; color: #fff; }
        .btn-pago { background: #1e3a1e; color: #4ade80; border: 1px solid #2e7d32; }
        .btn-arquivar { background: #222; color: #bbb; border: 1px solid #333; }
        .btn-excluir { background: var(--danger); color: #fff; grid-column: span 2; margin-top: 4px; padding: 8px; }

        /* MODAIS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #111; width: 100%; max-width: 400px; padding: 25px; border-radius: 30px; border: 1px solid #333; text-align: center; max-height: 85vh; overflow-y: auto; }
        .modal-content input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; font-size: 16px; }
        .btn-acao-modal { background: var(--success); color: #000; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: 900; margin-top: 15px; cursor: pointer; }

        .btn-sair { position: fixed; top: 12px; right: 15px; background: none; border: none; color: #444; font-size: 10px; z-index: 1100; font-weight: bold; }
        .oculto-click { cursor: pointer; margin-left: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <button class="btn-sair" onclick="confirmarSair()">SAIR</button>

    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <h2 id="modal-titulo" style="margin-top:0">Novo Cliente</h2>
            <input type="hidden" id="edit-id">
            <input type="text" id="cli-nome" placeholder="Nome do Cliente">
            <input type="text" id="cli-painel" placeholder="Nome do Painel (Ex: unitv, uniplay)">
            <input type="date" id="cli-vencimento">
            <button id="btn-salvar" class="btn-acao-modal" onclick="processarCliente()">SALVAR DADOS</button>
            <button onclick="fecharModal()" style="background:none; border:none; color:#888; margin-top:15px; font-weight:bold;">CANCELAR</button>
        </div>
    </div>

    <div id="modal-arquivados" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Clientes Arquivados</h2>
            <div id="lista-arquivados-corpo" style="text-align:left; margin-top:15px;"></div>
            <button onclick="document.getElementById('modal-arquivados').style.display='none'" class="btn-acao-modal" style="background:#333; color:#fff;">FECHAR</button>
        </div>
    </div>

    <div id="tela-login" class="login-container">
        <div class="login-card">
            <h2 style="margin-bottom:25px;">GESTOR BUSINESS</h2>
            <input type="text" id="u" placeholder="Usuário">
            <input type="password" id="p" placeholder="Senha">
            <label class="remember-box"><input type="checkbox" id="remember"> Lembrar meu acesso</label>
            <button onclick="logar()" style="width:100%; padding:15px; background:var(--accent); border:none; color:#fff; border-radius:12px; font-weight:900; cursor:pointer;">ACESSAR</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="header-fixo">
            <div class="stats-topo">
                <span id="contagem"></span>
                <span id="btn-ocultar-olho" class="oculto-click" onclick="toggleOcultarStatus()">👁️</span>
            </div>
            
            <div class="creditos-topo">
                <div class="credito-item" onclick="editarCredito('unitv')">UniTV: <span id="cred-unitv">0</span> cd.</div>
                <div class="credito-item" onclick="editarCredito('uniplay')">UniPlay: <span id="cred-uniplay">0</span> cd.</div>
            </div>

            <button class="btn-novo-cliente-topo" onclick="abrirModalAdd()">+ Adicionar Cliente</button>
            
            <div class="botoes-topo-flex">
                <button class="btn-topo-acao" id="btn-aba-arquivados" onclick="abrirModalArquivados()">Arquivados (0)</button>
            </div>

            <div class="busca-container">
                <input type="text" id="busca" placeholder="Buscar cliente..." oninput="filtrar()">
            </div>
        </header>

        <section class="secao-mural">
            <button class="btn-add-mural" onclick="muralAcao('add')">+ Adicionar Nota</button>
            <div id="lista-mural"></div>
        </section>

        <section class="lista-clientes" id="lista-corpo"></section>
    </div>
