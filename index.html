<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Gestor Business V13.7</title>
    <style>
        :root { --bg: #000; --card: #1a1a1a; --text: #fff; --accent: #3b82f6; --danger: #ff3b30; --warning: #ffcc00; --success: #00ff00; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }

        /* LOGIN */
        #tela-login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background: #111; padding: 30px; border-radius: 25px; border: 1px solid #333; width: 100%; max-width: 350px; text-align: center; }
        .login-card input { width: 100%; padding: 15px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 12px; }
        .btn-entrar { width: 100%; padding: 15px; background: var(--accent); border: none; color: #fff; font-weight: 900; border-radius: 12px; cursor: pointer; }

        /* INTERFACE */
        #app-interface { display: none; padding: 15px; padding-top: calc(150px + env(safe-area-inset-top)); }
        
        /* BOTÃO SAIR */
        .btn-sair-topo { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 15px; background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 11px; z-index: 200; }

        /* HEADER FIXO */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); padding: 10px; padding-top: env(safe-area-inset-top); z-index: 100; border-bottom: 1px solid #333; height: 130px; display: flex; flex-direction: column; justify-content: flex-end; }
        .busca-container { display: flex; gap: 8px; align-items: center; background: #222; padding: 8px 15px; border-radius: 20px; border: 1px solid #444; margin-bottom: 5px; }
        .busca-container input { background: none; border: none; color: white; flex: 1; outline: none; }

        /* MURAL E LISTA */
        .mural-avisos { margin: 20px 0; }
        .secao-titulo { display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 10px; }
        .secao-titulo h5 { margin: 0; text-transform: uppercase; font-size: 14px; }
        .card-aviso { background: #111; border: 1px solid #333; border-left: 6px solid var(--accent); padding: 15px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
        .cliente-item { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 12px; border: 1px solid #333; }
        .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; border-top: 1px solid #333; padding-top: 12px; }
        .btn-acao { padding: 10px; border-radius: 8px; border: none; color: white; font-weight: 800; font-size: 10px; text-transform: uppercase; }

        #btn-add-cliente { background: var(--success); color: black; border: none; padding: 10px; border-radius: 10px; font-weight: 900; width: 100%; margin-bottom: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="tela-login">
        <div class="login-card">
            <h2>Gestor Business</h2>
            <input type="text" id="userInput" placeholder="Usuário">
            <input type="password" id="passInput" placeholder="Senha">
            <button class="btn-entrar" onclick="fazerLogin()">ENTRAR</button>
        </div>
    </div>

    <div id="app-interface">
        <button class="btn-sair-topo" onclick="confirmarSair()">Sair</button>
        
        <div class="header-fixo">
            <div id="status-venc" style="font-size: 10px; margin-bottom: 5px; color: #888;"></div>
            <div class="busca-container">
                <input type="text" id="inputBusca" placeholder="Pesquisar na minha lista..." oninput="filtrarClientes()">
            </div>
        </div>

        <button id="btn-add-cliente" onclick="novoCliente()">+ CADASTRAR NOVO CLIENTE</button>

        <div class="mural-avisos">
            <div class="secao-titulo">
                <h5>📝 Meu Mural de Notas</h5>
                <button onclick="novoLembrete()" style="background:var(--accent); color:white; border:none; border-radius:5px; padding:4px 8px; font-size:10px;">+ NOTA</button>
            </div>
            <div id="listaAvisos"></div>
        </div>

        <div class="secao-titulo"><h5>👥 Meus Clientes Cadastrados</h5></div>
        <div id="listaCorpo"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let todosMeusClientes = [];
        let usuarioLogado = null;

        window.fazerLogin = async () => {
            const u = document.getElementById('userInput').value.toLowerCase().trim();
            const p = document.getElementById('passInput').value;
            const q = query(collection(db, "usuarios"), where("login", "==", u), where("senha", "==", p));
            const snap = await getDocs(q);
            
            if(!snap.empty) {
                usuarioLogado = snap.docs[0].data();
                iniciarApp();
            } else { alert("Acesso negado!"); }
        };

        function iniciarApp() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app-interface').style.display = 'block';
            document.getElementById('status-venc').innerText = `Logado como: ${usuarioLogado.login.toUpperCase()} | Vence: ${usuarioLogado.vencimento.split('-').reverse().join('/')}`;
            
            carregarMeusDados();
            carregarMeuMural();
        }

        // --- CLIENTES DO USUÁRIO ---
        function carregarMeusDados() {
            // O segredo está aqui: Ele só busca clientes onde o 'dono' é o login atual
            const q = query(collection(db, "clientes"), where("dono", "==", usuarioLogado.login), orderBy("data", "asc"));
            onSnapshot(q, (snap) => {
                todosMeusClientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderizarLista(todosMeusClientes);
            });
        }

        window.novoCliente = async () => {
            const nome = prompt("Nome do Cliente:");
            const painel = prompt("Painel/Serviço:");
            const data = prompt("Data Vencimento (AAAA-MM-DD):", new Date().toISOString().split('T')[0]);
            
            if(nome && painel && data) {
                await addDoc(collection(db, "clientes"), {
                    nome, painel, data,
                    dono: usuarioLogado.login // Vincula o cliente ao login de quem criou
                });
            }
        };

        function renderizarLista(lista) {
            document.getElementById('listaCorpo').innerHTML = lista.map(c => `
                <div class="cliente-item">
                    <h4>${c.nome}</h4>
                    <p style="font-size:12px; color:#888;">${c.painel} | Venc: ${c.data.split('-').reverse().join('/')}</p>
                    <div class="acoes">
                        <button class="btn-acao" style="background:#444" onclick="renovar('${c.id}', '${c.data}')">Renovar</button>
                        <button class="btn-acao" style="background:var(--danger)" onclick="excluirItem('${c.id}', 'clientes')">Excluir</button>
                    </div>
                </div>`).join('');
        }

        // --- MURAL DO USUÁRIO ---
        function carregarMeuMural() {
            const q = query(collection(db, "lembretes_privados"), where("usuarioId", "==", usuarioLogado.login), orderBy("criadoEm", "desc"));
            onSnapshot(q, (snap) => {
                document.getElementById('listaAvisos').innerHTML = snap.docs.map(d => `
                    <div class="card-aviso" onclick="excluirItem('${d.id}', 'lembretes_privados')">
                        ${d.data().texto} <br><small style="color:#666">Clique para apagar</small>
                    </div>`).join('');
            });
        }

        window.novoLembrete = async () => {
            const t = prompt("Escreva sua nota:");
            if(t) await addDoc(collection(db, "lembretes_privados"), {
                texto: t,
                usuarioId: usuarioLogado.login,
                criadoEm: Date.now()
            });
        };

        // --- FUNÇÕES GERAIS ---
        window.excluirItem = async (id, pasta) => {
            if(confirm("Deseja excluir permanentemente?")) await deleteDoc(doc(db, pasta, id));
        };

        window.renovar = async (id, data) => {
            let d = new Date(data + 'T23:59:59');
            d.setMonth(d.getMonth() + 1);
            await updateDoc(doc(db, "clientes", id), { data: d.toISOString().split('T')[0] });
        };

        window.confirmarSair = () => { location.reload(); };
        
        window.filtrarClientes = () => {
            const t = document.getElementById('inputBusca').value.toLowerCase();
            renderizarLista(todosMeusClientes.filter(c => c.nome.toLowerCase().includes(t)));
        };
    </script>
</body>
</html>
