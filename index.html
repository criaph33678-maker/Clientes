<script type="module">
  // Importação das funções necessárias do Firebase SDK v10
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    query, 
    where, 
    getDocs 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Suas configurações do Firebase (mantenha a sua firebaseConfig atual)
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "meu-gestor-a7d13.firebaseapp.com",
    projectId: "meu-gestor-a7d13",
    storageBucket: "meu-gestor-a7d13.appspot.com",
    messagingSenderId: "SEU_SENDER_ID",
    appId: "SEU_APP_ID"
  };

  // Inicializa o Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Função principal de Login
  async function autenticarUsuario(usuarioInput, senhaInput) {
    const usuarioFormatado = usuarioInput.toLowerCase().trim();

    try {
      // Busca na coleção "usuarios" onde o campo "login" é igual ao digitado
      const usuariosRef = collection(db, "usuarios");
      const q = query(usuariosRef, where("login", "==", usuarioFormatado));
      const querySnapshot = await getDocs(q);

      // Se não encontrou nenhum documento com esse login
      if (querySnapshot.empty) {
        alert("Usuário ou senha incorretos.");
        return;
      }

      // Extrai os dados do documento encontrado
      let usuarioData = null;
      querySnapshot.forEach((doc) => {
        usuarioData = doc.data();
      });

      // Valida a senha (compara o campo 'senha' do Firestore com o que foi digitado)
      if (usuarioData.senha === senhaInput) {
        // Guarda a sessão (opcional)
        localStorage.setItem("usuarioLogado", JSON.stringify(usuarioData));

        // Redireciona para o painel principal
        window.location.href = "dashboard.html"; // Altere para o nome da sua página principal
      } else {
        alert("Usuário ou senha incorretos.");
      }

    } catch (error) {
      console.error("Erro na autenticação:", error);
      alert("Erro ao conectar ao servidor. Verifique as regras de acesso do Firebase.");
    }
  }

  // Evento do formulário de login
  document.getElementById("formLogin").addEventListener("submit", (e) => {
    e.preventDefault();

    const usuario = document.getElementById("inputUsuario").value;
    const senha = document.getElementById("inputSenha").value;

    autenticarUsuario(usuario, senha);
  });
</script>
