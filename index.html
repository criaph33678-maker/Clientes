<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClientHub">
<title>ClientHub Pro</title>
<style>
:root{--bg:#0b1020;--card:#161f36;--card2:#1d2945;--txt:#e6ebf5;--mut:#8b97b3;--pri:#6366f1;--pri2:#a855f7;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:#2a3756}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#312e81 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#581c87 0%,transparent 55%),var(--bg);color:var(--txt);min-height:100vh;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 8px 20px -8px var(--pri)}
h1{margin:0;font-size:20px;background:linear-gradient(90deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
main{max-width:1100px;margin:auto;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset:auto -20px -30px auto;width:80px;height:80px;border-radius:50%;background:var(--c,#6366f1);opacity:.18}
.stat b{font-size:28px;display:block}.stat span{color:var(--mut);font-size:13px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.alert{background:linear-gradient(90deg,rgba(245,158,11,.18),rgba(245,158,11,.05));border:1px solid rgba(245,158,11,.5);padding:10px 14px;border-radius:12px;font-size:14px}
.alert.bad{background:linear-gradient(90deg,rgba(239,68,68,.2),rgba(239,68,68,.05));border-color:rgba(239,68,68,.6)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
#busca{flex:1;min-width:200px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tab{background:transparent;color:var(--mut);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.tab.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
button{cursor:pointer;font:inherit}
.btn{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border:0;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px -6px rgba(99,102,241,.7)}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;border-left:4px solid var(--ok);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card.alerta{border-left-color:var(--warn)}.card.vencido{border-left-color:var(--bad)}
.cab{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.cab h3{margin:0;font-size:17px}
.cab small{color:var(--mut)}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;height:fit-content;white-space:nowrap}
.b-ok{background:rgba(34,197,94,.15);color:#4ade80}.b-alerta{background:rgba(245,158,11,.15);color:#fbbf24}.b-vencido{background:rgba(239,68,68,.15);color:#f87171}
.info{display:flex;justify-content:space-between;margin:12px 0;color:var(--mut);font-size:14px}
.acoes{display:flex;flex-wrap:wrap;gap:6px}
.acoes button{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:9px;font-size:13px}
.acoes button:hover{border-color:var(--pri)}
.acoes .perigo{color:#f87171}
.vazio{color:var(--mut);text-align:center;padding:40px;border:1px dashed var(--line);border-radius:16px}
.mural-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.mural-form textarea{flex:1;min-width:220px;min-height:60px}
.notas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mural-t{margin:12px 0 6px;font-size:14px;color:var(--mut);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.nota{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--mut);display:flex;flex-direction:column;white-space:pre-wrap;word-break:break-word;font-size:13px}
.nota p{flex:1;margin:0}
.nacoes{display:flex;gap:6px;justify-content:flex-end;margin-top:auto;padding-top:8px}
.nacoes button{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:11px;transition:.2s}
.nacoes button:hover{color:var(--txt);border-color:var(--pri)}
.nacoes button:last-child:hover{color:#f87171;border-color:#f87171}
.nota{transition:border-color .2s}.nota:hover{border-color:var(--pri)}
.cmp{margin:12px 0}.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.cmp-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.cmp-card span{color:var(--mut);font-size:13px}.cmp-card b{display:block;font-size:22px;margin:4px 0}.cmp-card small{font-size:12px}.up{color:#4ade80}.down{color:#f87171}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px #000}
.box h2{margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.form .full{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.det{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.det div{background:var(--card2);border-radius:12px;padding:10px}
.det small{color:var(--mut);display:block;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;transition:.3s;z-index:20}
.toast.on{transform:translateX(-50%) translateY(0)}
.hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.corner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 16px;text-align:center}.corner b{display:block;font-size:22px;background:linear-gradient(90deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}.corner span{font-size:12px;color:var(--mut)}
@media(max-width:560px){.form{grid-template-columns:1fr}.det{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">CH</div><div>
    <div class="sub">ClientHub Pro</div>
    <h1>Área de Clientes</h1>
    <div class="sub" id="data"></div>
  </div></div>
  <div class="hdr-right">
    <div class="corner"><b id="h-total">0</b><span>clientes</span></div>
    <button class="btn ghost" id="btnMural" onclick="toggleMural()">🙈 Ocultar anotações</button>
    <button class="btn" onclick="novo()">+ Novo cliente</button>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat" style="--c:#6366f1"><b id="s-total">0</b><span>Clientes ativos</span></div>
    <div class="stat" style="--c:#f59e0b"><b id="s-alerta">0</b><span>Vencem em 3 dias</span></div>
    <div class="stat" style="--c:#ef4444"><b id="s-vencido">0</b><span>Vencidos</span></div>
    <div class="stat" style="--c:#22c55e"><b id="s-pago">0</b><span>Pagos</span></div>
  </section>

  <section class="cmp" id="cmp"></section>
  <div class="alerts" id="alertas"></div>

  <section id="mural" class="mural">
    <h2 class="mural-t">📌 Mural de anotações</h2>
    <form class="mural-form" onsubmit="addNota(event)">
      <textarea id="notaTxt" placeholder="Escreva um lembrete..." required></textarea>
      <button class="btn" type="submit">Fixar nota</button>
    </form>
    <div id="notas" class="notas"></div>
  </section>
  <div class="bar">
    <input id="busca" type="search" placeholder="🔎 Pesquisar cliente, login, telefone ou plano..." oninput="busca=this.value.toLowerCase();render()">
  </div>

  <nav class="tabs">
    <button class="tab on" data-aba="ativos" onclick="setAba('ativos')">Clientes</button>
    <button class="tab" data-aba="pagos" onclick="setAba('pagos')">Pagos</button>
    <button class="tab" data-aba="arquivados" onclick="setAba('arquivados')">Arquivados</button>
  </nav>

  <section id="lista" class="grid"></section>
</main>

<!-- Formulário de cliente -->
<div class="modal" id="mForm">
  <form class="box" onsubmit="salvar(event)">
    <h2 id="tForm">Novo cliente</h2>
    <div class="form">
      <label class="full">Nome *<input id="f-nome" required></label>
      <label>Login / usuário<input id="f-login"></label>
      <label>Telefone / WhatsApp<input id="f-tel" placeholder="(11) 99999-9999"></label>
      <label>Plano / serviço<input id="f-plano"></label>
      <label>Valor (R$)<input id="f-valor" type="number" step="0.01" min="0"></label>
      <label class="full">Data de vencimento *<input id="f-venc" type="date" required></label>
      <label class="full">Observações<textarea id="f-obs" rows="3"></textarea></label>
    </div>
    <div class="row">
      <button type="button" class="btn ghost" onclick="fechar('mForm')">Cancelar</button>
      <button class="btn" type="submit">Salvar</button>
    </div>
  </form>
</div>

<!-- Painel do cliente -->
<div class="modal" id="mPainel">
  <div class="box" id="painelConteudo"></div>
</div>

<!-- Editar anotação -->
<div class="modal" id="mNota">
  <form class="box" onsubmit="salvarNota(event)">
    <h2>✏️ Editar anotação</h2>
    <textarea id="nTxt" rows="5" style="width:100%" required></textarea>
    <div class="row"><button type="button" class="btn ghost" onclick="fechar('mNota')">Cancelar</button><button class="btn" type="submit">Salvar</button></div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'clienthub-pro-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const hoje = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dias = v => Math.round((parse(v) - hoje()) / 86400000);
const fmt = v => parse(v).toLocaleDateString('pt-BR');
const brl = n => Number(n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const digits = t => String(t || '').replace(/\D/g, '');

function addDias(v, n) {
  const base = dias(v) < 0 ? hoje() : parse(v);
  base.setDate(base.getDate() + n);
  return ymd(base);
}

let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { db = null; }
if (!db) {
  const t = ymd(new Date());
  db = {
    clientes: [
      {id:uid(), nome:'Exemplo: Maria Silva', login:'maria.silva', telefone:'11999990000', plano:'Plano Premium', valor:150, venc:addDias(t,2), pago:false, arquivado:false, obs:'Cliente exemplo — pode excluir.'},
      {id:uid(), nome:'Exemplo: João Costa', login:'joao.costa', telefone:'21988880000', plano:'Plano Básico', valor:90, venc:addDias(t,20), pago:true, arquivado:false, obs:''}
    ],
    notas: [{id:uid(), texto:'Bem-vindo ao seu mural! Anote lembretes aqui.', cor:'#fde68a'}]
  };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} }

let aba = 'ativos', busca = '', editId = null;

function status(c) {
  const n = dias(c.venc);
  if (n < 0) return ['vencido', 'Vencido há ' + Math.abs(n) + 'd'];
  if (n === 0) return ['alerta', 'Vence hoje'];
  if (n <= 3) return ['alerta', 'Vence em ' + n + 'd'];
  return ['ok', 'Em dia'];
}

function setAba(a) {
  aba = a;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.aba === a));
  render();
}

function render() {
  const ativos = db.clientes.filter(c => !c.arquivado);
  $('#s-total').textContent = ativos.filter(c => !c.pago).length;
  $('#s-alerta').textContent = ativos.filter(c => { const n = dias(c.venc); return n >= 0 && n <= 3; }).length;
  $('#s-vencido').textContent = ativos.filter(c => dias(c.venc) < 0).length;
  $('#s-pago').textContent = ativos.filter(c => c.pago).length;
  renderCmp();
  $('#h-total').textContent = db.clientes.filter(c => !c.arquivado).length;
  applyMural();
  $('#data').textContent = 'Hoje: ' + hoje().toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});

  const avisos = ativos
    .filter(c => dias(c.venc) <= 3)
    .sort((a,b) => dias(a.venc) - dias(b.venc))
    .map(c => {
      const n = dias(c.venc);
      const txt = n < 0 ? `⛔ <b>${esc(c.nome)}</b> venceu em ${fmt(c.venc)}` :
                  n === 0 ? `⚠️ <b>${esc(c.nome)}</b> vence hoje` :
                  `⏰ <b>${esc(c.nome)}</b> vence em ${n} dia(s) (${fmt(c.venc)})`;
      return `<div class="alert ${n < 0 ? 'bad' : ''}">${txt}</div>`;
    }).join('');
  $('#alertas').innerHTML = avisos;

  renderNotas();
  $('#mural').style.display = db.config && db.config.ocultarMural ? 'none' : 'block';

  let lista = db.clientes.filter(c => {
    if (aba === 'ativos') return !c.arquivado && !c.pago;
    if (aba === 'pagos') return !c.arquivado && c.pago;
    if (aba === 'arquivados') return c.arquivado;
    return true;
  });
  if (busca) lista = lista.filter(c => [c.nome, c.login, c.telefone, c.plano].some(x => String(x || '').toLowerCase().includes(busca)));
  lista.sort((a,b) => dias(a.venc) - dias(b.venc));

  $('#lista').innerHTML = lista.length ? lista.map(card).join('') :
    `<div class="vazio">${busca ? 'Nenhum cliente encontrado para "' + esc(busca) + '".' : 'Nada aqui ainda.'}</div>`;
}

function card(c) {
  const [cls, txt] = status(c);
  return `
  <div class="card ${cls}">
    <div class="cab" onclick="painel('${c.id}')">
      <div><h3>${esc(c.nome)}</h3><small>${esc(c.login || '—')} · ${esc(c.plano || 'Sem plano')}</small></div>
      <span class="badge b-${cls}">${txt}</span>
    </div>
    <div class="info"><span>📅 ${fmt(c.venc)}</span><span>💰 ${brl(c.valor)}</span></div>
    <div class="acoes">
      <button onclick="editar('${c.id}')">✏️ Editar</button>
      <button onclick="renovar('${c.id}')">🔄 Renovar</button>
      <button onclick="pagar('${c.id}')">${c.pago ? '↩️ Desmarcar pago' : '💚 Pago'}</button>
      <button onclick="arquivar('${c.id}')">📦 ${c.arquivado ? 'Desarquivar' : 'Arquivar'}</button>
      <button class="perigo" onclick="excluir('${c.id}')">🗑️ Excluir</button>
    </div>
  </div>`;
}

function renderNotas() {
  $('#notas').innerHTML = db.notas.length ? db.notas.map(n => `
    <div class="nota">
      <p onclick="editNota('${n.id}')" title="Clique para editar" style="cursor:pointer">${esc(n.texto)}</p>
      <div class="nacoes"><button onclick="editNota('${n.id}')">✏️ Editar</button><button onclick="delNota('${n.id}')">✕</button></div>
    </div>`).join('') : `<div class="vazio" style="grid-column:1/-1">Nenhuma anotação ainda.</div>`;
}

function addNota(e) {
  e.preventDefault();
  db.notas.unshift({id: uid(), texto: $('#notaTxt').value.trim(), cor: ''});
  $('#notaTxt').value = '';
  save(); render(); toast('Nota fixada 📌');
}

function editNota(id) {
  const n = db.notas.find(x => x.id === id);
  if (!n) return;
  notaEdit = id;
  $('#nTxt').value = n.texto;
  abrir('mNota');
}
let notaEdit = null;
function salvarNota(e) {
  e.preventDefault();
  const n = db.notas.find(x => x.id === notaEdit);
  if (n) n.texto = $('#nTxt').value.trim();
  save(); fechar('mNota'); render(); toast('Anotação atualizada ✏️');
}
function delNota(id) { db.notas = db.notas.filter(n => n.id !== id); save(); render(); }

function applyMural() {
  const oculto = !!(db.config && db.config.ocultarMural);
  $('#mural').style.display = oculto ? 'none' : 'block';
  $('#btnMural').textContent = oculto ? '👁 Mostrar anotações' : '🙈 Ocultar anotações';
  if (oculto && aba === 'mural') {
    aba = 'ativos';
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.aba === 'ativos'));
  }
}
function toggleMural() {
  db.config = db.config || {};
  db.config.ocultarMural = !db.config.ocultarMural;
  save(); render();
}

function novo() {
  editId = null;
  $('#tForm').textContent = 'Novo cliente';
  ['nome','login','tel','plano','valor','venc','obs'].forEach(k => $('#f-' + k).value = '');
  $('#f-venc').value = ymd(new Date());
  abrir('mForm');
}

function editar(id) {
  const c = db.clientes.find(x => x.id === id);
  if (!c) return;
  editId = id;
  $('#tForm').textContent = 'Editar cliente';
  $('#f-nome').value = c.nome || ''; $('#f-login').value = c.login || '';
  $('#f-tel').value = c.telefone || ''; $('#f-plano').value = c.plano || '';
  $('#f-valor').value = c.valor ?? ''; $('#f-venc').value = c.venc || '';
  $('#f-obs').value = c.obs || '';
  abrir('mForm');
}

function salvar(e) {
  e.preventDefault();
  const dados = {
    nome: $('#f-nome').value.trim(), login: $('#f-login').value.trim(),
    telefone: $('#f-tel').value.trim(), plano: $('#f-plano').value.trim(),
    valor: parseFloat($('#f-valor').value) || 0, venc: $('#f-venc').value,
    obs: $('#f-obs').value.trim()
  };
  if (editId) {
    Object.assign(db.clientes.find(x => x.id === editId), dados);
  } else {
    db.clientes.push({id: uid(), ...dados, pago: false, arquivado: false, criadoEm: ymd(new Date()), pagoEm: null});
  }
  save(); fechar('mForm'); render(); toast('Cliente salvo ✅');
}

function renovar(id) {
  const c = db.clientes.find(x => x.id === id);
  c.venc = addDias(c.venc, 30);
  c.pago = false;
  c.arquivado = false;
  save(); render(); toast('Renovado por +30 dias 🔄 novo vencimento: ' + fmt(c.venc));
}

function pagar(id) {
  const c = db.clientes.find(x => x.id === id);
  c.pago = !c.pago;
  c.pagoEm = c.pago ? ymd(new Date()) : null;
  save(); render(); toast(c.pago ? 'Marcado como pago 💚' : 'Marcado como não pago');
}

function arquivar(id) {
  const c = db.clientes.find(x => x.id === id);
  c.arquivado = !c.arquivado;
  save(); render(); toast(c.arquivado ? 'Cliente arquivado 📦' : 'Cliente desarquivado');
}

let delPend = null;
function excluir(id) {
  const c = db.clientes.find(x => x.id === id);
  if (delPend !== id) { delPend = id; toast('Toque em Excluir novamente para confirmar 🗑️'); return; }
  delPend = null;
  db.clientes = db.clientes.filter(x => x.id !== id);
  save(); render(); toast('Cliente excluído 🗑️');
}

function painel(id) {
  const c = db.clientes.find(x => x.id === id);
  if (!c) return;
