<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Gestor Business V13.23</title>
    
    <style>
        :root { 
            --bg: #000; 
            --card: #0d0d11; 
            --card-brd: #1f1f26; 
            --text: #fff; 
            
            --3d-blue: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            --3d-blue-shadow: #1e3a8a;
            
            --3d-green: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            --3d-green-shadow: #14532d;
            
            --3d-pago: linear-gradient(180deg, #06b6d4 0%, #0369a1 100%);
            --3d-pago-shadow: #0c4a6e;
            
            --3d-purple: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%);
            --3d-purple-shadow: #4c1d95;
            
            --3d-danger: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            --3d-danger-shadow: #7f1d1d;

            --3d-gray: linear-gradient(180deg, #4b5563 0%, #1f2937 100%);
            --3d-gray-shadow: #111827;
        }
        
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; }

        /* HEADER FIXO - BARRA NO INÍCIO */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: #000; padding: 12px 15px; padding-top: env(safe-area-inset-top); z-index: 1000; border-bottom: 1px solid var(--card-brd); box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
        
        /* BUSCA NO INÍCIO */
        .busca-container { background: #16161f; display: flex; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid #2d2d3d; }
        .busca-container input { background: none; border: none; color: #fff; flex: 1; outline: none; font-size: 14px; font-weight: 600; }
        
        .stats-topo { font-size: 11px; color: #aaa; font-weight: 700; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
        
        .creditos-topo { display: flex; gap: 12px; background: #111116; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--card-brd); font-size: 12px; font-weight: 700; color: #bbb; }
        .credito-item { cursor: pointer; }
        .credito-item span { color: #38bdf8; font-weight: 800; text-shadow: 0 0 5px rgba(56,189,248,0.4); }

        /* BOTÃO ADICIONAR CLIENTE 3D */
        .btn-novo-cliente-topo { background: var(--3d-blue); border: none; border-bottom: 3px solid var(--3d-blue-shadow); color: white; width: 100%; padding: 11px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-novo-cliente-topo:active { border-bottom-width: 1px; margin-top: 2px; margin-bottom: -2px; }
        
        .botoes-topo-flex { display: flex; gap: 6px; }
        .btn-topo-acao { flex: 1; background: var(--3d-gray); border: none; border-bottom: 3px solid var(--3d-gray-shadow); color: #fff; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-topo-acao:active { border-bottom-width: 1px; padding-top: 9px; padding-bottom: 7px; }

        /* TELA DE LOGIN - VERMELHO EXTRA FORTE GARANTIDO */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; z-index: 5000; position: fixed; top: 0; left: 0; background: #000; }
        .login-card { background: var(--card); padding: 35px 25px; border-radius: 24px; width: 85%; max-width: 290px; text-align: center; border: 3px solid #ff0033; box-shadow: 0 0 25px rgba(255, 0, 51, 0.7), inset 0 0 15px rgba(255, 0, 51, 0.2); }
        .login-card h2 { color: #fff; font-size: 20px; font-weight: 900; margin-top: 0; margin-bottom: 20px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #2d2d3a; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 12px; outline: none; font-size: 15px; font-weight: 600; }
        .remember-box { display: flex; align-items: center; gap: 8px; color: #999; font-size: 13px; margin-bottom: 22px; cursor: pointer; justify-content: flex-start; width: 100%; font-weight: 600; }
        .remember-box input { accent-color: #ff0033; width: 18px; height: 18px; }
        
        .btn-login-3d { background: var(--3d-danger); border: none; border-bottom: 4px solid var(--3d-danger-shadow); color: #fff; width: 100%; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 14px; letter-spacing: 0.5px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .btn-login-3d:active { border-bottom-width: 1px; padding-top: 14px; padding-bottom: 10px; }

        /* CONTAINER DE ROLAGEM */
        .conteudo-rolavel { position: absolute; top: calc(250px + env(safe-area-inset-top)); bottom: 0; left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 15px 40px 15px; box-sizing: border-box; }
        
        /* SEÇÃO DO MURAL COM BOTÃO AZUL DESTACADO */
        .secao-mural { padding: 15px 0 5px 0; }
        .mural-header-toggle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
