<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Gestor Business V13.18</title>
    
    <link rel="manifest" href="data:application/manifest+json,{%22display%22:%22standalone%22,%22start_url%22:%22/%22,%22name%22:%22Gestor%20Business%22,%22theme_color%22:%22#000000%22,%22background_color%22:%22#000000%22}">

    <style>
        :root { --bg: #000; --card: #111; --card-brd: #1e1e24; --text: #fff; --accent: #2563eb; --danger: #dc2626; --success: #16a34a; --warning: #ca8a04; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        /* HEADER TOTALMENTE FIXO NO TOPO */
        .header-fixo { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); padding: 10px 15px; padding-top: env(safe-area-inset-top); z-index: 1000; border-bottom: 1px solid #16161a; }
        .stats-topo { font-size: 11px; color: #666; font-weight: 600; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        
        .creditos-topo { display: flex; gap: 12px; background: #0c0c0e; padding: 6px 12px; border-radius: 10px; border: 1px solid #16161a; font-size: 11px; font-weight: 600; color: #888; margin-bottom: 8px; }
        .credito-item { cursor: pointer; }
        .credito-item span { color: #60a5fa; font-weight: 700; }

        .btn-novo-cliente-topo { background: var(--accent); color: white; border: none; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 12px; margin-bottom: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; }
        
        .botoes-topo-flex { display: flex; gap: 6px; margin-bottom: 8px; }
        .btn-topo-acao { flex: 1; background: #0c0c0e; border: 1px solid #16161a; color: #aaa; padding: 6px; border-radius: 8px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        /* BARRA DE PESQUISA OTIMIZADA NO TOPO */
        .busca-container { background: #0c0c0e; display: flex; align-items: center; padding: 6px 12px; border-radius: 10px; border: 1px solid #16161a; }
        .busca-container input { background: none; border: none; color: #fff; flex: 1; outline: none; font-size: 12px; }
        
        /* LOGIN */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #0c0c0e; padding: 30px; border-radius: 20px; width: 85%; max-width: 280px; text-align: center; border: 1px solid #16161a; }
        .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #16161a; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; outline: none; font-size: 14px; }
        .remember-box { display: flex; align-items: center; gap: 8px; color: #666; font-size: 12px; margin-bottom: 20px; cursor: pointer; justify-content: flex-start; width: 100%; }
        .remember-box input { accent-color: var(--accent); width: 16px; height: 16px; }

        /* SEÇÃO DO MURAL COM SUPORTE A OCULTAR */
        .secao-mural { margin-top: calc(210px + env(safe-area-inset-top)); padding: 15px 15px 0 15px; }
        .mural-header-toggle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .btn-toggle-mural { background: #0c0c0e; border: 1px solid #16161a; color: #888; font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
        .container-mural-retratil { display: block; } /* Controlado via JS */
        
        .card-aviso { background: #0c0c0e; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; font-size: 12px; font-weight: 500; border-left: 3px solid var(--accent); color: #ccc; cursor: pointer; border-top: 1px solid #16161a; border-right: 1px solid #16161a; border-bottom: 1px solid #16161a; }
        .btn-add-mural { background: none; border: none; color: #60a5fa; font-size: 9px; text-transform: uppercase; font-weight: 700; cursor: pointer; padding: 2px 0; text-align: left; }

        /* LISTA E CARDS DE CLIENTES ELEGANTES */
        .lista-clientes { padding: 10px 15px 120px 15px; }
        .card-cliente { background: #0c0c0e; border: 1px solid #16161a; border-radius: 16px; padding: 14px; margin-bottom: 10px; position: relative; }
        .card-cliente.vence-logo { border: 1px solid rgba(220, 38, 38, 0.5) !important; box-shadow: 0 0 10px rgba(220, 38, 38, 0.15); }
        .card-cliente h3 { margin: 0 0 4px 0; font-size: 15px; font-weight: 700; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.3px; }
        .info-p { font-size: 11px; color: #71717a; margin: 2px 0; }
        
        /* SELO PAGO DISCRETO */
        .selo-pago { background: rgba(22, 163, 74, 0.1); color: #4ade80; border: 1px solid rgba(22, 163, 74, 0.3); font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 6px; text-transform: uppercase; }

        /* GRID DE BOTÕES PEQUENOS E DISCRETOS */
        .grid-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
        .btn-card { padding: 8px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 10px; text-transform: uppercase; cursor: pointer; letter-spacing: 0.2px; transition: all 0.2s; }
        .btn-renovar { background: var(--success); color: #fff; }
        .btn-editar { background: #16161a; color: #ccc; border-color: #27272a; }
        .btn-pago { background: #14281a; color: #4ade80; border-color: #1b3d25; }
        .btn-arquivar { background: #16161a; color: #aaa; border-color: #27272a; }
        .btn-excluir { background: rgba(220, 38, 38, 0.1); color: #f87171; border-color: rgba(220, 38, 38, 0.2); grid-column: span 2; margin-top: 2px; padding: 6px; font-size: 9px; }

        /* MODAIS REFINADOS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 2000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #0c0c0e; width: 100%; max-width: 360px; padding: 20px; border-radius: 20px; border: 1px solid #16161a; text-align: center; max-height: 80vh; overflow-y: auto; }
        .modal-content input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #16161a; background: #000; color: #fff; box-sizing: border-box; font-size: 14px; outline: none; }
        .btn-acao-modal { background: var(--accent); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; margin-top: 12px; cursor: pointer; font-size: 13px; text-transform: uppercase; }

        .btn-sair { position: fixed; top: 12px; right: 15px; background: none; border: none; color: #444; font-size: 9px; z-index: 1100; font-weight: 600; letter-spacing: 0.5px; }
        .oculto-click { cursor: pointer; margin-left: 5px; font-size: 11px; }
    </style>
</head>
<body>

    <button class="btn-sair" onclick="confirmarSair()">SAIR</button>

    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <h2 id="modal-titulo" style="margin-top:0; font-size:16px;">Novo Cliente</h2>
            <input type="hidden" id="edit-id">
            <input type="text" id="cli-nome" placeholder="Nome do Cliente">
            <input type="text" id="cli-painel" placeholder="Nome do Painel (Ex: unitv, uniplay)">
            <input type="date" id="cli-vencimento">
            <button id="btn-salvar" class="btn-acao-modal" onclick="processarCliente()">SALVAR DADOS</button>
            <button onclick="fecharModal()" style="background:none; border:none; color:#666; margin-top:12px; font-weight:600; font-size:11px; cursor:pointer;">CANCELAR</button>
        </div>
    </div>

    <div id="modal-arquivados" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size:16px;">Clientes Arquivados</h2>
            <div id="lista-arquivados-corpo" style="text-align:left; margin-top:12px;"></div>
            <button onclick="document.getElementById('modal-arquivados').style.display='none'" class="btn-acao-modal" style="background:#16161a; color:#ccc; font-size:11px;">FECHAR JANELA</button>
        </div>
    </div>

    <div id="tela-login" class="login-container">
        <div class="login-card">
            <h2 style="margin-bottom:20px; font-size:18px; font-weight:800; letter-spacing:0.5px;">GESTOR BUSINESS</h2>
            <input type="text" id="u" placeholder="Usuário">
            <input type="password" id="p" placeholder="Senha">
            <label class="remember-box"><input type="checkbox" id="remember"> Lembrar meu acesso</label>
            <button onclick="logar()" style="width:100%; padding:12px; background:var(--accent); border:none; color:#fff; border-radius:10px; font-weight:700; cursor:pointer; font-size:13px;">ACESSAR</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="header-fixo">
            <div class="stats-topo">
                <span id="contagem"></span>
                <span id="btn-ocultar-olho" class="oculto-click" onclick="toggleOcultarStatus()">👁️</span>
            </div>
            
            <div class="creditos-topo">
                <div class="credito-item" onclick="editarCredito('unitv')">UniTV: <span id="cred-unitv">0</span> cd.</div>
                <div class="credito-item" onclick="editarCredito('uniplay')">UniPlay: <span id="cred-uniplay">0</span> cd.</div>
            </div>

            <button class="btn-novo-cliente-topo" onclick="abrirModalAdd()">+ Adicionar Cliente</button>
            
            <div class="botoes-topo-flex">
                <button class="btn-topo-acao" id="btn-aba-arquivados" onclick="abrirModalArquivados()">Arquivados (0)</button>
            </div>

            <div class="busca-container">
                <input type="text" id="busca" placeholder="Buscar cliente ou painel..." oninput="filtrar()">
            </div>
        </header>

        <section class="secao-mural">
            <div class="mural-header-toggle">
                <button class="btn-add-mural" onclick="muralAcao('add')">+ Nota no Mural</button>
                <button class="btn-toggle-mural" id="btn-hide-mural" onclick="toggleMuralVisivel()">Ocultar Mural</button>
            </div>
            <div id="wrapper-mural-retratil" class="container-mural-retratil">
                <div id="lista-mural"></div>
            </div>
        </section>

        <section class="lista-clientes" id="lista-corpo"></section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMQbFBbbKFABCwwTxuESpXsz_Knz-V4FI",
            authDomain: "meu-gestor-a7d13.firebaseapp.com",
            projectId: "meu-gestor-a7d13",
            storageBucket: "meu-gestor-a7d13.firebasestorage.app",
            messagingSenderId: "1019995087685",
            appId: "1:1019995087685:web:a063af65a4b7f234b4542c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let dadosRaw = [];
        let arquivadosRaw = [];
        let logado = null;
        let ocultarValores = false;
        let muralOculto = false;

        window.onload = () => {
            const savedU = localStorage.getItem('gestor_u'), savedP = localStorage.getItem('gestor_p');
            if(savedU && savedP) { document.getElementById('u').value = savedU; document.getElementById('p').value = savedP; document.getElementById('remember').checked = true; logar(); }
            
            // Carrega preferência do mural
            if(localStorage.getItem('mural_oculto') === 'true') {
                muralOculto = true;
                document.getElementById('wrapper-mural-retratil').style.display = 'none';
                document.getElementById('btn-hide-mural').innerText = "Exibir Mural";
            }
        };

        window.logar = async () => {
            const login = document.getElementById('u').value.toLowerCase().trim(), pass = document.getElementById('p').value;
            const q = query(collection(db, "usuarios"), where("login", "==", login), where("senha", "==", pass));
            const snap = await getDocs(q);
            if(!snap.empty) { 
                logado = snap.docs[0].data();
                if(document.getElementById('remember').checked) { localStorage.setItem('gestor_u', login); localStorage.setItem('gestor_p', pass); }
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                carregarDados();
            } else { alert("Login incorreto!"); }
        };

        function carregarDados() {
            const qC = (logado.login === 'admin') ? query(collection(db, "clientes"), orderBy("data", "asc")) : query(collection(db, "clientes"), where("dono", "==", logado.login), orderBy("data", "asc"));
            onSnapshot(qC, (snap) => {
                let temp = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                let filtradoDono = (logado.login === 'admin') ? temp.filter(c => !c.dono || c.dono === 'admin') : temp;
                dadosRaw = filtradoDono.filter(c => !c.arquivado);
                arquivadosRaw = filtradoDono.filter(c => c.arquivado === true);
                
                atualizarContadores();
                render(dadosRaw);
            });

            onSnapshot(doc(db, "creditos", logado.login), (docSnap) => {
                if(docSnap.exists()){
                    const data = docSnap.data();
                    document.getElementById('cred-unitv').innerText = data.unitv || 0;
                    document.getElementById('cred-uniplay').innerText = data.uniplay || 0;
                } else {
                    setDoc(doc(db, "creditos", logado.login), { unitv: 0, uniplay: 0 });
                }
            });

            const colMural = logado.login === 'admin' ? "avisos" : "lembretes_privados";
            const qM = (logado.login === 'admin') ? query(collection(db, "avisos"), orderBy("criadoEm", "desc")) : query(collection(db, "lembretes_privados"), where("usuarioId", "==", logado.login), orderBy("criadoEm", "desc"));
            onSnapshot(qM, (snap) => {
                document.getElementById('lista-mural').innerHTML = snap.docs.map(d => `
                    <div class="card-aviso" onclick="muralAcao('edit', '${d.id}', '${d.data().texto || d.data().textoAviso}')">📢 ${d.data().texto || d.data().textoAviso}</div>
                `).join('');
            });
        }

        window.toggleMuralVisivel = () => {
            muralOculto = !muralOculto;
            document.getElementById('wrapper-mural-retratil').style.display = muralOculto ? 'none' : 'block';
            document.getElementById('btn-hide-mural').innerText = muralOculto ? "Exibir Mural" : "Ocultar Mural";
            localStorage.setItem('mural_oculto', muralOculto);
        };

        window.toggleOcultarStatus = () => {
            ocultarValores = !ocultarValores;
            document.getElementById('btn-ocultar-olho').innerText = ocultarValores ? "🙈" : "👁️";
            atualizarContadores();
        };

        function atualizarContadores() {
            document.getElementById('btn-aba-arquivados').innerText = `Arquivados (${arquivadosRaw.length})`;
            if(ocultarValores) {
                document.getElementById('contagem').innerHTML = "Dados ocultados com sucesso!";
                return;
            }
            const contPaineis = {};
            dadosRaw.forEach(c => contPaineis[c.painel] = (contPaineis[c.painel] || 0) + 1);
            let htmlS = ""; for (const p in contPaineis) htmlS += `${p}: <b>${contPaineis[p]}</b> | `;
            document.getElementById('contagem').innerHTML = htmlS + `Total: <b>${dadosRaw.length}</b>`;
        }

        window.editarCredito = async (painel) => {
            const atual = parseInt(document.getElementById(`cred-${painel}`).innerText) || 0;
            const novo = prompt(`Digite a nova quantidade de créditos para ${painel.toUpperCase()}:`, atual);
            if(novo !== null && !isNaN(novo)) {
                const obj = {}; obj[painel] = parseInt(novo);
                await updateDoc(doc(db, "creditos", logado.login), obj);
            }
        };

        window.muralAcao = async (tipo, id, textoAntigo) => {
            const col = logado.login === 'admin' ? "avisos" : "lembretes_privados";
            if(tipo === 'add') {
                const t = prompt("Nova anotação:");
                if(t) await addDoc(collection(db, col), logado.login === 'admin' ? { textoAviso: t, criadoEm: Date.now() } : { texto: t, usuarioId: logado.login, criadoEm: Date.now() });
            } else {
                const acao = confirm("Deseja EXCLUIR? (Cancele para EDITAR)");
                if(acao) { if(confirm("Apagar nota?")) await deleteDoc(doc(db, col, id)); }
                else {
                    const nt = prompt("Editar nota:", textoAntigo);
                    if(nt && nt !== textoAntigo) await updateDoc(doc(db, col, id), logado.login === 'admin' ? { textoAviso: nt } : { texto: nt });
                }
            }
        };

        function render(lista) {
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            document.getElementById('lista-corpo').innerHTML = lista.map(c => {
                const [ano, mes, dia] = c.data.split('-');
                const v = new Date(ano, mes - 1, dia, 23, 59, 59);
                const diff = Math.ceil((v - hoje) / 86400000);
                const seloPago = c.pago ? `<span class="selo-pago">✓ Pago</span>` : '';
                
                return `
                <div class="card-cliente ${diff <= 3 ? 'vence-logo' : ''}">
                    <h3><span>${c.nome}</span> ${seloPago}</h3>
                    <p class="info-p">Painel: <b>${c.painel}</b> | Expira: <b>${dia}/${mes}/${ano}</b></p>
                    <div class="grid-botoes">
                        <button class="btn-card btn-renovar" onclick="renovarConfirmar('${c.id}', '${c.data}', '${c.painel}')">+1 MÊS</button>
                        <button class="btn-card btn-editar" onclick="abrirModalEdit('${c.id}','${c.nome}','${c.painel}','${c.data}')">EDITAR</button>
                        <button class="btn-card btn-pago" onclick="marcarPago('${c.id}', ${c.pago || false})">PAGO</button>
                        <button class="btn-card btn-arquivar" onclick="arquivarCliente('${c.id}', true)">ARQUIVAR</button>
                        <button class="btn-card btn-excluir" onclick="excluirConfirmar('${c.id}')">EXCLUIR</button>
                    </div>
                </div>`;
            }).join('');
        }

        window.marcarPago = async (id, statusAtual) => {
            await updateDoc(doc(db, "clientes", id), { pago: !statusAtual });
        };

        window.arquivarCliente = async (id, status) => {
            const msg = status ? "Arquivar este cliente?" : "Desarquivar este cliente?";
            if(confirm(msg)) {
                await updateDoc(doc(db, "clientes", id), { arquivado: status });
                if(!status) document.getElementById('modal-arquivados').style.display = 'none';
            }
        };

        window.abrirModalArquivados = () => {
            const corpo = document.getElementById('lista-arquivados-corpo');
            if(arquivadosRaw.length === 0) {
                corpo.innerHTML = "<p style='color:#444;text-align:center;font-size:12px;'>Nenhum cliente arquivado.</p>";
            } else {
                corpo.innerHTML = arquivadosRaw.map(c => `
                    <div style="background:#0c0c0e; padding:12px; border-radius:12px; margin-bottom:8px; border:1px solid #16161a;">
                        <b style="text-transform:uppercase; color:#fff; font-size:13px;">${c.nome}</b><br>
                        <span style="font-size:11px; color:#666">Painel: ${c.painel}</span>
                        <div style="display:flex; gap:6px; margin-top:8px;">
                            <button onclick="arquivarCliente('${c.id}', false)" style="background:var(--accent); color:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:10px; font-weight:bold; cursor:pointer;">DESARQUIVAR</button>
                            <button onclick="excluirConfirmar('${c.id}')" style="background:rgba(220,38,38,0.1); color:#f87171; border:1px solid rgba(220,38,38,0.2); padding:6px 10px; border-radius:6px; font-size:10px; font-weight:bold; cursor:pointer;">EXCLUIR</button>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('modal-arquivados').style.display = 'flex';
        };

        window.abrirModalAdd = () => { document.getElementById('edit-id').value = ""; document.getElementById('cli-nome').value = ""; document.getElementById('cli-painel').value = ""; document.getElementById('cli-vencimento').value = ""; document.getElementById('modal-titulo').innerText = "Novo Cliente"; document.getElementById('modal-cliente').style.display = 'flex'; };
        window.abrirModalEdit = (id, n, p, d) => { document.getElementById('edit-id').value = id; document.getElementById('cli-nome').value = n; document.getElementById('cli-painel').value = p; document.getElementById('cli-vencimento').value = d; document.getElementById('modal-titulo').innerText = "Editar Cliente"; document.getElementById('modal-cliente').style.display = 'flex'; };
        window.fecharModal = () => document.getElementById('modal-cliente').style.display = 'none';
        
        window.processarCliente = async () => {
            const id = document.getElementById('edit-id').value, n = document.getElementById('cli-nome').value, p = document.getElementById('cli-painel').value.toLowerCase().trim(), d = document.getElementById('cli-vencimento').value;
            if(!n || !p || !d) return alert("Preencha tudo!");
            if(id) {
                await updateDoc(doc(db, "clientes", id), { nome: n, painel: p, data: d });
            } else {
                await addDoc(collection(db, "clientes"), { nome: n, painel: p, data: d, dono: logado.login, arquivado: false, pago: false });
            }
            fecharModal();
        };

        window.renovarConfirmar = async (id, data, painelCli) => {
            if(confirm("Deseja renovar por mais 1 mês?")) {
                const [a, m, d] = data.split('-').map(Number);
                let nd = new Date(a, m, d); if (nd.getDate() != d) nd.setDate(0);
                
                await updateDoc(doc(db, "clientes", id), { data: nd.toISOString().split('T')[0], pago: false });

                const painelNormalizado = painelCli.toLowerCase().trim();
                if(painelNormalizado === 'unitv' || painelNormalizado === 'uniplay') {
                    const docRef = doc(db, "creditos", logado.login);
                    const docSnap = await getDoc(docRef);
                    if(docSnap.exists()){
                        const totalAtual = docSnap.data()[painelNormalizado] || 0;
                        if(totalAtual > 0) {
                            const dec = {}; dec[painelNormalizado] = totalAtual - 1;
                            await updateDoc(docRef, dec);
                        }
                    }
                }
            }
        };

        window.excluirConfirmar = async (id) => { 
            if(confirm("Excluir cliente definitivamente?")) {
                await deleteDoc(doc(db, "clientes", id));
                document.getElementById('modal-arquivados').style.display = 'none';
            } 
        };
        
        window.confirmarSair = () => { localStorage.clear(); location.reload(); };
        
        window.filtrar = () => { 
            const t = document.getElementById('busca').value.toLowerCase(); 
            const filtrados = dadosRaw.filter(x => x.nome.toLowerCase().includes(t) || x.painel.toLowerCase().includes(t));
            render(filtrados); 
        };
    </script>
</body>
</html>
